<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진도표 관리</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; }

/* Login */
#loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%); }
.login-box { background: white; border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.login-logo { font-size: 36px; text-align: center; margin-bottom: 8px; }
.login-title { font-size: 20px; font-weight: 800; color: #0f172a; text-align: center; margin-bottom: 4px; }
.login-sub { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 24px; }
.login-input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; transition: border 0.2s; margin-bottom: 12px; }
.login-input:focus { border-color: #3b82f6; }
.login-btn { width: 100%; padding: 13px; background: #1e3a8a; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
.login-btn:hover { background: #1d4ed8; }
.login-btn:disabled { background: #94a3b8; cursor: not-allowed; }
.login-error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 8px; min-height: 20px; }

/* App */
#app { display: none; }
.header { background: #1e3a8a; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.header-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.header-actions { display: flex; gap: 8px; }
.btn { padding: 8px 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: #3b82f6; color: white; }
.btn-amber { background: #fef3c7; color: #d97706; }
.btn-gray { background: #e2e8f0; color: #374151; }
.btn-danger { background: #fee2e2; color: #dc2626; }

.main { padding: 16px; max-width: 1400px; margin: 0 auto; }

/* Tabs */
.tabs { display: flex; background: #f1f5f9; padding: 5px; border-radius: 12px; margin-bottom: 16px; gap: 4px; }
.tab-btn { flex: 1; padding: 9px 0; border: none; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; background: transparent; color: #64748b; transition: all 0.2s; }
.tab-btn.active { background: white; color: #3b82f6; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

/* Table */
.syl-table-wrap { overflow-x: auto; }
.syl-table { border-collapse: collapse; width: 100%; background: white; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; }
.syl-table th { background: #1e3a8a; color: white; padding: 10px 12px; font-size: 13px; font-weight: 700; text-align: center; border-right: 1px solid #2d4fa0; }
.syl-table td { border-right: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0; }

/* Status board */
.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.status-card { background: white; border-radius: 14px; padding: 16px; border: 1px solid #e2e8f0; }

/* Modals */
.modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal-box { background: white; border-radius: 16px; padding: 24px; width: 100%; max-height: 92vh; overflow-y: auto; }

/* Empty state */
.empty-state { text-align: center; padding: 48px; background: white; border-radius: 14px; border: 2px dashed #e2e8f0; }
.empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
.empty-state h3 { font-weight: 800; color: #334155; font-size: 15px; margin-bottom: 6px; }
.empty-state p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

.form-input { width: 100%; padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; outline: none; }
.form-input:focus { border-color: #3b82f6; }

.loading { text-align: center; padding: 30px; color: #94a3b8; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">📋</div>
    <div class="login-title">진도표 관리</div>
    <div class="login-sub">교사용 시스템</div>
    <input type="password" id="loginPw" class="login-input" placeholder="교사 비밀번호" onkeydown="if(event.key==='Enter') doLogin()">
    <button id="loginBtn" class="login-btn" onclick="doLogin()">로그인</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <div class="header">
    <div class="header-title">📋 진도표 관리</div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openPlanEdit()">✏️ 계획 편집</button>
      <button class="btn btn-amber" onclick="openBulkPlannedDate()">📅 예정일 일괄</button>
      <button class="btn btn-gray" onclick="openSylSettings()">⚙️ 설정</button>
    </div>
  </div>

  <div class="main">
    <!-- 탭 -->
    <div class="tabs">
      <button id="tab-1" class="tab-btn active" onclick="switchTab(1)">📋 진도표</button>
      <button id="tab-2" class="tab-btn" onclick="switchTab(2)">📊 반별 현황</button>
      <button id="tab-3" class="tab-btn" onclick="switchTab(3)">🎯 시험 범위</button>
    </div>

    <!-- 탭1: 진도표 -->
    <div id="tab-content-1">
      <div class="syl-table-wrap">
        <div id="sylTableWrap"><div class="loading">불러오는 중...</div></div>
      </div>
    </div>

    <!-- 탭2: 반별 현황 -->
    <div id="tab-content-2" style="display:none;">
      <div id="sylStatusBoard"></div>
    </div>

    <!-- 탭3: 시험 범위 -->
    <div id="tab-content-3" style="display:none;">
      <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap;">
        <input type="text" id="examName" class="form-input" placeholder="시험명 (예: 1학기 중간고사)" style="flex:1;min-width:180px;">
        <button class="btn btn-primary" onclick="saveExamRange()" style="padding:10px 16px;">저장</button>
      </div>
      <div style="background:white;border-radius:12px;padding:16px;border:1px solid #e2e8f0;margin-bottom:16px;">
        <div style="font-size:13px;font-weight:700;color:#334155;margin-bottom:10px;">시험 범위에 포함할 차시를 선택하세요</div>
        <div id="examLessonCheckboxes" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>
      <div id="examRangeList"></div>
    </div>
  </div>
</div>

<!-- 계획 편집 모달 -->
<div id="planEditModal" class="modal-bg">
  <div class="modal-box" style="max-width:680px;">
    <h3 style="margin:0 0 6px;font-size:17px;font-weight:800;color:#0f172a;">✏️ 진도 계획 편집</h3>
    <div style="font-size:12px;color:#64748b;margin-bottom:16px;">차시별 계획 내용과 메모를 입력하세요.</div>
    <div id="planEditRows" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;"></div>
    <button onclick="addPlanRow()" style="background:#f1f5f9;color:#475569;border:1px dashed #cbd5e1;padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;width:100%;">+ 차시 추가</button>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
      <button class="btn btn-gray" onclick="closePlanEdit()">취소</button>
      <button class="btn btn-primary" onclick="savePlan()" id="savePlanBtn">저장</button>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div id="sylSettingsModal" class="modal-bg">
  <div class="modal-box" style="max-width:420px;">
    <h3 style="margin:0 0 6px;font-size:17px;font-weight:800;color:#0f172a;">⚙️ 진도표 설정</h3>
    <div style="font-size:12px;color:#64748b;margin-bottom:14px;">진도표에 표시할 반을 선택하세요.</div>
    <div id="sylClassCheckSetting" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-gray" onclick="document.getElementById('sylSettingsModal').classList.remove('open')">취소</button>
      <button class="btn" style="background:#10b981;color:white;" onclick="saveSylSettings()">저장</button>
    </div>
  </div>
</div>

<!-- 예정일 일괄 모달 -->
<div id="bulkPlannedModal" class="modal-bg">
  <div class="modal-box" style="max-width:520px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div style="font-size:16px;font-weight:800;color:#0f172a;">📅 예정일 빠른 입력</div>
      <button onclick="document.getElementById('bulkPlannedModal').classList.remove('open')" style="background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;">✕</button>
    </div>
    <div style="margin-bottom:10px;font-size:12px;color:#64748b;">각 차시의 예정일을 직접 입력하세요.</div>
    <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;">
      <select id="bulkTargetCls" class="form-input" style="flex:1;padding:7px;">
        <option value="all">전체 반 동일 적용</option>
      </select>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;">
        <input type="checkbox" id="bulkOverwrite2"> 기존 예정일 덮어쓰기
      </label>
    </div>
    <div id="bulkDateRows" style="display:flex;flex-direction:column;gap:4px;max-height:55vh;overflow-y:auto;"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn btn-gray" style="flex:1;" onclick="document.getElementById('bulkPlannedModal').classList.remove('open')">취소</button>
      <button class="btn btn-amber" style="flex:2;font-weight:800;" onclick="applyBulkPlannedDate()">📅 저장</button>
    </div>
  </div>
</div>

<!-- 날짜 체크 모달 -->
<div id="checkDateModal" class="modal-bg">
  <div class="modal-box" style="max-width:360px;">
    <h3 style="margin:0 0 14px;font-size:16px;font-weight:800;color:#0f172a;" id="checkDateTitle">날짜 / 특이사항</h3>
    <input type="hidden" id="checkLessonNo">
    <input type="hidden" id="checkCls">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div>
        <div style="font-size:12px;font-weight:700;color:#10b981;margin-bottom:5px;">✅ 실제 수업일</div>
        <input type="date" id="checkDate" class="form-input">
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:#f59e0b;margin-bottom:5px;">📅 예상 수업일</div>
        <input type="date" id="checkPlannedDate" class="form-input">
      </div>
    </div>
    <div style="font-size:13px;color:#64748b;margin-bottom:6px;">메모 (선택)</div>
    <textarea id="checkMemo" class="form-input" rows="4" placeholder="반 특이사항, 진도 차이, 학생 반응 등" style="margin-bottom:16px;resize:vertical;min-height:80px;"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button id="checkCancelBtn" class="btn btn-danger" onclick="cancelCheck()" style="display:none;">체크 해제</button>
      <button class="btn btn-gray" onclick="document.getElementById('checkDateModal').classList.remove('open')">취소</button>
      <button class="btn" style="background:#10b981;color:white;" onclick="confirmCheck()">확인</button>
    </div>
  </div>
</div>

<script>
var sylPlanCache   = [];
var sylCheckCache  = {};
var sylClassList   = [];
var examRangeCache = [];
var allClasses     = [];

// ─── 로그인 ───
function doLogin() {
  var pw = document.getElementById('loginPw').value.trim();
  if (!pw) return;
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '로그인 중...';
  document.getElementById('loginError').textContent = '';
  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = '로그인';
      if (res.success) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadData();
      } else {
        document.getElementById('loginError').textContent = res.message || '로그인 실패';
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = '로그인';
      document.getElementById('loginError').textContent = '오류: ' + e.message;
    })
    .verifyTeacher(pw);
}

// ─── 데이터 로드 ───
function loadData() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) allClasses = res.classes || [];
    })
    .getClassList();
  loadSyllabusData();
}

function loadSyllabusData() {
  var wrap = document.getElementById('sylTableWrap');
  if (wrap) wrap.innerHTML = '<div class="loading">불러오는 중...</div>';
  google.script.run
    .withFailureHandler(function(err) {
      if (wrap) wrap.innerHTML = '<div style="color:#ef4444;padding:16px;">오류: ' + err.message + '</div>';
    })
    .withSuccessHandler(function(res) {
      if (!res.success) return;
      sylPlanCache   = res.plans      || [];
      sylCheckCache  = res.checks     || {};
      sylClassList   = (res.classes && res.classes.length > 0) ? res.classes : (allClasses.length > 0 ? allClasses.slice() : []);
      examRangeCache = res.examRanges || [];
      switchTab(1);
    })
    .getSyllabusData();
}

// ─── 탭 전환 ───
function switchTab(n) {
  [1,2,3].forEach(function(i) {
    var btn = document.getElementById('tab-' + i);
    var con = document.getElementById('tab-content-' + i);
    if (!btn || !con) return;
    var active = i === n;
    btn.classList.toggle('active', active);
    con.style.display = active ? 'block' : 'none';
  });
  if (n === 1) renderSylTable();
  if (n === 2) renderSylStatusBoard();
  if (n === 3) renderExamRangeTab();
}

// ─── 주별 색상 ───
function getWeekColor(dateStr) {
  if (!dateStr) return null;
  var pp = String(dateStr).split('/');
  if (pp.length !== 2) return null;
  var yr = new Date().getMonth() < 2 && parseInt(pp[0]) >= 11 ? new Date().getFullYear()-1 : new Date().getFullYear();
  var d = new Date(yr, parseInt(pp[0])-1, parseInt(pp[1]));
  var jan1 = new Date(d.getFullYear(), 0, 1);
  var wk = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  var pal = ['#bfdbfe','#bbf7d0','#fed7aa','#ddd6fe','#fef08a','#fecdd3','#bae6fd'];
  return pal[wk % pal.length];
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── 진도표 렌더 ───
function renderSylTable() {
  var wrap = document.getElementById('sylTableWrap');
  if (!wrap) return;
  if (sylPlanCache.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="emoji">📋</div><h3>아직 계획이 없어요</h3><p>상단 "✏️ 계획 편집" 버튼으로 차시별 계획을 먼저 입력하세요.</p><button class="btn btn-primary" onclick="openPlanEdit()">+ 계획 입력하기</button></div>';
    return;
  }
  var cols = (sylClassList.length > 0 ? sylClassList : allClasses).filter(function(x){ return x && x !== 'undefined'; });
  var html = '<table class="syl-table" style="min-width:' + (320 + cols.length*100) + 'px;"><thead><tr>';
  html += '<th style="min-width:52px;">차시</th>';
  html += '<th style="text-align:left;padding:10px 16px;">계획 내용</th>';
  cols.forEach(function(cls) {
    var yearMatch = cls.match(/\d+학년/);
    var yearPart  = yearMatch ? yearMatch[0] : '';
    var shortCls  = cls.replace(yearPart + ' ', '');
    html += '<th style="min-width:90px;">'
      + (yearPart ? '<div style="font-size:10px;opacity:0.7;font-weight:500;margin-bottom:2px;">' + yearPart + '</div>' : '')
      + '<div>' + shortCls + '</div></th>';
  });
  html += '</tr></thead><tbody>';
  sylPlanCache.forEach(function(plan) {
    html += '<tr>';
    html += '<td style="text-align:center;padding:12px 8px;font-weight:800;font-size:14px;color:#1e3a8a;">' + plan.lessonNo + '</td>';
    html += '<td style="padding:10px 16px;cursor:pointer;" onclick="openPlanEdit(' + plan.lessonNo + ')">' +
      (plan.content
        ? '<div style="font-size:13px;font-weight:600;color:#1e293b;">' + escapeHtml(plan.content) + '</div>' +
          (plan.memo ? '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">' + escapeHtml(plan.memo) + '</div>' : '')
        : '<div style="font-size:12px;color:#cbd5e1;font-style:italic;">클릭하여 내용 입력</div>') + '</td>';
    cols.forEach(function(cls) {
      var key  = plan.lessonNo + '_' + cls;
      var done = sylCheckCache[key];
      if (done && done.date) {
        var wkColor = getWeekColor(done.date) || '#f0fdf4';
        html += '<td style="padding:3px 4px;background:' + wkColor + ';border-top:2px solid rgba(0,0,0,0.08);">'
          + '<div style="display:flex;align-items:flex-start;gap:4px;min-height:36px;">'
            + '<div style="display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;">'
              + '<span data-ln="' + plan.lessonNo + '" data-cl="' + escapeHtml(cls) + '" onclick="openCheckDate(parseInt(this.dataset.ln),this.dataset.cl)" style="font-size:15px;cursor:pointer;" title="클릭하여 수정">✅</span>'
              + '<span style="font-size:9px;color:#065f46;font-weight:700;white-space:nowrap;">' + done.date + '</span>'
              + (done.plannedDate ? '<span style="font-size:8px;color:#f59e0b;white-space:nowrap;">예상 ' + done.plannedDate + '</span>' : '')
            + '</div>'
            + (done.memo ? '<div style="flex:1;background:rgba(255,255,255,0.9);border-radius:4px;padding:2px 5px;border-left:2px solid #6366f1;min-width:0;">'
              + '<span style="font-size:9px;color:#3730a3;line-height:1.4;display:block;word-break:keep-all;" title="' + escapeHtml(done.memo) + '">' + escapeHtml(done.memo) + '</span>'
              + '</div>' : '')
          + '</div></td>';
      } else if (done && done.plannedDate) {
        var wkColor2 = getWeekColor(done.plannedDate);
        html += '<td style="text-align:center;padding:6px 4px;background:' + (wkColor2||'#fffbeb') + ';opacity:0.75;border-top:2px dashed rgba(0,0,0,0.1);">'
          + '<div style="display:flex;flex-direction:column;align-items:center;gap:1px;">'
          + '<span data-ln="' + plan.lessonNo + '" data-cl="' + escapeHtml(cls) + '" onclick="openCheckDate(parseInt(this.dataset.ln),this.dataset.cl)" style="font-size:16px;cursor:pointer;" title="클릭하여 완료 체크">☐</span>'
          + '<span style="font-size:10px;color:#f59e0b;font-weight:700;">📅 ' + done.plannedDate + '</span>'
          + '</div></td>';
      } else {
        html += '<td style="text-align:center;padding:8px 4px;">'
          + '<span data-ln="' + plan.lessonNo + '" data-cl="' + escapeHtml(cls) + '" onclick="openCheckDate(parseInt(this.dataset.ln),this.dataset.cl)" '
          + 'style="display:inline-block;width:22px;height:22px;border:2px solid #d1d5db;border-radius:4px;cursor:pointer;background:white;" '
          + 'title="클릭하여 날짜 입력"></span></td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += '<div style="display:flex;gap:12px;padding:10px 4px;font-size:12px;color:#64748b;flex-wrap:wrap;">'
    + '<span>✅ = 수업 완료</span>'
    + '<span style="color:#f59e0b;">📅 = 예상 날짜만</span>'
    + '<span>☐ = 미입력</span>'
    + '<span style="color:#94a3b8;">· 칸 클릭하여 실제/예상 날짜 입력</span>'
    + '</div>';
  wrap.innerHTML = html;
}

// ─── 날짜 체크 모달 ───
function openCheckDate(lessonNo, cls) {
  document.getElementById('checkLessonNo').value = lessonNo;
  document.getElementById('checkCls').value = cls;
  document.getElementById('checkDateTitle').textContent = lessonNo + '차시 — ' + cls;
  var key = lessonNo + '_' + cls;
  var existing = sylCheckCache[key] || {};
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var existDate = '';
  if (existing.date) {
    var parts = existing.date.split('/');
    if (parts.length === 2) existDate = today.getFullYear() + '-' + parts[0].padStart(2,'0') + '-' + parts[1].padStart(2,'0');
  }
  document.getElementById('checkDate').value = existDate || todayStr;
  document.getElementById('checkMemo').value = existing.memo || '';
  var existPlanned = '';
  if (existing.plannedDate) {
    var pp = existing.plannedDate.split('/');
    if (pp.length === 2) existPlanned = today.getFullYear() + '-' + pp[0].padStart(2,'0') + '-' + pp[1].padStart(2,'0');
  }
  document.getElementById('checkPlannedDate').value = existPlanned;
  document.getElementById('checkCancelBtn').style.display = existing.date ? 'inline-block' : 'none';
  document.getElementById('checkDateModal').classList.add('open');
}

function cancelCheck() {
  var lessonNo = parseInt(document.getElementById('checkLessonNo').value);
  var cls      = document.getElementById('checkCls').value;
  var key      = lessonNo + '_' + cls;
  if (!sylCheckCache[key] || !sylCheckCache[key].date) {
    document.getElementById('checkDateModal').classList.remove('open'); return;
  }
  if (!confirm(lessonNo + '차시 ' + cls + ' 체크를 해제할까요?')) return;
  document.getElementById('checkDateModal').classList.remove('open');
  delete sylCheckCache[key];
  renderSylTable();
  google.script.run.withSuccessHandler(function(){}).deleteSyllabusCheck(lessonNo, cls);
}

function confirmCheck() {
  var lessonNo    = parseInt(document.getElementById('checkLessonNo').value);
  var cls         = document.getElementById('checkCls').value;
  var date        = document.getElementById('checkDate').value;
  var plannedDate = document.getElementById('checkPlannedDate').value;
  var memo        = document.getElementById('checkMemo').value.trim();
  if (!date && !plannedDate) return alert('실제 수업일 또는 예상 수업일을 입력하세요.');
  document.getElementById('checkDateModal').classList.remove('open');
  var key = lessonNo + '_' + cls;
  var dispDate = '', dispPlanned = '';
  if (date) { var d1 = new Date(date + 'T00:00:00'); dispDate = (d1.getMonth()+1) + '/' + d1.getDate(); }
  if (plannedDate) { var d2 = new Date(plannedDate + 'T00:00:00'); dispPlanned = (d2.getMonth()+1) + '/' + d2.getDate(); }
  sylCheckCache[key] = { date: dispDate, memo: memo, plannedDate: dispPlanned };
  renderSylTable();
  google.script.run
    .withSuccessHandler(function(res) { if (!res.success) alert('오류: ' + (res.message||'')); })
    .saveSyllabusCheck({ lessonNo: lessonNo, cls: cls, date: date, memo: memo, plannedDate: plannedDate });
}

// ─── 계획 편집 ───
function openPlanEdit(focusLesson) {
  var rows = document.getElementById('planEditRows');
  rows.innerHTML = '';
  var data = sylPlanCache.length > 0 ? sylPlanCache
    : Array.from({length: 11}, function(_,i){ return {lessonNo:i+1,content:'',material:'',memo:''}; });
  data.forEach(function(p) { addPlanRow(p); });
  document.getElementById('planEditModal').classList.add('open');
  if (focusLesson) {
    setTimeout(function() {
      var inputs = document.querySelectorAll('#planEditRows .plan-content-input');
      inputs.forEach(function(inp) {
        if (parseInt(inp.dataset.lesson) === focusLesson) { inp.focus(); inp.select(); }
      });
    }, 100);
  }
}

function closePlanEdit() {
  document.getElementById('planEditModal').classList.remove('open');
}

function addPlanRow(plan) {
  plan = plan || { lessonNo: (document.querySelectorAll('#planEditRows > div').length + 1), content:'', memo:'' };
  var div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:52px 1fr 1fr 36px;gap:6px;align-items:start;padding:8px;background:#f8fafc;border-radius:8px;';
  div.innerHTML =
    '<div style="text-align:center;font-weight:800;color:#1e3a8a;font-size:13px;padding-top:6px;">' + plan.lessonNo + '차시</div>' +
    '<input data-lesson="' + plan.lessonNo + '" class="plan-content-input form-input" type="text" placeholder="수업 내용" value="' + escapeHtml(plan.content||'') + '" style="font-size:13px;">' +
    '<textarea class="plan-memo-input form-input" placeholder="메모 (목표, 준비물, 참고사항 등)" style="font-size:12px;resize:vertical;min-height:36px;height:60px;">' + escapeHtml(plan.memo||'') + '</textarea>' +
    '<button onclick="this.parentElement.remove()" class="btn btn-danger" style="padding:6px;margin-top:2px;">✕</button>';
  document.getElementById('planEditRows').appendChild(div);
}

function savePlan() {
  var btn = document.getElementById('savePlanBtn');
  var rows = document.querySelectorAll('#planEditRows > div');
  var plans = [];
  rows.forEach(function(row, idx) {
    var content = row.querySelector('.plan-content-input').value.trim();
    var memoEl  = row.querySelector('.plan-memo-input');
    var memo    = memoEl ? (memoEl.value || memoEl.textContent || '').trim() : '';
    plans.push({ lessonNo: idx + 1, content: content, material: '', memo: memo });
  });
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.textContent = '저장'; }
      if (!res.success) { alert('오류: ' + (res.message||'')); return; }
      document.getElementById('planEditModal').classList.remove('open');
      loadSyllabusData();
    })
    .saveSyllabusPlan(plans);
}

// ─── 반 설정 ───
function openSylSettings() {
  var cols = allClasses.length > 0 ? allClasses : sylClassList;
  var box = document.getElementById('sylClassCheckSetting');
  box.innerHTML = cols.map(function(c) {
    var checked = sylClassList.indexOf(c) >= 0 ? 'checked' : '';
    return '<label style="display:flex;align-items:center;gap:5px;background:#f8fafc;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #e2e8f0;">' +
      '<input type="checkbox" value="' + escapeHtml(c) + '" name="sylSettingClass" ' + checked + ' style="accent-color:#3b82f6;"> ' + escapeHtml(c) + '</label>';
  }).join('');
  document.getElementById('sylSettingsModal').classList.add('open');
}

function saveSylSettings() {
  var sel = Array.from(document.querySelectorAll('input[name="sylSettingClass"]:checked')).map(function(b){return b.value;});
  sylClassList = sel.length > 0 ? sel : allClasses.slice();
  document.getElementById('sylSettingsModal').classList.remove('open');
  google.script.run.withSuccessHandler(function(){}).saveSylClassList(sylClassList);
  renderSylTable();
}

// ─── 반별 현황 ───
function renderSylStatusBoard() {
  var board = document.getElementById('sylStatusBoard');
  if (!board) return;
  var cols = (sylClassList.length > 0 ? sylClassList : allClasses).filter(function(x){ return x && x !== 'undefined'; });
  if (sylPlanCache.length === 0) {
    board.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">계획을 먼저 입력하세요.</div>';
    return;
  }
  var total = sylPlanCache.length;
  var html = '<div class="status-grid">';
  cols.forEach(function(cls) {
    var done = 0;
    sylPlanCache.forEach(function(p) { if (sylCheckCache[p.lessonNo + '_' + cls] && sylCheckCache[p.lessonNo + '_' + cls].date) done++; });
    var pct = total > 0 ? Math.round(done/total*100) : 0;
    var color = pct === 100 ? '#10b981' : pct >= 50 ? '#3b82f6' : '#f59e0b';
    var lastDone = 0;
    sylPlanCache.forEach(function(p) { if (sylCheckCache[p.lessonNo+'_'+cls] && sylCheckCache[p.lessonNo+'_'+cls].date) lastDone = p.lessonNo; });
    var lastPlan = lastDone < total ? sylPlanCache.find(function(p){return p.lessonNo===lastDone+1;}) : null;
    html += '<div class="status-card" style="border-top:4px solid ' + color + ';">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
        '<div style="font-size:16px;font-weight:800;color:#0f172a;">' + escapeHtml(cls) + '</div>' +
        '<div style="font-size:13px;font-weight:800;color:' + color + ';">' + done + ' / ' + total + '차시</div>' +
      '</div>' +
      '<div style="background:#f1f5f9;border-radius:20px;height:8px;overflow:hidden;margin-bottom:10px;">' +
        '<div style="background:' + color + ';height:100%;width:' + pct + '%;border-radius:20px;transition:0.3s;"></div>' +
      '</div>' +
      '<div style="font-size:11px;color:#64748b;">' +
        (lastDone > 0 ? '📌 ' + lastDone + '차시까지 완료' : '아직 시작 전') +
        (lastPlan && lastPlan.content ? ' &nbsp;·&nbsp; 다음: ' + escapeHtml(lastPlan.content) : '') +
      '</div></div>';
  });
  html += '</div>';
  board.innerHTML = html;
}

// ─── 시험 범위 ───
function renderExamRangeTab() {
  var box = document.getElementById('examLessonCheckboxes');
  if (box) {
    box.innerHTML = sylPlanCache.map(function(p) {
      return '<label style="display:flex;align-items:center;gap:5px;background:#f8fafc;padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid #e2e8f0;">' +
        '<input type="checkbox" value="' + p.lessonNo + '" style="accent-color:#7c3aed;"> ' +
        p.lessonNo + '차시' + (p.content ? ' · ' + escapeHtml(p.content.substring(0,14)) : '') + '</label>';
    }).join('');
  }
  var listDiv = document.getElementById('examRangeList');
  if (!listDiv) return;
  if (!examRangeCache || examRangeCache.length === 0) {
    listDiv.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px;">등록된 시험 범위가 없어요.</div>';
    return;
  }
  listDiv.innerHTML = '<div style="font-size:13px;font-weight:700;color:#334155;margin-bottom:10px;">저장된 시험 범위</div>' +
    examRangeCache.map(function(e) {
      var lessons = e.units ? e.units.split(',').map(function(n){return parseInt(n.trim());}).filter(Boolean) : [];
      var done = lessons.filter(function(no) {
        var cls2 = sylClassList.length > 0 ? sylClassList : allClasses;
        return cls2.some(function(c){ return sylCheckCache[no+'_'+c] && sylCheckCache[no+'_'+c].date; });
      }).length;
      return '<div style="background:white;border-radius:12px;padding:14px 16px;margin-bottom:8px;border:1px solid #e2e8f0;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<div style="font-size:14px;font-weight:800;color:#7c3aed;">🎯 ' + escapeHtml(e.name) + '</div>' +
          '<div style="font-size:11px;color:#64748b;">' + lessons.length + '차시 · 완료 ' + done + '차시</div>' +
        '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:5px;">' +
          lessons.map(function(no) {
            var p = sylPlanCache.find(function(x){return x.lessonNo===no;});
            return '<span style="background:#f5f3ff;color:#7c3aed;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600;">' +
              no + '차시' + (p&&p.content?' · '+escapeHtml(p.content.substring(0,10)):'') + '</span>';
          }).join('') +
        '</div></div>';
    }).join('');
}

function saveExamRange() {
  var name = document.getElementById('examName').value.trim();
  if (!name) return alert('시험명을 입력하세요.');
  var units = Array.from(document.querySelectorAll('#examLessonCheckboxes input:checked')).map(function(b){return b.value;});
  if (units.length === 0) return alert('차시를 선택하세요.');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { alert('오류: ' + (res.message||'')); return; }
      document.getElementById('examName').value = '';
      document.querySelectorAll('#examLessonCheckboxes input').forEach(function(b){b.checked=false;});
      loadSyllabusData();
    })
    .saveExamRange({ name: name, units: units.join(',') });
}

// ─── 예정일 일괄 ───
function openBulkPlannedDate() {
  var cols = (sylClassList.length > 0 ? sylClassList : allClasses).filter(function(x){ return x && x !== 'undefined'; });
  if (sylPlanCache.length === 0) return alert('먼저 차시 계획을 입력하세요.');
  document.getElementById('bulkPlannedModal').classList.add('open');
  var clsSel = document.getElementById('bulkTargetCls');
  clsSel.innerHTML = '<option value="all">전체 반 동일 적용</option>';
  cols.forEach(function(cls) {
    var o = document.createElement('option');
    o.value = cls; o.textContent = cls;
    clsSel.appendChild(o);
  });
  var rows = document.getElementById('bulkDateRows');
  rows.innerHTML = '';
  sylPlanCache.forEach(function(plan) {
    var existing = '';
    if (cols.length > 0) {
      var k0 = plan.lessonNo + '_' + cols[0];
      if (sylCheckCache[k0] && sylCheckCache[k0].plannedDate) existing = convertDateToInput(sylCheckCache[k0].plannedDate);
    }
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #f1f5f9;';
    row.innerHTML = '<span style="font-size:12px;font-weight:700;color:#1e3a8a;min-width:50px;">' + plan.lessonNo + '차시</span>'
      + '<span style="font-size:11px;color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(plan.content||'') + '</span>'
      + '<input type="date" data-ln="' + plan.lessonNo + '" value="' + existing + '" style="border:1px solid #e2e8f0;border-radius:6px;padding:4px 6px;font-size:12px;width:130px;">';
    rows.appendChild(row);
  });
}

function convertDateToInput(dateStr) {
  if (!dateStr) return '';
  var parts = String(dateStr).split('/');
  if (parts.length !== 2) return '';
  var yr = new Date().getFullYear();
  var mm = String(parseInt(parts[0])).padStart(2,'0');
  var dd = String(parseInt(parts[1])).padStart(2,'0');
  return yr + '-' + mm + '-' + dd;
}

function applyBulkPlannedDate() {
  var cols = (sylClassList.length > 0 ? sylClassList : allClasses).filter(function(x){ return x && x !== 'undefined'; });
  var targetCls = document.getElementById('bulkTargetCls').value;
  var overwrite = document.getElementById('bulkOverwrite2').checked;
  var saveData = [];
  document.querySelectorAll('#bulkDateRows input[type="date"]').forEach(function(inp) {
    var ln = parseInt(inp.dataset.ln);
    var val = inp.value;
    if (!val) return;
    var d = new Date(val + 'T00:00:00');
    var dateStr = (d.getMonth()+1) + '/' + d.getDate();
    var targetCols = targetCls === 'all' ? cols : [targetCls];
    targetCols.forEach(function(cls) {
      var key = ln + '_' + cls;
      if (!sylCheckCache[key]) sylCheckCache[key] = {};
      if (overwrite || !sylCheckCache[key].plannedDate) sylCheckCache[key].plannedDate = dateStr;
      saveData.push({ lessonNo: ln, cls: cls, plannedDate: dateStr, overwrite: overwrite });
    });
  });
  if (saveData.length === 0) return alert('입력된 날짜가 없어요.');
  renderSylTable();
  document.getElementById('bulkPlannedModal').classList.remove('open');
  google.script.run
    .withSuccessHandler(function(){ alert('✅ ' + saveData.length + '개 저장 완료'); })
    .withFailureHandler(function(e){ alert('저장 오류: ' + e.message); })
    .saveBulkPlannedDates(saveData);
}
</script>
</body>
