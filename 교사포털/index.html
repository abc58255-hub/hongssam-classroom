<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<title>교사 포털</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .hidden { display: none !important; }

  /* 로그인 */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 20%, #1e3a8a, #0f172a 70%); }
  .login-card { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); width: 340px; text-align: center; }
  .login-card h1 { font-size: 24px; margin-bottom: 6px; }
  .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 13px 15px; border: 2px solid #334155; border-radius: 12px; font-size: 15px; margin-bottom: 14px; background: #0f172a; color: white; }
  .login-card input:focus { outline: none; border-color: #3b82f6; }
  .btn { background: #2563eb; color: white; border: none; padding: 13px 20px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
  .btn:hover { background: #1d4ed8; }

  /* 헤더 */
  header { padding: 28px 32px 8px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 24px; font-weight: 900; }
  header .spacer { flex: 1; }
  header .small { background: #1e293b; color: #94a3b8; border: none; padding: 9px 15px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  header .small:hover { background: #334155; color: white; }
  .hr-chip { background: #1e3a8a; color: #bfdbfe; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

  main { padding: 12px 32px 50px; max-width: 1100px; margin: 0 auto; }
  .group { margin-top: 28px; }
  .group h2 { font-size: 15px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 22px; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit; display: block; position: relative; }
  .card:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 12px 30px rgba(37,99,235,0.25); }
  .card .icon { font-size: 34px; margin-bottom: 12px; display: block; }
  .card h3 { font-size: 17px; font-weight: 800; margin-bottom: 5px; }
  .card p { font-size: 13px; color: #94a3b8; line-height: 1.4; }
  .card.off { cursor: default; opacity: 0.55; }
  .card.off:hover { transform: none; border-color: #334155; box-shadow: none; }
  .card .off-tag { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 800; color: #f87171; background: #450a0a; padding: 3px 9px; border-radius: 20px; }
  .card .set-link { display: inline-block; margin-top: 8px; font-size: 12px; color: #60a5fa; cursor: pointer; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2563eb; color: white; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 700; z-index: 100; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; color: #64748b; padding: 60px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .modal { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 440px; max-width: 92vw; max-height: 88vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; }
  .modal input { width: 100%; padding: 11px 13px; border: 2px solid #334155; border-radius: 10px; font-size: 14px; background: #0f172a; color: white; }
  .modal input:focus { outline: none; border-color: #3b82f6; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="login-card">
    <h1>🏫 교사 포털</h1>
    <p>교사 비밀번호로 로그인하세요</p>
    <input type="password" id="pw" placeholder="교사 비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- 포털 -->
<div id="app" class="hidden">
  <header>
    <h1>🏫 교사 포털</h1>
    <span class="hr-chip hidden" id="hrChip"></span>
    <div class="spacer"></div>
    <button class="small" onclick="openPwReset()">🔑 비번 초기화</button>
    <button class="small" onclick="loadPortal()">↻ 새로고침</button>
    <button class="small" onclick="doLogout()">로그아웃</button>
  </header>
  <main id="portalMain"><div class="loading">불러오는 중...</div></main>
</div>

<div id="modalArea"></div>
<div class="toast" id="toast"></div>

<script>
  var TOKEN = localStorage.getItem('portal_token') || '';

  function doLogin() {
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success && res.token) {
        TOKEN = res.token; localStorage.setItem('portal_token', TOKEN); showApp();
      } else { toast(res && res.message ? res.message : '비밀번호가 틀렸습니다'); }
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).teacherLogin(pw);
  }
  function doLogout() {
    google.script.run.teacherLogout(TOKEN);
    localStorage.removeItem('portal_token'); TOKEN = '';
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
  }
  function checkSession() {
    if (!TOKEN) return;
    google.script.run.withSuccessHandler(function(res){ if (res && res.success) showApp(); }).validateTeacherSession(TOKEN);
  }
  function showApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadPortal();
  }

  function loadPortal() {
    document.getElementById('portalMain').innerHTML = '<div class="loading">불러오는 중...</div>';
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { document.getElementById('portalMain').innerHTML = '<div class="loading">불러오기 실패</div>'; return; }
      var chip = document.getElementById('hrChip');
      if (res.homeroom) { chip.textContent = res.homeroom; chip.classList.remove('hidden'); }
      render(res.groups);
    }).withFailureHandler(function(e){ document.getElementById('portalMain').innerHTML = '<div class="loading">오류: '+e.message+'</div>'; }).getPortalData();
  }

  function render(groups) {
    var html = groups.map(function(g) {
      var cards = g.cards.map(function(c) {
        if (c.action === 'lessonAdmin') {
          return '<div class="card" onclick="openLessonAdmin()">' +
            '<span class="icon">'+c.icon+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.desc)+'</p></div>';
        }
        if (c.url) {
          return '<a class="card" href="'+esc(c.url)+'" target="_blank">' +
            '<span class="icon">'+c.icon+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.desc)+'</p></a>';
        }
        return '<div class="card off"><span class="off-tag">미연결</span>' +
          '<span class="icon">'+c.icon+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.desc)+'</p>' +
          '<span class="set-link" onclick="setUrl(\''+esc(c.keys[0])+'\',\''+esc(c.name)+'\')">URL 직접 등록</span></div>';
      }).join('');
      var gstyle = g.student ? ' style="border-top:2px dashed #334155; padding-top:20px; margin-top:36px;"' : '';
      var h2style = g.student ? ' style="color:#c4b5fd;"' : '';
      return '<div class="group"'+gstyle+'><h2'+h2style+'>'+(g.student?'👨‍🎓 ':'')+esc(g.title)+'</h2><div class="grid">'+cards+'</div></div>';
    }).join('');
    document.getElementById('portalMain').innerHTML = html;
  }

  function setUrl(key, name) {
    var url = prompt(name + ' 앱의 게시 URL(/exec)을 입력하세요:', '');
    if (!url) return;
    if (url.indexOf('/exec') < 0) { toast('/exec 로 끝나는 게시 주소를 입력하세요'); return; }
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success !== false) { toast('등록됨'); loadPortal(); } else toast('등록 실패');
    }).setAppUrl(key, url);
  }

  // ── 비밀번호 초기화 ──
  var STUDENTS_CACHE = [];
  function openPwReset() {
    document.getElementById('modalArea').innerHTML =
      '<div class="modal-bg" onclick="if(event.target===this)closePw()"><div class="modal">' +
        '<h2>🔑 학생 비밀번호 초기화</h2>' +
        '<p style="color:#94a3b8;font-size:13px;margin:6px 0 14px;">초기화하면 그 학생은 <b>다음 로그인 때 새 비밀번호를 직접</b> 정해요.</p>' +
        '<input type="text" id="pwSearch" placeholder="학번 또는 이름 검색" oninput="renderStudents()">' +
        '<div id="pwList" style="margin-top:12px; max-height:52vh; overflow-y:auto;">불러오는 중...</div>' +
        '<div style="text-align:right;margin-top:14px;"><button class="small" onclick="closePw()">닫기</button></div>' +
      '</div></div>';
    google.script.run.withSuccessHandler(function(res){
      STUDENTS_CACHE = (res && res.success) ? (res.students || []) : [];
      renderStudents();
    }).withFailureHandler(function(e){ document.getElementById('pwList').innerHTML = '오류: '+e.message; }).getStudentList();
  }
  function closePw(){ document.getElementById('modalArea').innerHTML = ''; }
  function renderStudents() {
    var q = (document.getElementById('pwSearch').value || '').trim();
    var list = STUDENTS_CACHE.filter(function(s){ return !q || (s.studentId && s.studentId.indexOf(q) >= 0) || (s.name && s.name.indexOf(q) >= 0); });
    if (!list.length) { document.getElementById('pwList').innerHTML = '<p style="color:#64748b;font-size:13px;padding:10px;">해당 학생이 없어요.</p>'; return; }
    document.getElementById('pwList').innerHTML = list.map(function(s){
      var badge = s.joined ? '<span style="color:#4ade80;font-size:11px;">● 가입됨</span>' : '<span style="color:#64748b;font-size:11px;">○ 미가입</span>';
      return '<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #1e293b;">' +
        '<span style="flex:1;font-size:14px;">'+esc(s.studentId)+' '+esc(s.name)+'&nbsp;&nbsp;'+badge+'</span>' +
        '<button class="small" onclick="resetPw(\''+esc(s.studentId)+'\',\''+esc(s.name)+'\')">초기화</button></div>';
    }).join('');
  }
  function resetPw(sid, name) {
    if (!confirm(sid + ' ' + name + ' 학생의 비밀번호를 초기화할까요?\n다음 로그인 때 새 비밀번호를 직접 정하게 됩니다.')) return;
    google.script.run.withSuccessHandler(function(res){
      toast(res && res.success ? (name + ' 초기화됨') : ('실패: ' + (res && res.message || '오류')));
      if (res && res.success) { var s = STUDENTS_CACHE.filter(function(x){ return x.studentId === sid; })[0]; if (s) s.joined = false; renderStudents(); }
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).resetStudentPassword(sid, '');
  }

  // ── 🎮 수업활동 관리 (게임 노출 상태·등수 범위) — PWA(fcm-sw/portal)와 동일 로직 ──
  var LG_CACHE = [];
  var LG_STATUS = [
    { v: 'hidden', label: '숨김',       on: 'background:#475569;color:white;' },
    { v: 'open',   label: '🔥 진행 중',  on: 'background:#d97706;color:white;' },
    { v: 'free',   label: '🏁 자유 도전', on: 'background:#059669;color:white;' }
  ];
  function openLessonAdmin() {
    document.getElementById('modalArea').innerHTML =
      '<div class="modal-bg" onclick="if(event.target===this)closePw()"><div class="modal" style="width:520px;">' +
        '<h2>🎮 수업활동 관리</h2>' +
        '<p style="color:#94a3b8;font-size:13px;margin:6px 0 14px;">상태를 누르면 바로 적용돼요. <b style="color:#e2e8f0;">숨김</b>=학생에게 안 보임 · <b style="color:#fbbf24;">진행 중</b>=수업 활동 · <b style="color:#4ade80;">자유 도전</b>=종료 후 기록경쟁</p>' +
        '<div id="lgList" style="max-height:56vh;overflow-y:auto;">불러오는 중...</div>' +
        '<div style="text-align:right;margin-top:14px;"><button class="small" onclick="closePw()">닫기</button></div>' +
      '</div></div>';
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { document.getElementById('lgList').innerHTML = '오류: ' + esc(res && res.message || ''); return; }
      LG_CACHE = res.games || [];
      renderLG();
    }).withFailureHandler(function(e){ document.getElementById('lgList').innerHTML = '오류: ' + esc(e.message); }).getLessonGames(TOKEN);
  }
  function renderLG() {
    var box = document.getElementById('lgList');
    if (!box) return;
    if (LG_CACHE.length === 0) { box.innerHTML = '<p style="color:#64748b;font-size:13px;padding:10px;">등록된 활동이 없어요. 활동 페이지를 만들 때 자동 등록됩니다.</p>'; return; }
    box.innerHTML = LG_CACHE.map(function(g, i) {
      var statusBtns = LG_STATUS.map(function(s) {
        var on = g.status === s.v;
        return '<button onclick="lgSet(' + i + ',\'status\',\'' + s.v + '\')" style="border:none;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;' +
          (on ? s.on : 'background:#0f172a;color:#64748b;') + '">' + s.label + '</button>';
      }).join('');
      var scopeBtns = [['class','반 등수'],['grade','학년 등수']].map(function(sc) {
        var on = g.scope === sc[0];
        return '<button onclick="lgSet(' + i + ',\'scope\',\'' + sc[0] + '\')" style="border:none;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;' +
          (on ? 'background:#2563eb;color:white;' : 'background:#0f172a;color:#64748b;') + '">' + sc[1] + '</button>';
      }).join('');
      return '<div style="background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:10px;">' +
        '<div style="font-size:15px;font-weight:800;margin-bottom:2px;">' + esc(g.title || g.game) + '</div>' +
        '<div style="font-size:11px;color:#64748b;margin-bottom:10px;">' + esc(g.unit) + ' · ' + esc(g.game) + (g.url ? ' · ' + esc(g.url) : '') + '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">' + statusBtns + '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + scopeBtns + '</div>' +
      '</div>';
    }).join('');
  }
  function lgSet(i, field, val) {
    var g = LG_CACHE[i];
    if (!g || g[field] === val) return;
    g[field] = val;
    renderLG();
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { toast('저장 실패: ' + (res && res.message || '')); openLessonAdmin(); return; }
      toast('✅ 적용됨');
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); openLessonAdmin(); })
      .setLessonGame(TOKEN, { unit: g.unit, game: g.game, title: g.title, url: g.url, scope: g.scope, status: g.status });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  checkSession();
</script>

<!-- 앱 버전 (규칙: CLAUDE.md 버전 관리 참고) -->
<div style="text-align:center; color:#9ca3af; font-size:11px; padding:12px 0 18px; opacity:.85;">Made with ❤️ by 홍쌤 &nbsp;·&nbsp; <span class="app-ver">v1.01.00</span></div>
</body>
</html>
