<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>홍쌤 복습 질문</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  :root { --bg:#0b1020; --card:rgba(30,41,59,.55); --line:rgba(148,163,184,.18); }
  body { font-family:-apple-system,'Apple SD Gothic Neo',sans-serif; color:#e5e7eb; height:100vh; overflow:hidden; display:flex; flex-direction:column; position:relative; background:var(--bg); }
  /* 오로라 배경 */
  body::before, body::after { content:''; position:fixed; width:70vmax; height:70vmax; border-radius:50%; filter:blur(90px); opacity:.5; z-index:-1; pointer-events:none; }
  body::before { background:radial-gradient(circle,#6366f1,transparent 60%); top:-25vmax; left:-15vmax; animation:float1 14s ease-in-out infinite; }
  body::after { background:radial-gradient(circle,#0ea5e9,transparent 60%); bottom:-25vmax; right:-15vmax; animation:float2 16s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(6vmax,4vmax) scale(1.15);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-6vmax,-4vmax) scale(1.1);} }

  .top { display:flex; align-items:center; gap:10px; padding:14px 16px; background:rgba(15,23,42,.5); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); flex-shrink:0; }
  .top h1 { font-size:17px; font-weight:900; letter-spacing:-.02em; }
  .top select { margin-left:auto; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(15,23,42,.6); color:#e5e7eb; font-size:14px; font-weight:800; }
  .mbtn { background:rgba(99,102,241,.18); color:#c7d2fe; border:1px solid rgba(99,102,241,.35); border-radius:10px; padding:9px 12px; font-size:12px; font-weight:900; cursor:pointer; transition:.15s; }
  .mbtn:active { transform:scale(.94); }
  .counts { display:flex; gap:8px; padding:10px 16px; flex-shrink:0; flex-wrap:wrap; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; color:#94a3b8; backdrop-filter:blur(8px); }
  .chip b { font-size:14px; margin-left:3px; }
  #keptBar { display:none; padding:4px 16px 8px; line-height:2; flex-shrink:0; }
  .keptchip { background:linear-gradient(135deg,#b45309,#78350f); color:#fde68a; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:800; margin:0 4px 4px 0; display:inline-block; box-shadow:0 2px 8px rgba(180,83,9,.35); }

  #stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; position:relative; overflow:hidden; }
  #card { min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; position:relative; z-index:2; }
  .hint { font-size:15px; color:#64748b; font-weight:600; }
  .sid { font-size:clamp(19px,2vw,34px); color:#94a3b8; font-weight:800; letter-spacing:.02em; }
  .rolling { font-weight:900; color:#93c5fd; line-height:1.05; letter-spacing:-.02em; }
  .winner { font-weight:900; color:#fff; line-height:1.02; letter-spacing:-.03em; text-shadow:0 0 30px rgba(129,140,248,.9), 0 0 60px rgba(56,189,248,.5); }
  .badge { margin-top:14px; font-size:clamp(16px,1.8vw,30px); font-weight:900; color:#fde047; background:rgba(250,204,21,.12); border:1px solid rgba(250,204,21,.4); padding:8px 22px; border-radius:999px; display:inline-block; }
  .endbig { font-size:20px; color:#fbbf24; font-weight:900; }
  .endsub { font-size:14px; color:#94a3b8; margin-top:6px; }
  /* 스포트라이트 (당첨 순간) */
  #spot { position:absolute; inset:0; z-index:1; opacity:0; pointer-events:none; background:radial-gradient(circle at 50% 45%, rgba(129,140,248,.35), transparent 55%); }
  #spot.on { animation:spot .7s ease; }
  @keyframes spot { 0%{opacity:0;transform:scale(.6);} 40%{opacity:1;} 100%{opacity:0;transform:scale(1.3);} }

  .foot { padding:14px 16px 24px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; }
  .big { width:100%; background:linear-gradient(135deg,#6366f1,#4338ca); color:white; border:none; border-radius:16px; padding:16px; font-size:19px; font-weight:900; cursor:pointer; box-shadow:0 10px 30px rgba(79,70,229,.45); transition:.12s; }
  .big:active { transform:translateY(2px) scale(.99); box-shadow:0 5px 16px rgba(79,70,229,.4); }
  .jrow { display:none; gap:8px; }
  .jbtn { flex:1; border:none; border-radius:14px; padding:15px 8px; font-size:18px; font-weight:900; cursor:pointer; color:white; transition:.12s; box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 6px 18px rgba(0,0,0,.3); letter-spacing:.02em; }
  .jbtn:active { transform:translateY(2px) scale(.98); }
  .jpass { background:linear-gradient(180deg,#34d399,#16a34a); }
  .jfail { background:linear-gradient(180deg,#f87171,#dc2626); }
  .jkeep { background:linear-gradient(180deg,#fbbf24,#d97706); }
  .srow { display:flex; gap:8px; }
  .sbtn { border:none; border-radius:12px; padding:12px; font-size:13px; font-weight:800; cursor:pointer; background:rgba(51,65,85,.6); color:#cbd5e1; border:1px solid var(--line); transition:.12s; }
  .sbtn:active { transform:scale(.97); }

  /* 잠금 */
  #lock { position:fixed; inset:0; background:radial-gradient(circle at 30% 20%,#1e3a8a,#0b1020 70%); display:flex; align-items:center; justify-content:center; z-index:100; }
  .lockcard { background:var(--card); backdrop-filter:blur(16px); padding:38px 32px; border-radius:24px; width:330px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,.5); border:1px solid var(--line); }
  .lockcard .ico { font-size:46px; margin-bottom:10px; }
  .lockcard h2 { font-size:21px; margin-bottom:6px; font-weight:900; }
  .lockcard p { color:#94a3b8; font-size:13px; margin-bottom:20px; line-height:1.5; }
  .lockcard input { width:100%; padding:14px; border:2px solid var(--line); border-radius:14px; background:rgba(15,23,42,.6); color:white; font-size:15px; margin-bottom:12px; }
  .lockcard input:focus { outline:none; border-color:#6366f1; }
  .lockcard button { width:100%; padding:14px; background:linear-gradient(135deg,#6366f1,#4338ca); color:white; border:none; border-radius:14px; font-size:15px; font-weight:900; cursor:pointer; }
  .lockcard .err { color:#f87171; font-size:13px; margin-top:10px; min-height:18px; font-weight:700; }

  .toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px); background:rgba(17,24,39,.92); backdrop-filter:blur(10px); color:#fff; padding:13px 24px; border-radius:999px; font-size:14px; font-weight:800; z-index:200; opacity:0; transition:.3s; pointer-events:none; border:1px solid var(--line); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @keyframes pop { 0%{transform:scale(.5);opacity:0;} 55%{transform:scale(1.22);} 75%{transform:scale(.95);} 100%{transform:scale(1);opacity:1;} }
  @keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
  .conf { position:fixed; top:-20px; z-index:150; pointer-events:none; border-radius:2px; }
  @keyframes fall { to { transform:translateY(105vh) rotate(720deg); opacity:.15; } }
  /* 멀티 뽑기 그리드 */
  #multiWrap { width:100%; max-width:1200px; display:grid; gap:clamp(10px,1.1vw,18px); }
  .mcard { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:clamp(12px,1.3vw,22px) clamp(10px,1vw,18px); text-align:center; backdrop-filter:blur(8px); animation:pop .4s cubic-bezier(.2,1.4,.4,1) both; box-shadow:0 8px 22px rgba(0,0,0,.3); }
  .mcard .msid { font-size:clamp(14px,1.2vw,20px); color:#94a3b8; font-weight:800; }
  .mcard .mname { font-weight:900; color:#fff; line-height:1.1; margin:clamp(6px,.7vw,12px) 0 clamp(10px,1.1vw,16px); text-shadow:0 0 20px rgba(129,140,248,.7); }
  .mrow { display:flex; gap:clamp(4px,.5vw,8px); }
  .mrow button { flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; border:none; border-radius:12px; padding:clamp(9px,.9vw,15px) 2px; font-size:clamp(15px,1.35vw,24px); font-weight:900; color:white; cursor:pointer; transition:.1s; box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 4px 12px rgba(0,0,0,.28); letter-spacing:.03em; }
  .mrow button:active { transform:scale(.93); }
  .mdone { opacity:.35; }
</style>
</head>
<body>
<div class="top">
  <h1>🎲 복습 질문</h1>
  <select id="classSel" onchange="onClass()"></select>
  <select id="cntSel" class="mbtn" onchange="onCnt()" title="한 번에 뽑을 인원">
    <option value="1">👤 1명</option>
    <option value="2">👥 2명</option>
    <option value="3">👥 3명</option>
    <option value="4">👥 4명</option>
    <option value="5">👥 5명</option>
    <option value="6">👥 6명</option>
  </select>
  <button class="mbtn" id="modeBtn" onclick="toggleMode()"></button>
  <button class="mbtn" onclick="refreshRosterUI(this)" title="명단 새로고침 (전학생 등 반영)">🔄</button>
</div>
<div class="counts">
  <span class="chip">남은 <b id="cRemain" style="color:#38bdf8;">0</b></span>
  <span class="chip">완료 <b id="cDone" style="color:#4ade80;">0</b></span>
  <span class="chip">🔖 킵 <b id="cKept" style="color:#fbbf24;">0</b></span>
  <span class="chip">✅ 통과 <b id="cPass" style="color:#4ade80;">0</b></span>
</div>
<div id="keptBar"></div>
<div id="stage">
  <div id="spot"></div>
  <div id="card"><div class="hint">아래 버튼을 눌러 학생을 뽑으세요</div></div>
</div>
<div class="foot">
  <div id="drawRow"><button class="big" onclick="draw()">🎲 다음 학생 뽑기</button></div>
  <div id="judgeRow" class="jrow">
    <button class="jbtn jpass" onclick="judge('pass')">통과</button>
    <button class="jbtn jfail" onclick="judge('fail')">실패</button>
    <button class="jbtn jkeep" onclick="judge('keep')">킵</button>
  </div>
  <div class="srow">
    <button class="sbtn" style="flex:1;" onclick="finish()">🏁 마무리 (킵 다시)</button>
    <button class="sbtn" style="color:#f87171;" onclick="reset()">↺ 처음부터</button>
  </div>
</div>

<div id="lock">
  <div class="lockcard">
    <div class="ico">🔒</div>
    <h2>복습 질문</h2>
    <p>교사 비밀번호를 입력하면<br>1시간 동안 사용할 수 있어요.</p>
    <input type="password" id="lockPw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doUnlock()">
    <button id="lockBtn" onclick="doUnlock()">확인</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 커스텀 확인 모달 (브라우저 기본 confirm 대체) -->
<div id="confirmBg" style="display:none;position:fixed;inset:0;background:rgba(2,6,23,.6);backdrop-filter:blur(4px);z-index:300;align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;max-width:360px;width:100%;padding:26px 24px;box-shadow:0 25px 60px rgba(0,0,0,.5);">
    <div id="confirmMsg" style="font-size:16px;font-weight:700;color:#e5e7eb;line-height:1.6;white-space:pre-wrap;margin-bottom:20px;"></div>
    <div style="display:flex;gap:10px;">
      <button id="confirmCancel" style="flex:1;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(51,65,85,.6);color:#cbd5e1;font-size:15px;font-weight:800;cursor:pointer;">취소</button>
      <button id="confirmOk" style="flex:1;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#6366f1,#4338ca);color:white;font-size:15px;font-weight:900;cursor:pointer;">확인</button>
    </div>
  </div>
</div>

<script>
  var TOK = localStorage.getItem('rv_tok') || '';
  var STU = [];          // [{sid,name}]
  var COUNTS = {};       // 누적 복습 도장
  var RV = null;         // { cls, mode, pool[], current, kept[], done[], pass }
  var ANIM = false;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1600); }
  function uiConfirm(msg, onOk){
    var bg=document.getElementById('confirmBg');
    document.getElementById('confirmMsg').textContent=msg;
    bg.style.display='flex';
    document.getElementById('confirmOk').onclick=function(){ bg.style.display='none'; onOk(); };
    document.getElementById('confirmCancel').onclick=function(){ bg.style.display='none'; };
  }
  function _name(sid){ var s=STU.find(function(x){return String(x.sid)===String(sid);}); return (s&&s.name)?s.name:sid; }
  function _key(cls){ return 'rv_state_' + cls; }
  function _save(){ if(RV) try{ localStorage.setItem(_key(RV.cls), JSON.stringify(RV)); }catch(_){} }
  // 이름 길이에 따라 폰트 자동 축소
  function _fs(name, base){ var n=(name||'').length; return Math.round(n<=3?base:n<=5?base*.8:n<=7?base*.62:base*.5); }

  // ── 인증 ──
  function authGate(res){ if(res&&res.needAuth){ TOK=''; localStorage.removeItem('rv_tok'); showLock(); return true; } return false; }
  function showLock(){ document.getElementById('lock').style.display='flex'; }
  function hideLock(){ document.getElementById('lock').style.display='none'; }
  function doUnlock(){
    var pw=document.getElementById('lockPw').value; var btn=document.getElementById('lockBtn');
    if(!pw) return; btn.disabled=true; btn.textContent='확인 중…';
    google.script.run.withFailureHandler(function(e){ btn.disabled=false; btn.textContent='확인'; document.getElementById('lockErr').textContent='오류: '+e.message; })
      .withSuccessHandler(function(res){
        btn.disabled=false; btn.textContent='확인';
        if(res&&res.success){ TOK=res.token; localStorage.setItem('rv_tok',TOK); document.getElementById('lockErr').textContent=''; hideLock(); loadClasses(); }
        else document.getElementById('lockErr').textContent=(res&&res.message)||'실패';
      }).unlockReview(pw);
  }

  // 명단 캐시(10분) 비우고 다시 불러오기 — 전학생 추가 등 명부 수정 직후
  function refreshRosterUI(btn){
    var orig = btn ? btn.textContent : '';
    if(btn){ btn.disabled=true; btn.textContent='…'; }
    google.script.run
      .withFailureHandler(function(err){ if(btn){ btn.disabled=false; btn.textContent=orig; } toast('오류: '+(err.message||'')); })
      .withSuccessHandler(function(res){
        if(btn){ btn.disabled=false; btn.textContent=orig; }
        if(authGate(res)) return;
        toast('🔄 명단 새로고침됨');
        loadClasses();
      }).refreshRoster(TOK);
  }

  function loadClasses(){
    google.script.run.withFailureHandler(function(e){ toast('반 목록 오류: '+e.message); })
      .withSuccessHandler(function(res){
        if(authGate(res)) return; if(!res||!res.success) return;
        var sel=document.getElementById('classSel');
        sel.innerHTML=res.classes.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
        onClass();
      }).getClassList(TOK);
  }

  function onClass(){
    var cls=document.getElementById('classSel').value; if(!cls) return;
    google.script.run.withFailureHandler(function(e){ toast('불러오기 실패: '+e.message); })
      .withSuccessHandler(function(res){
        if(authGate(res)) return; if(!res||!res.success) return;
        STU=res.students||[]; COUNTS=res.counts||{};
        var saved=null; try{ saved=JSON.parse(localStorage.getItem(_key(cls))||'null'); }catch(_){}
        if(saved&&saved.cls===cls){ RV=saved; }
        else { RV={ cls:cls, mode:'once', pool:STU.map(function(s){return s.sid;}), current:[], kept:[], done:[], pass:0 }; }
        // current를 배열로 정규화 (구버전 저장분: 단일 sid 또는 null)
        if(!Array.isArray(RV.current)) RV.current = RV.current ? [RV.current] : [];
        var savedCnt=localStorage.getItem('rv_cnt'); if(savedCnt) document.getElementById('cntSel').value=savedCnt;
        render();
      }).getReviewData(cls, TOK);
  }

  function toggleMode(){ if(!RV) return; RV.mode=(RV.mode==='dup')?'once':'dup'; render(); }

  // 공평 가중: 누적 복습 도장 적을수록 잘 뽑힘
  function pick(cands){
    if(!cands.length) return null;
    var mx=0; cands.forEach(function(s){ var c=COUNTS[s]||0; if(c>mx)mx=c; });
    var w=cands.map(function(s){ return (mx-(COUNTS[s]||0))+1; });
    var tot=w.reduce(function(a,b){return a+b;},0), r=Math.random()*tot;
    for(var i=0;i<cands.length;i++){ r-=w[i]; if(r<=0) return cands[i]; }
    return cands[cands.length-1];
  }
  // 서로 다른 N명 가중 추출
  function pickN(cands, n){
    var pool=cands.slice(), out=[];
    while(out.length<n && pool.length){ var s=pick(pool); if(s==null) break; out.push(s); pool=pool.filter(function(x){return x!==s;}); }
    return out;
  }
  function onCnt(){ localStorage.setItem('rv_cnt', document.getElementById('cntSel').value); }
  function _cnt(){ return parseInt(document.getElementById('cntSel').value)||1; }

  function render(){
    if(!RV) return;
    document.getElementById('modeBtn').textContent = RV.mode==='dup'?'🔁 중복 허용':'1️⃣ 한 번만';
    document.getElementById('cRemain').textContent = RV.mode==='dup'?'∞':RV.pool.length;
    document.getElementById('cDone').textContent = RV.done.length;
    document.getElementById('cKept').textContent = RV.kept.length;
    document.getElementById('cPass').textContent = RV.pass;
    var kb=document.getElementById('keptBar');
    kb.innerHTML = RV.kept.length ? '🔖 '+RV.kept.map(function(s){return '<span class="keptchip">'+esc(_name(s))+'</span>';}).join('') : '';
    kb.style.display = RV.kept.length?'block':'none';
    var card=document.getElementById('card'), drawRow=document.getElementById('drawRow'), judgeRow=document.getElementById('judgeRow');
    var cur = RV.current || [];
    if(cur.length===1){
      // 단일: 큰 카드 + 하단 판정 버튼
      var sid=cur[0];
      card.innerHTML='<div class="sid">'+esc(sid)+'</div>'
        +'<div class="winner" style="font-size:clamp(60px,'+(_name(sid).length<=3?18:_name(sid).length<=5?13:9)+'vw,220px);">'+esc(_name(sid))+'</div>'
        +'<div class="badge">🎤 복습 질문!</div>';
      drawRow.style.display='none'; judgeRow.style.display='flex';
    } else if(cur.length>1){
      // 멀티: 카드별 판정 버튼 (하단 버튼 숨김)
      var cols = cur.length<=2?cur.length:(cur.length<=4?2:3);
      var html='<div id="multiWrap" style="grid-template-columns:repeat('+cols+',1fr);">';
      cur.forEach(function(sid){
        var nm=_name(sid);
        html+='<div class="mcard">'
          +'<div class="msid">'+esc(sid)+'</div>'
          +'<div class="mname" style="font-size:clamp(30px,'+(cur.length<=2?6:cur.length<=4?4.5:3.6)+'vw,78px);">'+esc(nm)+'</div>'
          +'<div class="mrow">'
            +'<button class="jpass" onclick="judgeOne(\''+esc(sid)+'\',\'pass\')">통과</button>'
            +'<button class="jfail" onclick="judgeOne(\''+esc(sid)+'\',\'fail\')">실패</button>'
            +'<button class="jkeep" onclick="judgeOne(\''+esc(sid)+'\',\'keep\')">킵</button>'
          +'</div></div>';
      });
      html+='</div>';
      card.innerHTML=html;
      drawRow.style.display='none'; judgeRow.style.display='none';
    } else {
      judgeRow.style.display='none'; drawRow.style.display='block';
      var empty=(RV.mode!=='dup'&&RV.pool.length===0);
      card.innerHTML = empty
        ? '<div class="endbig">이번 바퀴 끝! 🎉</div><div class="endsub">'+(RV.kept.length?'🔖 킵한 '+RV.kept.length+'명은 [마무리]로 다시':'모든 학생 확인 완료')+'</div>'
        : '<div class="hint">아래 버튼을 눌러 학생을 뽑으세요</div>';
    }
    _save();
  }

  function draw(){
    if(!RV||(RV.current&&RV.current.length)||ANIM) return;
    if(!STU.length){ toast('명단을 불러오는 중이에요…'); onClass(); return; } // 아직 로딩 전이면 재조회
    var cands = RV.mode==='dup' ? STU.map(function(s){return s.sid;}) : RV.pool;
    if(!cands.length){ toast('뽑을 학생이 없어요'); return; }
    var n=Math.min(_cnt(), cands.length);
    var winners=pickN(cands, n);
    ANIM=true; document.getElementById('drawRow').style.display='none';
    var card=document.getElementById('card'), all=STU.map(function(s){return s.sid;}), t=0, max=(n===1?24:14);
    function flash(){
      var prog=t/max, blur=Math.max(0,(1-prog)*7), op=.45+prog*.55;
      if(n===1){
        var s=all[Math.floor(Math.random()*all.length)], nm=_name(s);
        card.innerHTML='<div class="hint" style="color:#818cf8;">🎲 뽑는 중…</div>'
          +'<div class="rolling" style="font-size:'+_fs(nm,60)+'px;filter:blur('+blur.toFixed(1)+'px);opacity:'+op.toFixed(2)+';transform:translateY('+((1-prog)*6-3).toFixed(0)+'px);">'+esc(nm)+'</div>';
      } else {
        var names=[]; for(var k=0;k<n;k++) names.push(esc(_name(all[Math.floor(Math.random()*all.length)])));
        card.innerHTML='<div class="hint" style="color:#818cf8;">🎲 '+n+'명 뽑는 중…</div>'
          +'<div style="font-size:26px;font-weight:900;color:#93c5fd;filter:blur('+blur.toFixed(1)+'px);opacity:'+op.toFixed(2)+';line-height:1.5;">'+names.join(' · ')+'</div>';
      }
      t++; if(t>=max){ land(winners); return; }
      setTimeout(flash, (n===1?40:36)+t*t*.9);
    }
    flash();
  }
  function land(winners){
    ANIM=false; RV.current=winners.slice();
    var spot=document.getElementById('spot'); spot.classList.remove('on'); void spot.offsetWidth; spot.classList.add('on');
    confetti();
    render();
  }

  // 컨페티 이펙트
  function confetti(){
    var colors=['#6366f1','#38bdf8','#22c55e','#fbbf24','#ef4444','#e879f9'];
    for(var i=0;i<36;i++){
      var d=document.createElement('div'); d.className='conf';
      var sz=6+Math.random()*8;
      d.style.left=Math.random()*100+'vw';
      d.style.width=sz+'px'; d.style.height=(sz*.5)+'px';
      d.style.background=colors[i%colors.length];
      d.style.animation='fall '+(1.1+Math.random()*1.1)+'s cubic-bezier(.3,.6,.5,1) '+(Math.random()*.25)+'s forwards';
      document.body.appendChild(d);
      (function(el){ setTimeout(function(){ el.remove(); }, 2600); })(d);
    }
  }

  // 판정 공통 처리 (한 명 해결 → RV.current에서 제거)
  function _resolve(sid, kind){
    var name=_name(sid);
    if(RV.mode!=='dup') RV.pool=RV.pool.filter(function(x){return x!==sid;});
    if(kind==='pass'){
      RV.pass++; RV.done.push(sid); COUNTS[sid]=(COUNTS[sid]||0)+1;
      google.script.run.withFailureHandler(function(e){ toast('⚠ 도장 저장 실패: '+e.message); })
        .withSuccessHandler(function(res){ if(res&&res.needAuth) toast('🔒 인증 필요'); }).recordReviewPass(sid, name, TOK);
      toast('✅ '+name+' 통과! 도장 +1');
    } else if(kind==='fail'){ RV.done.push(sid); toast('❌ '+name+' 실패'); }
    else { if(RV.kept.indexOf(sid)<0) RV.kept.push(sid); toast('🔖 '+name+' 킵'); }
    RV.current = (RV.current||[]).filter(function(x){return x!==sid;});
  }
  function judge(kind){ if(!RV||!RV.current||!RV.current.length) return; _resolve(RV.current[0], kind); render(); }
  function judgeOne(sid, kind){ if(!RV||(RV.current||[]).indexOf(sid)<0) return; _resolve(sid, kind); render(); }

  function finish(){
    if(!RV) return;
    if(!RV.kept.length){ toast('킵한 학생이 없어요'); return; }
    RV.pool=RV.kept.slice(); RV.kept=[]; RV.current=[]; RV.mode='once';
    toast('🏁 킵한 '+RV.pool.length+'명 다시 시작!'); render();
  }
  function reset(){
    if(!RV) return;
    uiConfirm('처음부터 다시 시작할까요?\n(기록된 도장은 지워지지 않아요)', function(){
      RV={ cls:RV.cls, mode:RV.mode, pool:STU.map(function(s){return s.sid;}), current:[], kept:[], done:[], pass:0 }; render();
    });
  }

  // 시작
  if(TOK){ hideLock(); loadClasses(); } else { showLock(); }
</script>
</body>
</html>
