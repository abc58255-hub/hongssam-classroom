  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .card { background: white; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px; box-sizing: border-box; overflow: hidden; }
    .app-header { background-color: #1e3a8a; color: white; padding: 25px 20px; text-align: center; }
    .app-header h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .app-header p { margin: 8px 0 0 0; font-size: 14px; color: #bfdbfe; }
    .card-content { padding: 30px 25px; }
    .field { margin-bottom: 20px; }
    label.title { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #334155; }
    input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-size: 15px; font-family: inherit; background-color: #f8fafc; transition: 0.2s; }
    input:focus { outline: none; border-color: #3b82f6; background-color: white; }
    input.error { border-color: #ef4444; background-color: #fff5f5; }
    input.ok { border-color: #10b981; background-color: #f0fdf4; }
    .pw-hint { font-size: 12px; margin-top: 5px; font-weight: 600; min-height: 18px; }
    .pw-hint.match { color: #10b981; }
    .pw-hint.nomatch { color: #ef4444; }
    button.primary-btn { width: 100%; padding: 16px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    button.primary-btn:hover { background: #1d4ed8; }
    button.primary-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .status-msg { text-align: center; margin-top: 15px; font-weight: 700; font-size: 14px; color: #ef4444; line-height: 1.5; }
    .credit { text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e2e8f0; color: #9ca3af; font-size: 11px; }
    .qr-btn { position:absolute; top:14px; right:16px; background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; transition:0.2s; }
    .qr-btn:hover { background:rgba(255,255,255,0.25); }
    .qr-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center; }
    .qr-modal { background:white; border-radius:20px; padding:30px 24px; max-width:320px; width:90%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.3); }
    .qr-title { font-size:16px; font-weight:800; color:#1e3a8a; margin-bottom:6px; }
    .qr-desc { font-size:12px; color:#64748b; margin-bottom:20px; line-height:1.6; }
    .qr-img-wrap { background:#f8fafc; border-radius:12px; padding:16px; margin-bottom:16px; display:inline-block; }
    .qr-url { font-size:10px; color:#94a3b8; word-break:break-all; margin-bottom:16px; }
    .qr-close { background:#e2e8f0; color:#374151; border:none; padding:10px 24px; border-radius:10px; font-weight:700; cursor:pointer; font-size:14px; }
  </style>
</head>
<body>
<div class="card" id="regForm">
  <div class="app-header" style="position:relative;">
    <h2>📝 수학 교실 처음 가입</h2>
    <p>우리 반 전용 암호를 입력하고 가입하세요</p>
    <button class="qr-btn" onclick="showQR()">📲 QR 보기</button>
  </div>
  <div class="card-content">
    <div class="field">
      <label class="title">학급 가입 코드</label>
      <input type="text" id="classCode" placeholder="선생님이 알려주신 암호">
    </div>
    <div class="field">
      <label class="title">학번 (4자리)</label>
      <input type="number" id="studentId" placeholder="예: 1325">
    </div>
    <div class="field">
      <label class="title">이름</label>
      <input type="text" id="studentName" placeholder="본인 이름">
    </div>
    <div class="field">
      <label class="title">사용할 비밀번호 설정</label>
      <input type="password" id="password" placeholder="비밀번호 입력 (4자 이상)" oninput="checkPwMatch()">
    </div>
    <div class="field">
      <label class="title">비밀번호 확인</label>
      <input type="password" id="passwordConfirm" placeholder="비밀번호를 한 번 더 입력하세요" oninput="checkPwMatch()" onkeypress="if(event.keyCode==13) register()">
      <div class="pw-hint" id="pwHint"></div>
    </div>

    <button id="btn" class="primary-btn" onclick="register()">가입하기</button>
    <div id="status" class="status-msg"></div>
    <div class="credit">Made with ❤️ by 홍쌤 &nbsp;·&nbsp; v1.0</div>
  </div>
</div>

<div class="card" id="successMsg" style="display:none;">
  <div class="app-header" style="background-color: #10b981;">
    <h2>가입 완료! 🎉</h2>
    <p>성공적으로 명부에 등록되었습니다</p>
  </div>
  <div class="card-content" style="text-align:center;">
    <p style="color:#475569; font-size:16px; font-weight:600; line-height:1.6;">이제 과제 제출 앱 주소로 이동하여<br>로그인하실 수 있습니다.</p>
  </div>
</div>

  function showQR() {
    document.getElementById('qrOverlay').style.display = 'flex';
    _renderQR(_qrDataUrl);
  }

  function _renderQR(dataUrl) {
    var img = document.getElementById('qrImg');
    var desc = document.getElementById('qrUrl');
    img.src = dataUrl;
    img.style.display = 'block';
    desc.innerText = '📲 카메라로 스캔하세요';
  }

  function hideQR() {
    document.getElementById('qrOverlay').style.display = 'none';
  }
  function checkPwMatch() {
    var pw1 = document.getElementById('password').value;
    var pw2 = document.getElementById('passwordConfirm').value;
    var hint = document.getElementById('pwHint');
    var input1 = document.getElementById('password');
    var input2 = document.getElementById('passwordConfirm');

    if (!pw2) { hint.innerText = ''; input2.className = ''; return; }

    if (pw1 === pw2) {
      hint.innerText = '✅ 비밀번호가 일치합니다.';
      hint.className = 'pw-hint match';
      input2.className = 'ok';
    } else {
      hint.innerText = '❌ 비밀번호가 일치하지 않습니다.';
      hint.className = 'pw-hint nomatch';
      input2.className = 'error';
    }
  }

  function register() {
    var code  = document.getElementById('classCode').value.trim();
    var id    = document.getElementById('studentId').value.trim();
    var name  = document.getElementById('studentName').value.trim();
    var pw    = document.getElementById('password').value.trim();
    var pw2   = document.getElementById('passwordConfirm').value.trim();
    var status = document.getElementById('status');
    var btn    = document.getElementById('btn');

    if (!code || !id || !name || !pw || !pw2) {
      status.innerText = "모든 항목을 입력하세요.";
      status.style.color = "#ef4444";
      return;
    }
    if (pw.length < 4) {
      status.innerText = "비밀번호는 4자 이상이어야 합니다.";
      status.style.color = "#ef4444";
      return;
    }
    if (pw !== pw2) {
      status.innerText = "❌ 비밀번호가 일치하지 않습니다. 다시 확인해주세요.";
      status.style.color = "#ef4444";
      document.getElementById('passwordConfirm').focus();
      return;
    }

    btn.disabled = true;
    status.innerText = "가입 처리 중...";
    status.style.color = "#3b82f6";

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          document.getElementById('regForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          status.innerText = res.message;
          status.style.color = "#ef4444";
          btn.disabled = false;
        }
      })
      .registerStudent(id, name, pw, code);
  }
</script>
