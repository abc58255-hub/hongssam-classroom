<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교실 칭찬 관리</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f1f5f9; color:#0f172a; padding:16px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; font-weight:900; color:#7c3aed; margin-bottom:4px; }
  .sub { font-size:13px; color:#64748b; margin-bottom:16px; }
  .card { background:white; border:1px solid #e2e8f0; border-radius:16px; padding:16px; margin-bottom:14px; }
  .btn { border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-primary { background:#7c3aed; color:white; }
  .btn-gray { background:#e2e8f0; color:#475569; }
  .btn-sm { padding:5px 11px; font-size:12px; border-radius:8px; }
  .btn-danger { background:#fee2e2; color:#dc2626; }
  label { display:block; font-size:12px; font-weight:700; color:#475569; margin-bottom:5px; margin-top:12px; }
  input, select, textarea { width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:10px; font-size:14px; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:#7c3aed; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mode-opt { border:2px solid #e2e8f0; border-radius:12px; padding:10px; cursor:pointer; transition:0.15s; }
  .mode-opt.sel { border-color:#7c3aed; background:#faf5ff; }
  .mode-opt .t { font-weight:800; font-size:13px; }
  .mode-opt .d { font-size:11px; color:#94a3b8; margin-top:2px; line-height:1.3; }
  .ev-item { border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:8px; }
  .badge { display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:8px; }
  .b-on { background:#dcfce7; color:#15803d; }
  .b-off { background:#f1f5f9; color:#94a3b8; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; background:#e2e8f0; border-radius:12px; padding:4px; }
  .tab { flex:1; text-align:center; padding:9px; border-radius:9px; font-weight:700; font-size:13px; cursor:pointer; color:#64748b; }
  .tab.active { background:white; color:#7c3aed; }
  .hidden { display:none; }
  .rec { border:1px solid #f1f5f9; border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:13px; }
  .muted { color:#94a3b8; font-size:12px; }
  .stat-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💝 교실 칭찬 관리</h1>
  <div class="sub">칭찬 이벤트를 만들고 결과를 확인하세요.</div>

  <div class="tabs">
    <div class="tab active" id="tabBtn1" onclick="switchTab(1)">📋 이벤트</div>
    <div class="tab" id="tabBtn2" onclick="switchTab(2)">📊 결과·통계</div>
  </div>

  <!-- 탭1: 이벤트 -->
  <div id="tab1">
    <div class="card">
      <button class="btn btn-primary" onclick="openForm()">+ 새 칭찬 이벤트</button>
    </div>
    <div id="eventList"><div class="muted" style="text-align:center;padding:20px;">불러오는 중...</div></div>
  </div>

  <!-- 탭2: 결과·통계 -->
  <div id="tab2" class="hidden">
    <div class="card">
      <label>이벤트 선택</label>
      <select id="resultEventSel" onchange="loadResults()"></select>
    </div>
    <div id="statsBox"></div>
    <div id="resultsBox"></div>
  </div>
</div>

<!-- 이벤트 만들기/수정 모달 -->
<div id="formModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;padding:16px;">
  <div style="background:white;border-radius:18px;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div style="font-size:17px;font-weight:800;" id="formTitle">새 칭찬 이벤트</div>
      <button onclick="document.getElementById('formModal').style.display='none'" style="background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;">✕</button>
    </div>
    <input type="hidden" id="fRowIdx"><input type="hidden" id="fId">

    <label>이벤트 제목 *</label>
    <input id="fTitle" placeholder="예: 6월 칭찬 릴레이">

    <label>칭찬 모드 *</label>
    <div class="mode-grid" id="modeGrid"></div>

    <div class="row">
      <div><label>대상 반 *</label><select id="fClass" onchange="loadFormRoster()"></select></div>
    </div>
    <div class="row">
      <div><label>시작일</label><input type="date" id="fStart"></div>
      <div><label>종료일</label><input type="date" id="fEnd"></div>
    </div>

    <div style="background:#f8fafc;border-radius:12px;padding:12px;margin-top:12px;">
      <div style="font-size:12px;font-weight:800;color:#475569;margin-bottom:4px;">⚙️ 옵션</div>
      <label>작성자 표시</label>
      <select id="fAnon">
        <option value="real">실명 (누가 칭찬했는지 보임)</option>
        <option value="anon">익명 (작성자 숨김)</option>
        <option value="choice">학생이 매번 선택</option>
      </select>
      <label>공개 범위</label>
      <select id="fBoard">
        <option value="class">반 전체 게시판 (모두가 봄)</option>
        <option value="private">받은 사람만 봄</option>
      </select>
      <div class="row">
        <div><label>최소 글자수</label><input type="number" id="fMinLen" value="5" min="0"></div>
        <div><label>하루 작성 횟수 (0=무제한)</label><input type="number" id="fDailyLimit" value="0" min="0"></div>
      </div>
      <label id="leastFirstWrap" style="display:none;"><input type="checkbox" id="fLeastFirst" style="width:auto;display:inline;margin-right:6px;">덜 받은 친구 우선 추천 (랜덤 뽑기)</label>
    </div>

    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-gray" style="flex:1;" onclick="document.getElementById('formModal').style.display='none'">취소</button>
      <button class="btn btn-primary" style="flex:2;" id="fSaveBtn" onclick="saveEventForm()">💾 저장</button>
    </div>
  </div>
</div>

<script>
  var MODES = [
    { v:'random',   t:'🎲 랜덤 뽑기', d:'버튼 누르면 랜덤 친구 1명 칭찬' },
    { v:'pick',     t:'👉 자유 지목', d:'원하는 친구 골라서 칭찬' },
    { v:'relay',    t:'🔄 랜덤 릴레이', d:'매일 전원에게 1명씩 자동 배정' },
    { v:'chain',    t:'🔗 칭찬 연쇄', d:'A가 칭찬하면 다음은 A가 이어받기' },
    { v:'spotlight',t:'⭐ 오늘의 주인공', d:'매일 1명 주인공 → 다 같이 칭찬' }
  ];
  var _selMode = 'relay';
  var _events = [];

  function switchTab(n) {
    document.getElementById('tab1').classList.toggle('hidden', n!==1);
    document.getElementById('tab2').classList.toggle('hidden', n!==2);
    document.getElementById('tabBtn1').classList.toggle('active', n===1);
    document.getElementById('tabBtn2').classList.toggle('active', n===2);
    if (n===2) populateResultSelect();
  }

  function loadEvents() {
    google.script.run.withSuccessHandler(function(res){
      _events = res.events || [];
      var div = document.getElementById('eventList');
      if (_events.length === 0) { div.innerHTML = '<div class="card muted" style="text-align:center;">아직 만든 이벤트가 없어요.</div>'; return; }
      div.innerHTML = _events.map(function(e){
        var modeInfo = MODES.filter(function(m){return m.v===e.mode;})[0] || {t:e.mode};
        return '<div class="ev-item">'
          + '<div style="display:flex;justify-content:space-between;align-items:center;">'
            + '<div style="font-weight:800;font-size:15px;">' + e.title + ' <span class="badge ' + (e.active?'b-on':'b-off') + '">' + (e.active?'진행중':'중지') + '</span></div>'
          + '</div>'
          + '<div class="muted" style="margin:4px 0;">' + modeInfo.t + ' · ' + e.cls + ' · ' + (e.start||'') + '~' + (e.end||'') + ' · 참여 ' + (e.participants||[]).length + '명</div>'
          + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">'
            + '<button class="btn btn-sm ' + (e.active?'btn-gray':'btn-primary') + '" onclick="toggleActive(' + e.rowIdx + ',' + (!e.active) + ')">' + (e.active?'⏸ 중지':'▶ 시작') + '</button>'
            + '<button class="btn btn-sm btn-gray" onclick="editEvent(\'' + e.id + '\')">✏️ 수정</button>'
            + '<button class="btn btn-sm btn-gray" onclick="viewResults(\'' + e.id + '\')">📊 결과</button>'
            + '<button class="btn btn-sm btn-danger" onclick="delEvent(' + e.rowIdx + ',\'' + e.id + '\')">🗑 삭제</button>'
          + '</div></div>';
      }).join('');
    }).getEvents();
  }

  function renderModeGrid() {
    document.getElementById('modeGrid').innerHTML = MODES.map(function(m){
      return '<div class="mode-opt ' + (m.v===_selMode?'sel':'') + '" onclick="selectMode(\'' + m.v + '\')"><div class="t">' + m.t + '</div><div class="d">' + m.d + '</div></div>';
    }).join('');
    document.getElementById('leastFirstWrap').style.display = (_selMode==='random') ? 'block' : 'none';
  }
  function selectMode(v) { _selMode = v; renderModeGrid(); }

  function openForm() {
    document.getElementById('fRowIdx').value = '';
    document.getElementById('fId').value = '';
    document.getElementById('formTitle').textContent = '새 칭찬 이벤트';
    document.getElementById('fTitle').value = '';
    _selMode = 'relay'; renderModeGrid();
    var today = new Date(); var ymd = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    document.getElementById('fStart').value = ymd;
    document.getElementById('fEnd').value = '';
    document.getElementById('fAnon').value = 'real';
    document.getElementById('fBoard').value = 'class';
    document.getElementById('fMinLen').value = '5';
    document.getElementById('fDailyLimit').value = '0';
    document.getElementById('fLeastFirst').checked = false;
    document.getElementById('formModal').style.display = 'flex';
  }

  function editEvent(id) {
    var e = _events.filter(function(x){return x.id===id;})[0];
    if (!e) return;
    document.getElementById('fRowIdx').value = e.rowIdx;
    document.getElementById('fId').value = e.id;
    document.getElementById('formTitle').textContent = '이벤트 수정';
    document.getElementById('fTitle').value = e.title;
    _selMode = e.mode; renderModeGrid();
    document.getElementById('fClass').value = e.cls;
    document.getElementById('fStart').value = e.start;
    document.getElementById('fEnd').value = e.end;
    var o = e.options || {};
    document.getElementById('fAnon').value = o.anon || 'real';
    document.getElementById('fBoard').value = o.board || 'class';
    document.getElementById('fMinLen').value = o.minLen != null ? o.minLen : 5;
    document.getElementById('fDailyLimit').value = o.dailyLimit != null ? o.dailyLimit : 0;
    document.getElementById('fLeastFirst').checked = !!o.leastFirst;
    document.getElementById('formModal').style.display = 'flex';
  }

  function saveEventForm() {
    var title = document.getElementById('fTitle').value.trim();
    var cls = document.getElementById('fClass').value;
    if (!title) return alert('제목을 입력해주세요.');
    if (!cls) return alert('대상 반을 선택해주세요.');
    var data = {
      rowIdx: parseInt(document.getElementById('fRowIdx').value) || null,
      id: document.getElementById('fId').value || null,
      title: title, mode: _selMode, cls: cls,
      start: document.getElementById('fStart').value,
      end: document.getElementById('fEnd').value,
      active: true,
      options: {
        anon: document.getElementById('fAnon').value,
        board: document.getElementById('fBoard').value,
        minLen: parseInt(document.getElementById('fMinLen').value) || 0,
        dailyLimit: parseInt(document.getElementById('fDailyLimit').value) || 0,
        leastFirst: document.getElementById('fLeastFirst').checked
      }
    };
    var btn = document.getElementById('fSaveBtn');
    btn.disabled = true; btn.textContent = '저장 중...';
    google.script.run
      .withSuccessHandler(function(res){
        btn.disabled = false; btn.textContent = '💾 저장';
        if (res && res.success) { document.getElementById('formModal').style.display='none'; loadEvents(); }
        else alert('저장 실패: ' + ((res && res.message) || '알 수 없는 오류'));
      })
      .withFailureHandler(function(err){
        btn.disabled = false; btn.textContent = '💾 저장';
        alert('서버 오류로 저장하지 못했어요:\n' + (err && err.message ? err.message : err));
      })
      .saveEvent(data);
  }

  function toggleActive(rowIdx, active) {
    google.script.run.withSuccessHandler(function(){ loadEvents(); }).toggleEventActive(rowIdx, active);
  }
  function delEvent(rowIdx, id) {
    if (!confirm('이 이벤트와 모든 칭찬 기록이 삭제됩니다. 계속할까요?')) return;
    google.script.run.withSuccessHandler(function(){ loadEvents(); }).deleteEvent(rowIdx, id);
  }

  function loadFormRoster() { /* 참여자 자동(전체 반) — 추후 개별선택 확장 가능 */ }

  function populateResultSelect() {
    var sel = document.getElementById('resultEventSel');
    sel.innerHTML = '<option value="">이벤트 선택</option>' + _events.map(function(e){
      return '<option value="' + e.id + '">' + e.title + ' (' + e.cls + ')</option>';
    }).join('');
  }
  function viewResults(id) { switchTab(2); document.getElementById('resultEventSel').value = id; loadResults(); }

  function loadResults() {
    var id = document.getElementById('resultEventSel').value;
    var statsBox = document.getElementById('statsBox');
    var resBox = document.getElementById('resultsBox');
    if (!id) { statsBox.innerHTML=''; resBox.innerHTML=''; return; }
    statsBox.innerHTML = '<div class="card muted" style="text-align:center;">불러오는 중...</div>';
    resBox.innerHTML = '';
    google.script.run.withSuccessHandler(function(st){
      if (!st.success) { statsBox.innerHTML = '<div class="card">통계 오류</div>'; return; }
      var medal = ['🥇','🥈','🥉'];
      function rankList(arr, dir, unit, valColor) {
        if (!arr || !arr.length) return '<div class="muted">없음</div>';
        return arr.map(function(x,i){
          var rk = medal[i] || ((i+1) + '.');
          var click = dir ? (' style="cursor:pointer;" onclick="filterStudent(\'' + x.id + '\',\'' + dir + '\')"') : '';
          return '<div class="stat-row"' + click + '><span>' + rk + ' ' + x.name + (dir ? ' <span class="muted">›</span>' : '') + '</span><b' + (valColor ? ' style="color:' + valColor + ';"' : '') + '>' + x.count + unit + '</b></div>';
        }).join('');
      }
      var giv = rankList(st.topGivers, 'sent', '회');
      var rec = rankList(st.topReceivers, 'recv', '회');
      var noRec = st.noReceive.length ? '<div style="margin-top:8px;font-size:12px;color:#dc2626;">🔔 아직 못 받은 학생 (' + st.noReceive.length + '명): ' + st.noReceive.join(', ') + '</div>' : '<div style="margin-top:8px;font-size:12px;color:#10b981;">✅ 모든 학생이 칭찬을 받았어요!</div>';

      // ❤️ 하트 랭킹 2종: 많이 선물한 학생(누른 사람) / 많이 받은 학생(칭찬 작성자 = 선물 대상)
      var hGiven = st.topHeartsGiven || [];
      var hRecv  = st.topHeartsRecv  || [];
      var heartHtml;
      if (!hGiven.length && !hRecv.length) {
        heartHtml = '<div style="margin-top:12px;padding:12px;background:#fdf2f8;border:1px solid #fbcfe8;border-radius:10px;"><div style="font-weight:800;color:#be185d;font-size:13px;">❤️ 하트 랭킹</div><div class="muted" style="margin-top:4px;">아직 하트가 없어요. 학생들이 받은 칭찬에 하트를 누르면 집계돼요.</div></div>';
      } else {
        heartHtml = '<div style="margin-top:12px;padding:12px;background:#fdf2f8;border:1px solid #fbcfe8;border-radius:10px;">'
          + '<div style="font-weight:800;color:#be185d;font-size:13px;margin-bottom:8px;">❤️ 하트 랭킹 (총 ' + (st.heartTotal||0) + '개)</div>'
          + '<div class="row"><div><div class="muted" style="font-weight:700;margin-bottom:4px;">🎁 많이 선물한 학생 <span style="font-weight:400;">(하트 누름)</span></div>' + rankList(hGiven, 'recv', '❤️', '#db2777') + '</div>'
          + '<div><div class="muted" style="font-weight:700;margin-bottom:4px;">💖 많이 받은 학생 <span style="font-weight:400;">(선물 대상)</span></div>' + rankList(hRecv, 'sent', '❤️', '#db2777') + '</div></div>'
          + '</div>';
      }

      // 미실시자 (교사 전용)
      var ng = st.notGiven || [];
      var done = (st.doneCount!=null?st.doneCount:0), tot = (st.participantCount!=null?st.participantCount:0);
      var ngHtml;
      if (!ng.length) {
        ngHtml = '<div style="margin-top:6px;font-size:12px;color:#10b981;">✅ 참여 대상 ' + tot + '명 모두 실시 완료!</div>';
      } else {
        ngHtml = '<div style="margin-top:10px;padding:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;">'
          + '<div style="font-weight:800;color:#c2410c;font-size:13px;margin-bottom:6px;">📋 미실시자 ' + ng.length + '명 (실시 ' + done + '/' + tot + ') · 교사만 보임</div>'
          + '<div style="font-size:13px;color:#9a3412;line-height:1.7;">'
          + ng.map(function(s){ return s.name + '(' + s.id + ')'; }).join(', ')
          + '</div></div>';
      }
      statsBox.innerHTML = '<div class="card"><div style="font-weight:800;margin-bottom:8px;">📊 통계 (총 ' + st.total + '개 칭찬)</div>'
        + ngHtml
        + '<div class="row" style="margin-top:10px;"><div><div class="muted" style="font-weight:700;margin-bottom:4px;">🖊 많이 칭찬한 학생</div>' + giv + '</div>'
        + '<div><div class="muted" style="font-weight:700;margin-bottom:4px;">💌 많이 받은 학생</div>' + rec + '</div></div>'
        + noRec + heartHtml + '</div>';
    }).getEventStats(id);

    google.script.run.withSuccessHandler(function(res){
      if (!res.success) { resBox.innerHTML = '<div class="card">기록 오류</div>'; return; }
      _recs = res.records || [];
      // 이벤트가 바뀐 경우에만 필터 초기화 (숨김/삭제 후 재조회 시엔 유지)
      if (_lastEventId !== id) { _filter = { sid: '', dir: 'all' }; _lastEventId = id; }
      renderRecords();
    }).getEventResults(id);
  }

  // ── 학생별 보기 (보낸/받은 칭찬 전체) ──
  var _recs = [];
  var _lastEventId = null;
  var _filter = { sid: '', dir: 'all' }; // dir: all | sent | recv

  function filterStudent(sid, dir) {
    _filter.sid = String(sid);
    _filter.dir = dir || 'all';
    renderRecords();
    var box = document.getElementById('resultsBox');
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function onFilterChange() {
    _filter.sid = document.getElementById('fltStudent').value;
    _filter.dir = document.getElementById('fltDir').value;
    renderRecords();
  }

  function renderRecords() {
    var resBox = document.getElementById('resultsBox');
    if (_recs.length === 0) { resBox.innerHTML = '<div class="card muted" style="text-align:center;">아직 칭찬 기록이 없어요.</div>'; return; }

    // 학생 목록 (기록에 등장한 보낸/받은 학생 전체, 학번순)
    var nameOf = {};
    _recs.forEach(function(r){
      if (r.fromId) nameOf[r.fromId] = r.fromName || nameOf[r.fromId] || r.fromId;
      if (r.toId)   nameOf[r.toId]   = r.toName   || nameOf[r.toId]   || r.toId;
    });
    var sids = Object.keys(nameOf).sort(function(a,b){ return a.localeCompare(b, undefined, {numeric:true}); });

    var list = _recs;
    var label = '';
    if (_filter.sid) {
      var nm = nameOf[_filter.sid] || _filter.sid;
      if (_filter.dir === 'sent')      { list = _recs.filter(function(r){ return r.fromId === _filter.sid; }); label = nm + ' 학생이 보낸 칭찬'; }
      else if (_filter.dir === 'recv') { list = _recs.filter(function(r){ return r.toId   === _filter.sid; }); label = nm + ' 학생이 받은 칭찬'; }
      else                             { list = _recs.filter(function(r){ return r.fromId === _filter.sid || r.toId === _filter.sid; }); label = nm + ' 학생의 칭찬 (보낸+받은)'; }
    }

    var filterBar = '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center;">'
      + '<select id="fltStudent" style="flex:2;min-width:120px;" onchange="onFilterChange()">'
        + '<option value="">전체 학생</option>'
        + sids.map(function(s){ return '<option value="' + s + '"' + (s===_filter.sid?' selected':'') + '>' + (nameOf[s]||s) + ' (' + s + ')</option>'; }).join('')
      + '</select>'
      + '<select id="fltDir" style="flex:1;min-width:90px;" onchange="onFilterChange()">'
        + '<option value="all"' + (_filter.dir==='all'?' selected':'') + '>보낸+받은</option>'
        + '<option value="sent"' + (_filter.dir==='sent'?' selected':'') + '>🖊 보낸 것만</option>'
        + '<option value="recv"' + (_filter.dir==='recv'?' selected':'') + '>💌 받은 것만</option>'
      + '</select>'
      + (_filter.sid ? '<button class="btn btn-sm btn-gray" onclick="filterStudent(\'\',\'all\')">✕ 해제</button>' : '')
      + '</div>'
      + (label ? '<div style="font-size:13px;font-weight:800;color:#7c3aed;margin-bottom:8px;">👤 ' + label + ' — ' + list.length + '개</div>' : '');

    var body;
    if (list.length === 0) {
      body = '<div class="muted" style="text-align:center;padding:14px;">해당하는 칭찬이 없어요.</div>';
    } else {
      body = list.map(function(r){
        // 익명 글도 교사 화면에선 실명 확인 가능 (관리 목적) — 익명 표시는 유지
        var from = r.anon ? r.fromName + ' <span class="muted">(학생에겐 익명)</span>' : r.fromName;
        return '<div class="rec" style="' + (r.hidden?'opacity:0.5;':'') + '">'
          + '<div style="display:flex;justify-content:space-between;align-items:center;">'
            + '<div><b>' + from + '</b> → <b style="color:#7c3aed;">' + r.toName + '</b> <span class="muted">' + r.time + '</span></div>'
            + '<div style="display:flex;gap:4px;flex-shrink:0;">'
              + '<button class="btn btn-sm btn-gray" onclick="toggleHide(' + r.rowIdx + ',' + (!r.hidden) + ')">' + (r.hidden?'복원':'숨김') + '</button>'
              + '<button class="btn btn-sm btn-danger" onclick="delRec(' + r.rowIdx + ')">삭제</button>'
            + '</div>'
          + '</div>'
          + '<div style="margin-top:4px;">' + (r.content||'').replace(/</g,'&lt;') + '</div>'
        + '</div>';
      }).join('');
    }

    resBox.innerHTML = '<div class="card"><div style="font-weight:800;margin-bottom:8px;">📜 칭찬 기록 (' + _recs.length + '개)</div>'
      + filterBar + body + '</div>';
  }

  function toggleHide(rowIdx, hidden) { google.script.run.withSuccessHandler(function(){ loadResults(); }).togglePraiseHidden(rowIdx, hidden); }
  function delRec(rowIdx) { if(!confirm('이 칭찬을 삭제할까요?')) return; google.script.run.withSuccessHandler(function(){ loadResults(); }).deletePraise(rowIdx); }

  // 초기화
  google.script.run.withSuccessHandler(function(res){
    var opts = (res.classes||[]).map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
    document.getElementById('fClass').innerHTML = '<option value="">반 선택</option>' + opts;
  }).getClassList();
  renderModeGrid();
  loadEvents();
</script>
</body>
</html>
