name: Supabase keepalive + roster sync

# 매주 월요일 오전 8시(KST) — ①무료 티어 7일 미사용 일시정지 방지 ②명부 자동 동기화
on:
  schedule:
    - cron: '0 23 * * 0'   # UTC 일 23:00 = KST 월 08:00
  workflow_dispatch: {}     # 수동 실행도 가능

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (일시정지 방지)
        run: |
          # anon 키는 공개용 (보안은 RLS 담당) — fcm-sw/lessons/supabase-config.js와 동일 키
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxanJycWhybnhjdHlycWNjbWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MDcwNzUsImV4cCI6MjA5OTk4MzA3NX0.7j44nTdC4CGSFm-1PTECdWNEHUnBb4SvhrcLfY8M4_Q" \
            "https://lqjrrqhrnxctyrqccmch.supabase.co/auth/v1/health")
          echo "Supabase health: $code"
          [ "$code" = "200" ] || exit 1

      - name: Roster sync (GAS → Supabase)
        run: |
          out=$(curl -sL "https://script.google.com/macros/s/AKfycbyR1whn6f90-kJEAaJg_O34uP8v-KvyEqsRky58idjoxVDS5cWj80p2ScJp6V2dnz_0hA/exec?action=syncRoster&key=${{ secrets.HONGSSAM_SYNC_KEY }}")
          echo "$out"
          echo "$out" | grep -q '"success":true' || exit 1
