<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root { --primary: #5c6ac4; --text-main: #2d3748; }
    body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); color: var(--text-main); margin: 0; padding: 2.5vw 4vw; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }

    .header-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5vw; }
    .header-title { font-size: 3.5vw; font-weight: 800; color: #1a202c; margin: 0; }
    .header-date { font-size: 1.8vw; font-weight: 700; color: #4a5568; background: rgba(255,255,255,0.6); padding: 0.8vw 1.8vw; border-radius: 50px; }

    .content-container { display: flex; gap: 2.5vw; flex: 1; min-height: 0; }

    .text-section { flex: 7; display: flex; flex-direction: row; gap: 2.5vw; min-height: 0; }
    .card { background: rgba(255,255,255,0.95); padding: 2.5vw; border-radius: 2vw; flex: 1; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .card-title { font-size: 2vw; font-weight: 800; color: var(--primary); margin-bottom: 1.5vw; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 1vw; flex-shrink: 0; }

    .scroll-wrapper { flex: 1; position: relative; overflow: hidden; }
    .scroll-content { position: absolute; top: 0; left: 0; width: 100%; font-size: 2.5vw; line-height: 1.6; font-weight: 600; white-space: pre-wrap; word-break: keep-all; }

    .media-section { flex: 3; display: flex; flex-direction: column; gap: 1.5vw; min-height: 0; }

    .slideshow-wrapper { flex: 1; background: #000; border-radius: 1.5vw; position: relative; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
    iframe { width: 100%; height: 100%; border: none; }

    .video-wrapper { background: #000; border-radius: 1.5vw; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.15); display: none; }

    .empty-msg { color: #fff; font-size: 1.5vw; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; line-height: 1.5; }
    .audio-notice { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: white; padding: 10px; border-radius: 10px; z-index: 1000; cursor: pointer; display: none; }

    /* ── 리모컨 UI ── */
    #remoteBtn {
      position: fixed; bottom: 2vw; right: 2vw; z-index: 500;
      background: rgba(0,0,0,0.45); color: white; border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50px; padding: 0.6vw 1.4vw; font-size: 1.3vw; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 0.5vw;
      backdrop-filter: blur(6px); transition: 0.2s; user-select: none;
    }
    #remoteBtn:hover { background: rgba(0,0,0,0.65); }
    #remoteBtn.paused { background: rgba(220,38,38,0.75); border-color: rgba(255,100,100,0.5); }

    #pauseOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); z-index: 400; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 2vw;
    }
    #pauseOverlay .pause-card {
      background: white; border-radius: 2vw; padding: 3vw 4vw; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    #pauseOverlay .pause-icon { font-size: 5vw; margin-bottom: 1vw; }
    #pauseOverlay .pause-title { font-size: 2.5vw; font-weight: 800; color: #dc2626; margin-bottom: 0.8vw; }
    #pauseOverlay .pause-hint { font-size: 1.4vw; color: #64748b; line-height: 1.7; }
    #pauseOverlay .pause-hint b { color: #1e3a8a; }
    #pauseOverlay .resume-btn {
      margin-top: 2vw; padding: 1vw 3vw; background: #1e3a8a; color: white;
      border: none; border-radius: 50px; font-size: 1.8vw; font-weight: 800;
      cursor: pointer; display: inline-flex; align-items: center; gap: 0.5vw;
    }
  </style>
</head>
<body>
  <div id="audioNotice" class="audio-notice" onclick="this.style.display='none';">🔊 화면을 클릭하면 BGM이 켜집니다!</div>

  <div class="header-container">
    <h1 class="header-title">우리반 알림판</h1>
    <div class="header-date" id="dateHeader"></div>
  </div>

  <div class="content-container">
    <div class="text-section">
      <div class="card">
        <div class="card-title">📢 오늘의 공지사항</div>
        <div class="scroll-wrapper" id="annWrapper">
          <div class="scroll-content" id="announcement">데이터 동기화 중...</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="color:#d53f8c;">📌 전달사항 / 준비물</div>
        <div class="scroll-wrapper" id="notWrapper">
          <div class="scroll-content" id="notice">...</div>
        </div>
      </div>
    </div>

    <div class="media-section" id="mediaSection">
      <div class="slideshow-wrapper" id="slideshowContainer">
        <div class="empty-msg">📷 화면 준비중</div>
      </div>
      <div class="video-wrapper" id="videoContainer"></div>
    </div>
  </div>

  <!-- 일시정지 오버레이 -->
  <div id="pauseOverlay">
    <div class="pause-card">
      <div class="pause-icon">⏸</div>
      <div class="pause-title">슬라이드 일시정지</div>
      <div class="pause-hint">
        리모컨/키보드로 슬라이드를 직접 제어할 수 있습니다.<br>
        <b>← →</b> 이전 / 다음 슬라이드 &nbsp;·&nbsp; <b>Space / Esc / B / .</b> 재개
      </div>
      <button class="resume-btn" onclick="togglePause()">▶ 재개하기</button>
    </div>
  </div>

  <!-- 리모컨 버튼 (화면 우하단) -->
  <div id="remoteBtn" onclick="togglePause()" title="Space / Esc / B 키로도 전환">
    <span id="remoteBtnIcon">⏸</span>
    <span id="remoteBtnText">일시정지</span>
  </div>

  <script>
    /* ── 시계 ── */
    function updateClock() {
      var now = new Date();
      var days = ['일','월','화','수','목','금','토'];
      document.getElementById('dateHeader').innerText =
        now.getFullYear() + '. ' + (now.getMonth()+1) + '. ' + now.getDate() +
        ' (' + days[now.getDay()] + ')';
    }
    updateClock();

    /* ── 상태 ── */
    var currentSlideUrl = '';
    var currentVideo    = '';
    var currentMode     = '';
    var isPaused        = false;

    /* ── 슬라이드 URL 빌더 ── */
    function buildSlideUrl(raw, autoPlay) {
      var url = raw;
      if (url.indexOf('<iframe') !== -1) {
        var m = url.match(/src="([^"]+)"/);
        if (m) url = m[1];
      }
      // embed URL 변환
      if (url.indexOf('/pub') !== -1) {
        url = url.replace('/pub', '/embed');
      } else if (url.indexOf('/edit') !== -1) {
        url = url.substring(0, url.indexOf('/edit')) + '/embed';
      }
      // 기존 쿼리 제거 후 재구성
      url = url.split('?')[0];
      if (autoPlay) {
        url += '?start=true&loop=true&delayms=5000&rm=minimal';
      } else {
        // 일시정지 모드: 자동넘김 없음 → 리모컨 화살표로 직접 제어 가능
        url += '?start=false&loop=false&rm=minimal';
      }
      return url;
    }

    /* ── 슬라이드 iframe 갱신 ── */
    function applySlide() {
      var container = document.getElementById('slideshowContainer');
      if (!currentSlideUrl) {
        container.innerHTML = '<div class="empty-msg">📷<br>프레젠테이션 주소가<br>입력되지 않았습니다.</div>';
        return;
      }
      var url = buildSlideUrl(currentSlideUrl, !isPaused);
      container.innerHTML = '<iframe src="' + url + '" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>';
    }

    /* ── 일시정지 토글 ── */
    function togglePause() {
      isPaused = !isPaused;
      var overlay = document.getElementById('pauseOverlay');
      var btn     = document.getElementById('remoteBtn');
      var icon    = document.getElementById('remoteBtnIcon');
      var txt     = document.getElementById('remoteBtnText');

      if (isPaused) {
        overlay.style.display = 'flex';
        btn.classList.add('paused');
        icon.textContent = '▶';
        txt.textContent  = '재개';
      } else {
        overlay.style.display = 'none';
        btn.classList.remove('paused');
        icon.textContent = '⏸';
        txt.textContent  = '일시정지';
      }
      applySlide();
    }

    /* ── 키보드 / 리모컨 단축키 ── */
    document.addEventListener('keydown', function(e) {
      // 일시정지: Space, Esc, B, . (블루투스 리모컨의 Blackout/Stop 키)
      if (e.key === ' ' || e.key === 'Escape' ||
          e.key === 'b' || e.key === 'B' || e.key === '.') {
        e.preventDefault();
        togglePause();
      }
    });

    /* ── 스크롤 애니메이션 ── */
    function applyAutoScroll(wrapperId, contentId) {
      var wrapper = document.getElementById(wrapperId);
      var content = document.getElementById(contentId);
      if (content._scroller) clearInterval(content._scroller);
      var y = 0, mode = 'wait_top', ticks = 0;
      content._scroller = setInterval(function() {
        var wH = wrapper.clientHeight, cH = content.scrollHeight;
        if (cH <= wH) { content.style.top = '0px'; return; }
        if      (mode === 'wait_top')    { ticks++; if (ticks > 100) { mode = 'scroll'; ticks = 0; } }
        else if (mode === 'scroll')      { y -= 0.5; content.style.top = y + 'px'; if (-y >= cH - wH + 20) mode = 'wait_bottom'; }
        else if (mode === 'wait_bottom') { ticks++; if (ticks > 100) { mode = 'reset'; ticks = 0; } }
        else if (mode === 'reset')       { y += 10; content.style.top = y + 'px'; if (y >= 0) { y = 0; content.style.top = '0px'; mode = 'wait_top'; } }
      }, 30);
    }

    /* ── 데이터 표시 ── */
    function displayData(data) {
      if (data && data.error) {
        document.getElementById('announcement').innerHTML = '<span style="color:red;">🚨 오류: ' + data.error + '</span>';
        return;
      }

      document.getElementById('announcement').innerText = data.announcement;
      document.getElementById('notice').innerText       = data.notice;
      setTimeout(function() {
        applyAutoScroll('annWrapper', 'announcement');
        applyAutoScroll('notWrapper', 'notice');
      }, 500);

      // 슬라이드 변경됐을 때만 다시 로드 (일시정지 상태 유지)
      if (data.slideUrl !== currentSlideUrl) {
        currentSlideUrl = data.slideUrl || '';
        applySlide();
      }

      // 유튜브
      var vidWrapper = document.getElementById('videoContainer');
      var mode = data.videoMode || '소리만';
      var slideContainer = document.getElementById('slideshowContainer');

      if (currentVideo !== data.videoUrl || currentMode !== mode) {
        currentVideo = data.videoUrl; currentMode = mode;
        if (data.videoUrl) {
          // 모든 유튜브 형식 대응: watch?v= / youtu.be/ / embed/ / shorts/ / live/
          var vidId = (String(data.videoUrl).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/) || [])[1] || '';
          if (vidId) {
            document.getElementById('audioNotice').style.display = 'block';
            vidWrapper.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vidId +
              '?autoplay=1&mute=0&loop=1&playlist=' + vidId + '&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
          } else {
            vidWrapper.innerHTML = '<div style="color:#fff;display:flex;align-items:center;justify-content:center;height:100%;font-size:1.3vw;text-align:center;">⚠️ 유튜브 주소를 확인하세요<br><span style="font-size:0.9vw;opacity:.7;">' + (data.videoUrl || '') + '</span></div>';
          }
          if (mode === '가득차게') { slideContainer.style.display = 'none'; vidWrapper.style.display = 'block'; vidWrapper.style.flex = '1'; }
          else if (mode === '소리만') { slideContainer.style.display = 'block'; slideContainer.style.flex = '1'; vidWrapper.style.display = 'none'; }
          else { /* 보이기: 슬라이드 절반 + 영상 절반 */ slideContainer.style.display = 'block'; slideContainer.style.flex = '1'; vidWrapper.style.display = 'block'; vidWrapper.style.flex = '1'; }
        } else {
          vidWrapper.innerHTML = ''; vidWrapper.style.display = 'none'; slideContainer.style.display = 'block';
        }
      }
    }

    function loadData() { google.script.run.withSuccessHandler(displayData).getTodayData(); }

    // ── 📺 교사 실시간 알림(팝업) — 같은 앱 getTvFlash 폴링(same-origin) ──
    var _tvFlashLastId = null;
    function showTvFlash(msg) {
      var ov = document.getElementById('tvFlashOverlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.id = 'tvFlashOverlay';
        ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:5vw;';
        ov.innerHTML = '<div id="tvFlashCard" style="max-width:1100px;width:100%;background:#fff;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.5);border:6px solid #2563eb;padding:6vh 5vw;text-align:center;animation:tvFlashPop .35s ease-out;">'
          + '<div style="font-size:clamp(28px,6vw,64px);margin-bottom:2vh;">📢</div>'
          + '<div id="tvFlashMsg" style="font-size:clamp(32px,7vw,84px);font-weight:900;color:#0f172a;line-height:1.35;word-break:keep-all;white-space:pre-wrap;"></div>'
          + '</div>';
        document.body.appendChild(ov);
      }
      document.getElementById('tvFlashMsg').textContent = msg;
      ov.style.display = 'flex';
      var card = document.getElementById('tvFlashCard');
      if (card) { card.style.animation = 'none'; void card.offsetWidth; card.style.animation = 'tvFlashPop .35s ease-out'; }
    }
    function hideTvFlash() { var ov = document.getElementById('tvFlashOverlay'); if (ov) ov.style.display = 'none'; }
    function pollTvFlash() {
      google.script.run.withSuccessHandler(function(f){
        if (!f) return;
        if (f.id === _tvFlashLastId) return;
        _tvFlashLastId = f.id;
        if (f.msg) showTvFlash(f.msg); else hideTvFlash();
      }).withFailureHandler(function(){}).getTvFlash();
    }

    // ── 🎵 점심 음악(TV BGM) — 알림관리가 쓴 _TV_MUSIC 폴링. 좌하단 미니 플레이어 + 곡 제목 ──
    var _ytP=null,_ytReady=false,_musicWant=null,_musicCurUrl='',_musicTitleTimer=null;
    var _tvMusicLastMId=null,_tvMusicOverride=null;
    function _initMusicBox(){
      if(document.getElementById('musicBox'))return;
      var d=document.createElement('div'); d.id='musicBox';
      d.style.cssText='position:fixed;bottom:2vw;left:2vw;z-index:500;width:20vw;background:rgba(15,23,42,.85);border-radius:1vw;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;display:none;';
      d.innerHTML='<div id="musicPlayer" style="width:100%;height:11.25vw;background:#000;"></div>'
        +'<div style="display:flex;align-items:center;gap:.6vw;padding:.7vw 1vw;">'
        +'<span style="font-size:1.4vw;">🎵</span>'
        +'<div id="musicTitle" style="flex:1;color:#fff;font-size:1vw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">점심 음악</div></div>'
        +'<div id="musicHint" onclick="if(_ytP&&_ytP.playVideo){_ytP.playVideo();}this.style.display=\'none\';" style="display:none;padding:.6vw 1vw;background:rgba(220,38,38,.92);color:#fff;font-size:.85vw;text-align:center;cursor:pointer;">🔊 화면을 클릭하면 음악이 켜져요</div>';
      document.body.appendChild(d);
    }
    function _loadYT(){ _initMusicBox(); if(window.YT&&window.YT.Player){onYouTubeIframeAPIReady();return;} var t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t); }
    function onYouTubeIframeAPIReady(){
      _ytP=new YT.Player('musicPlayer',{height:'100%',width:'100%',
        playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1},
        events:{onReady:function(){_ytReady=true;if(_musicWant)_applyMusicPlay(_musicWant);},
          onStateChange:function(e){if(e.data===1){var h=document.getElementById('musicHint');if(h)h.style.display='none';}}}});
    }
    function _parseYT(u){return{list:(String(u).match(/[?&]list=([A-Za-z0-9_-]+)/)||[])[1]||'',vid:(String(u).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/)||[])[1]||''};}
    function _applyMusicPlay(w){
      var box=document.getElementById('musicBox');if(box)box.style.display='block';
      if(!_ytReady||!_ytP||!_ytP.loadVideoById)return;
      var p=_parseYT(w.url);
      try{
        if(p.list)_ytP.loadPlaylist({list:p.list,listType:'playlist',index:0});
        else if(p.vid)_ytP.loadVideoById(p.vid);
        else{var mt=document.getElementById('musicTitle');if(mt)mt.textContent='⚠️ 주소 확인';return;}
        if(_ytP.setLoop)_ytP.setLoop(true);
        setTimeout(function(){try{if(_ytP.getPlayerState&&_ytP.getPlayerState()!==1){var h=document.getElementById('musicHint');if(h)h.style.display='block';}}catch(_){}},1600);
        _startTitlePoll();
      }catch(_){}
    }
    function _stopMusic(){try{if(_ytP&&_ytP.stopVideo)_ytP.stopVideo();}catch(_){}var box=document.getElementById('musicBox');if(box)box.style.display='none';if(_musicTitleTimer){clearInterval(_musicTitleTimer);_musicTitleTimer=null;}}
    function _startTitlePoll(){if(_musicTitleTimer)clearInterval(_musicTitleTimer);_musicTitleTimer=setInterval(function(){try{var d=_ytP&&_ytP.getVideoData&&_ytP.getVideoData();if(d&&d.title){var mt=document.getElementById('musicTitle');if(mt)mt.textContent=d.title;}}catch(_){}},2000);}
    function applyMusic(play,url){ if(play&&url){ if(_musicCurUrl!==url){_musicCurUrl=url;_musicWant={url:url};_applyMusicPlay(_musicWant);} } else { if(_musicCurUrl!==''){_musicCurUrl='';_musicWant=null;_stopMusic();} } }
    function _hhmmNow(){var n=new Date();return (n.getHours()<10?'0':'')+n.getHours()+':'+(n.getMinutes()<10?'0':'')+n.getMinutes();}
    function tickMusic(d){
      if(!d)return; var now=_hhmmNow();
      var inWin=!!(d.aOn&&d.aStart&&d.aEnd&&now>=d.aStart&&now<d.aEnd);
      var autoKey=inWin?('play:'+d.aUrl):'stop';
      if(d.mId&&d.mId!==_tvMusicLastMId){_tvMusicLastMId=d.mId;_tvMusicOverride={key:autoKey,mode:d.mMode,url:d.mUrl};applyMusic(d.mMode==='play',d.mUrl);return;}
      if(_tvMusicOverride&&_tvMusicOverride.key!==autoKey)_tvMusicOverride=null;
      if(_tvMusicOverride){applyMusic(_tvMusicOverride.mode==='play',_tvMusicOverride.url);return;}
      applyMusic(inWin,d.aUrl);
    }
    function pollTvMusic(){google.script.run.withSuccessHandler(tickMusic).withFailureHandler(function(){}).getTvMusic();}

    // ── 💬 우리반 응원문구 표시 (팝업 / 리스트 / 롤링페이퍼) — 알림관리가 켜고 스타일 지정, 학생-담임이 입력 ──
    (function(){ var st=document.createElement('style'); st.textContent='@keyframes cheerPop{0%{transform:translateX(-50%) scale(.8);opacity:0}60%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1);opacity:1}}@keyframes cheerMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}'; document.head.appendChild(st); })();
    function _ce(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    var _cheerSig='', _cheerPopupTimer=null, _cheerPopupIdx=0;
    var _cheerColors=['#fef08a','#bbf7d0','#bfdbfe','#fbcfe8','#fed7aa','#ddd6fe','#a7f3d0'];
    function _cheerBox(){ var b=document.getElementById('cheerLayer'); if(!b){ b=document.createElement('div'); b.id='cheerLayer'; b.style.cssText='position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none;z-index:400;overflow:hidden;'; document.body.appendChild(b); } return b; }
    function applyCheers(d){
      if(!d) return;
      var sig=(d.on?'1':'0')+'|'+d.style+'|'+(d.list||[]).map(function(c){return c.id;}).join(',');
      if(sig===_cheerSig) return;
      _cheerSig=sig;
      var box=_cheerBox();
      if(_cheerPopupTimer){ clearInterval(_cheerPopupTimer); _cheerPopupTimer=null; }
      if(!d.on || !d.list || !d.list.length){ box.innerHTML=''; box.style.display='none'; return; }
      box.style.display='block';
      if(d.style==='list') renderCheerList(box,d.list);
      else if(d.style==='rolling') renderCheerRolling(box,d.list);
      else startCheerPopup(box,d.list);
    }
    function startCheerPopup(box,list){
      box.innerHTML='<div id="cheerPop" style="position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);max-width:72vw;background:rgba(255,255,255,.97);border:4px solid #f59e0b;border-radius:24px;padding:2.4vh 3vw;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;">'
        +'<div style="font-size:1vw;font-weight:800;color:#f59e0b;margin-bottom:.6vh;">💬 우리반 응원</div>'
        +'<div id="cheerPopText" style="font-size:2.4vw;font-weight:900;color:#0f172a;line-height:1.35;word-break:keep-all;"></div>'
        +'<div id="cheerPopName" style="font-size:1.2vw;font-weight:700;color:#64748b;margin-top:.8vh;"></div></div>';
      _cheerPopupIdx=0;
      var show=function(){ var c=list[_cheerPopupIdx%list.length]; _cheerPopupIdx++;
        var tx=document.getElementById('cheerPopText'), nm=document.getElementById('cheerPopName'), card=document.getElementById('cheerPop');
        if(!tx) return;
        tx.textContent='“'+c.text+'”'; nm.textContent='— '+(c.name||'익명')+(c.cls?(' · '+c.cls):'');
        if(card){ card.style.animation='none'; void card.offsetWidth; card.style.animation='cheerPop .4s ease-out'; }
      };
      show(); _cheerPopupTimer=setInterval(show,5000);
    }
    function renderCheerList(box,list){
      var items=list.slice(0,12).map(function(c){ return '<span style="display:inline-block;background:rgba(255,255,255,.96);border-radius:18px;padding:.7vh 1.2vw;margin:0 .5vw;font-size:1.4vw;font-weight:700;color:#0f172a;box-shadow:0 3px 8px rgba(0,0,0,.18);">💬 '+_ce(c.text)+' <span style="color:#f59e0b;font-size:1.1vw;">'+_ce(c.name||'')+'</span></span>'; }).join('');
      box.innerHTML='<div style="position:fixed;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(15,23,42,.82),transparent);padding:2.2vh 0 1.4vh;overflow:hidden;white-space:nowrap;">'
        +'<div style="display:inline-block;white-space:nowrap;animation:cheerMarquee 32s linear infinite;padding-left:100%;">'+items+items+'</div></div>';
    }
    function renderCheerRolling(box,list){
      var notes=list.slice(0,10).map(function(c,i){
        var col=_cheerColors[i%_cheerColors.length];
        var top=1+((i*29)%16), left=2+((i*53)%80), rot=((i*47)%12)-6;   // 하단 띠(30vh) 안에서만 흩뿌림
        return '<div style="position:absolute;top:'+top+'vh;left:'+left+'vw;width:15vw;background:'+col+';padding:1vh 1vw;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.3);transform:rotate('+rot+'deg);font-size:1.15vw;font-weight:700;color:#1f2937;word-break:keep-all;">💬 '+_ce(c.text)+'<div style="font-size:.9vw;color:#6b7280;margin-top:.3vh;text-align:right;">- '+_ce(c.name||'')+'</div></div>';
      }).join('');
      box.innerHTML=notes;
    }
    function pollCheers(){ google.script.run.withSuccessHandler(applyCheers).withFailureHandler(function(){}).getCheers(); }

    window.onload = function() { loadData(); setInterval(loadData, 60000); pollTvFlash(); setInterval(pollTvFlash, 3000); _loadYT(); pollTvMusic(); setInterval(pollTvMusic, 3000); pollCheers(); setInterval(pollCheers, 4000); };
    document.body.addEventListener('click', function() { document.getElementById('audioNotice').style.display = 'none'; });
  </script>
  <style>@keyframes tvFlashPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}</style>
