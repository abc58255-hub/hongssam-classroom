<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:linear-gradient(135deg,#1e3a5f 0%,#0f2027 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:20px; padding:36px 30px; max-width:460px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .icon { font-size:44px; text-align:center; margin-bottom:12px; }
  h1 { font-size:21px; text-align:center; color:#1e293b; margin-bottom:8px; }
  .desc { font-size:13.5px; color:#64748b; text-align:center; line-height:1.7; margin-bottom:22px; }
  .desc b { color:#334155; }
  label { display:block; font-size:13px; font-weight:700; color:#334155; margin-bottom:6px; }
  input { width:100%; padding:13px 14px; border:2px solid #e2e8f0; border-radius:12px; font-size:14px; outline:none; transition:border .15s; }
  input:focus { border-color:#3b82f6; }
  .hint { font-size:12px; color:#94a3b8; margin-top:6px; line-height:1.6; }
  button { width:100%; margin-top:18px; padding:14px; border:none; border-radius:12px; background:#2563eb; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { background:#94a3b8; cursor:default; }
  .msg { margin-top:14px; font-size:13px; line-height:1.6; text-align:center; white-space:pre-line; display:none; border-radius:10px; padding:12px; }
  .msg.err { display:block; background:#fef2f2; color:#dc2626; }
  .msg.ok { display:block; background:#f0fdf4; color:#16a34a; }
  .foot { margin-top:20px; font-size:11.5px; color:#94a3b8; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔗</div>
  <h1>초기 설정</h1>
  <div class="desc">이 앱이 사용할 <b>공유 스프레드시트</b>를 연결해주세요.<br>처음 한 번만 설정하면 돼요.</div>
  <label>스프레드시트 주소 또는 ID</label>
  <input id="sidInput" type="text" placeholder="https://docs.google.com/spreadsheets/d/... 붙여넣기" autocomplete="off">
  <div class="hint">교사용 대시보드에서 만든(또는 연결한) 스프레드시트의 주소창 URL을 그대로 붙여넣으면 돼요.</div>
  <button id="saveBtn" onclick="doSave()">연결하기</button>
  <div class="msg" id="msg"></div>
  <div class="foot">선생님만 설정할 수 있어요. 잘못 연결했다면 GAS 편집기 &gt; 프로젝트 설정 &gt; 스크립트 속성에서 SHEET_ID를 삭제 후 다시 설정하세요.</div>
</div>
<script>
function doSave() {
  var v = document.getElementById('sidInput').value.trim();
  var msg = document.getElementById('msg');
  var btn = document.getElementById('saveBtn');
  if (!v) { msg.className = 'msg err'; msg.textContent = '스프레드시트 주소를 입력해주세요.'; return; }
  btn.disabled = true; btn.textContent = '확인 중...';
  msg.className = 'msg'; msg.textContent = '';
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        msg.className = 'msg ok';
        msg.textContent = res.message + '\n잠시 후 자동으로 새로고침됩니다.';
        setTimeout(function(){ location.reload(); }, 1800);
      } else {
        msg.className = 'msg err';
        msg.textContent = (res && res.message) || '연결에 실패했어요.';
        btn.disabled = false; btn.textContent = '연결하기';
      }
    })
    .withFailureHandler(function(err) {
      msg.className = 'msg err';
      msg.textContent = '오류가 발생했어요: ' + (err && err.message ? err.message : err);
      btn.disabled = false; btn.textContent = '연결하기';
    })
    .saveSheetId(v);
}
document.getElementById('sidInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') doSave(); });
</script>
</body>
</html>
