<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:linear-gradient(135deg,#1e3a5f 0%,#0f2027 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:20px; padding:34px 30px; max-width:500px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .icon { font-size:44px; text-align:center; margin-bottom:10px; }
  h1 { font-size:21px; text-align:center; color:#1e293b; margin-bottom:6px; }
  .desc { font-size:13.5px; color:#64748b; text-align:center; line-height:1.7; margin-bottom:20px; }
  .tabs { display:flex; gap:8px; margin-bottom:20px; }
  .tab { flex:1; padding:11px; border:2px solid #e2e8f0; border-radius:12px; background:#fff; font-size:13.5px; font-weight:700; color:#64748b; cursor:pointer; text-align:center; }
  .tab.on { border-color:#2563eb; color:#2563eb; background:#eff6ff; }
  .pane { display:none; }
  .pane.on { display:block; }
  label { display:block; font-size:13px; font-weight:700; color:#334155; margin:14px 0 6px; }
  label .opt { font-weight:400; color:#94a3b8; font-size:12px; }
  input { width:100%; padding:12px 14px; border:2px solid #e2e8f0; border-radius:12px; font-size:14px; outline:none; }
  input:focus { border-color:#3b82f6; }
  .hint { font-size:12px; color:#94a3b8; margin-top:5px; line-height:1.6; }
  button.go { width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px; background:#2563eb; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button.go:disabled { background:#94a3b8; cursor:default; }
  .msg { margin-top:14px; font-size:13px; line-height:1.7; white-space:pre-line; display:none; border-radius:10px; padding:12px; }
  .msg.err { display:block; background:#fef2f2; color:#dc2626; }
  .msg.ok { display:block; background:#f0fdf4; color:#16a34a; }
  .msg a { color:#2563eb; word-break:break-all; }
  .foot { margin-top:18px; font-size:11.5px; color:#94a3b8; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🏫</div>
  <h1>홍쌤 교실 시스템 — 초기 설정</h1>
  <div class="desc">처음 한 번만 설정하면 돼요.<br>새로 시작하거나, 이미 쓰던 스프레드시트를 연결하세요.</div>

  <div class="tabs">
    <div class="tab on" id="tabNew" onclick="swTab('new')">🆕 새로 시작하기</div>
    <div class="tab" id="tabLink" onclick="swTab('link')">🔗 기존 시트 연결</div>
  </div>

  <!-- 새로 시작 -->
  <div class="pane on" id="paneNew">
    <div class="hint" style="margin-top:0;">데이터 스프레드시트(전체 시트 구조)와 드라이브 폴더를 자동으로 만들어 드려요.</div>
    <label>교사 비밀번호 (필수)</label>
    <input id="npw" type="password" placeholder="대시보드 로그인에 사용할 비밀번호" autocomplete="new-password">
    <label>담임반 <span class="opt">(선택 — 담임 기능을 쓸 때)</span></label>
    <input id="nhr" type="text" placeholder="예: 2학년 1반">
    <label>학생 가입코드 <span class="opt">(선택 — 회원가입 앱에서 사용)</span></label>
    <input id="ncode" type="text" placeholder="예: hong2026">
    <button class="go" id="btnNew" onclick="doCreate()">새 시스템 만들기</button>
  </div>

  <!-- 기존 연결 -->
  <div class="pane" id="paneLink">
    <label style="margin-top:0;">스프레드시트 주소 또는 ID</label>
    <input id="sidInput" type="text" placeholder="https://docs.google.com/spreadsheets/d/... 붙여넣기" autocomplete="off">
    <div class="hint">기존에 사용하던 공유 스프레드시트의 주소창 URL을 그대로 붙여넣으면 돼요.</div>
    <button class="go" id="btnLink" onclick="doLink()">연결하기</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="foot">설정을 바꾸려면 GAS 편집기 &gt; 프로젝트 설정 &gt; 스크립트 속성에서 SHEET_ID를 삭제한 뒤 다시 열어주세요.</div>
</div>
<script>
function swTab(t) {
  document.getElementById('tabNew').className = 'tab' + (t === 'new' ? ' on' : '');
  document.getElementById('tabLink').className = 'tab' + (t === 'link' ? ' on' : '');
  document.getElementById('paneNew').className = 'pane' + (t === 'new' ? ' on' : '');
  document.getElementById('paneLink').className = 'pane' + (t === 'link' ? ' on' : '');
  hideMsg();
}
function hideMsg() { var m = document.getElementById('msg'); m.className = 'msg'; m.innerHTML = ''; }
function showMsg(cls, html) { var m = document.getElementById('msg'); m.className = 'msg ' + cls; m.innerHTML = html; }

function doCreate() {
  var pw = document.getElementById('npw').value.trim();
  if (!pw) { showMsg('err', '교사 비밀번호를 입력해주세요.'); return; }
  var btn = document.getElementById('btnNew');
  btn.disabled = true; btn.textContent = '만드는 중... (10초 정도 걸려요)';
  hideMsg();
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showMsg('ok', '✅ ' + res.message + '<br>📄 <a href="' + res.url + '" target="_blank">새 스프레드시트 열기</a><br>잠시 후 자동으로 새로고침됩니다.');
        setTimeout(function(){ location.reload(); }, 3500);
      } else {
        showMsg('err', (res && res.message) || '생성에 실패했어요.');
        btn.disabled = false; btn.textContent = '새 시스템 만들기';
      }
    })
    .withFailureHandler(function(err) {
      showMsg('err', '오류: ' + (err && err.message ? err.message : err));
      btn.disabled = false; btn.textContent = '새 시스템 만들기';
    })
    .createNewSystem({
      teacherPw: pw,
      homeroom: document.getElementById('nhr').value.trim(),
      joinCode: document.getElementById('ncode').value.trim()
    });
}

function doLink() {
  var v = document.getElementById('sidInput').value.trim();
  if (!v) { showMsg('err', '스프레드시트 주소를 입력해주세요.'); return; }
  var btn = document.getElementById('btnLink');
  btn.disabled = true; btn.textContent = '확인 중...';
  hideMsg();
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showMsg('ok', res.message + '\n잠시 후 자동으로 새로고침됩니다.');
        setTimeout(function(){ location.reload(); }, 1800);
      } else {
        showMsg('err', (res && res.message) || '연결에 실패했어요.');
        btn.disabled = false; btn.textContent = '연결하기';
      }
    })
    .withFailureHandler(function(err) {
      showMsg('err', '오류: ' + (err && err.message ? err.message : err));
      btn.disabled = false; btn.textContent = '연결하기';
    })
    .saveSheetId(v);
}
</script>
</body>
</html>
