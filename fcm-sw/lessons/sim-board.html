<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>닮음 보물찾기 — 순위판</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Pretendard,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;}
  #lock{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:999;}
  #lock .box{background:#1e293b;padding:28px;border-radius:18px;width:300px;text-align:center;}
  #lock input{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;margin:10px 0;}
  .ctl{background:#1e293b;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #334155;position:sticky;top:0;z-index:50;}
  .ctl select,.ctl button{padding:8px 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font-weight:700;cursor:pointer;font-size:14px;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{padding:3vh 4vw;}
  .title{font-size:2.4vw;font-weight:900;color:#5eead4;}
  .sub{font-size:1.1vw;color:#94a3b8;margin-bottom:2.5vh;}
  .row{display:flex;align-items:center;gap:2vw;background:#1e293b;border-radius:14px;padding:1.6vh 2vw;margin-bottom:1.2vh;}
  .row .rk{font-size:2vw;font-weight:900;width:3.5vw;text-align:center;}
  .row .nm{flex:1;font-size:1.8vw;font-weight:800;color:#f1f5f9;}
  .row .cl{font-size:1.2vw;color:#5eead4;font-weight:800;}
  .row .pt{font-size:2vw;font-weight:900;color:#fbbf24;min-width:7vw;text-align:right;}
  .row.top1{background:linear-gradient(90deg,#78350f,#1e293b);box-shadow:0 0 0 2px #f59e0b;}
  .empty{color:#64748b;text-align:center;padding:10vh 0;font-size:1.4vw;}
  body.present .ctl{display:none !important;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:800;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
  <div id="lock"><div class="box"><h2>🔺 닮음 순위판</h2><p style="font-size:13px;color:#94a3b8;margin:8px 0;">교사 비밀번호</p>
    <input id="lpw" type="password" onkeypress="if(event.keyCode==13)doUnlock()"><button id="lbtn" onclick="doUnlock()" style="width:100%;background:#0f766e;border:none;">확인</button>
    <div id="lerr" style="color:#f87171;font-size:13px;margin-top:8px;"></div></div></div>

  <div class="ctl" id="ctl" style="display:none;">
    <select id="clsSel"></select>
    <button onclick="togglePresent()">🖥️ 전시</button>
    <span style="flex:1"></span>
    <span style="font-size:12px;color:#64748b;">실시간 자동 갱신</span>
  </div>
  <div class="wrap" id="wrap"><div class="empty">반을 선택하세요.</div></div>
  <div class="toast" id="toast"></div>

<script>
  var PORTAL='https://script.google.com/macros/s/AKfycbw8M03W7ECbqUzCPJkPb1YGrEo3SRORTDaxoTMLz5yoUw8pTLpIPAIH1qpfgJY80J9v/exec';
  var SB_URL='https://lqjrrqhrnxctyrqccmch.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxanJycWhybnhjdHlycWNjbWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MDcwNzUsImV4cCI6MjA5OTk4MzA3NX0.7j44nTdC4CGSFm-1PTECdWNEHUnBb4SvhrcLfY8M4_Q';
  var sb=supabase.createClient(SB_URL,SB_KEY);
  var TOK=localStorage.getItem('sim_ptok')||'';
  var SET=null, CH=null, BCLS='';

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1800); }
  function portalRPC(fn,args){ return fetch(PORTAL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(d){ if(d&&d.ok) return d.result; throw new Error((d&&d.error)||'서버 오류'); }); }

  function doUnlock(){
    var pw=document.getElementById('lpw').value, b=document.getElementById('lbtn');
    if(!pw) return; b.disabled=true; b.textContent='확인 중…';
    portalRPC('teacherLogin',[pw]).then(function(res){
      b.disabled=false; b.textContent='확인';
      if(res&&res.success&&res.token){ TOK=res.token; localStorage.setItem('sim_ptok',TOK); document.getElementById('lock').style.display='none'; document.getElementById('ctl').style.display='flex'; initCtl(); }
      else document.getElementById('lerr').textContent=(res&&res.message)||'비밀번호 오류';
    }).catch(function(e){ b.disabled=false; b.textContent='확인'; document.getElementById('lerr').textContent='오류: '+e.message; });
  }
  if(TOK){ document.getElementById('lock').style.display='none'; document.getElementById('ctl').style.display='flex'; initCtl(); }

  function initCtl(){
    var sel=document.getElementById('clsSel');
    portalRPC('graphClasses',[TOK]).then(function(res){
      if(res&&res.success===false){ TOK=''; localStorage.removeItem('sim_ptok'); document.getElementById('ctl').style.display='none'; document.getElementById('lock').style.display='flex'; document.getElementById('lerr').textContent=res.message||'다시 로그인'; return; }
      var cls=(res&&res.classes)||[];
      if(!cls.length){ sel.innerHTML='<option value="">반 없음</option>'; return; }
      sel.innerHTML=cls.map(function(c){return '<option>'+esc(c)+'</option>';}).join('');
      loadSet(cls[0]);
    }).catch(function(e){ toast('반 오류: '+e.message); });
    sel.addEventListener('change',function(){ loadSet(this.value); });
  }
  function loadSet(cls){
    BCLS=cls;
    sb.from('sim_sets').select('*').eq('active',true).in('class_scope',[cls,'*']).order('created_at',{ascending:false})
      .then(function(r){ var rows=r.data||[]; SET=rows.filter(function(x){return x.class_scope===cls;})[0]||rows.filter(function(x){return x.class_scope==='*';})[0]||null; subscribe(); render(); });
  }
  function subscribe(){
    if(CH){ sb.removeChannel(CH); CH=null; }
    if(!SET) return;
    CH=sb.channel('simb-'+SET.id).on('postgres_changes',{event:'*',schema:'public',table:'sim_attempts',filter:'set_id=eq.'+SET.id}, function(){ render(); }).subscribe();
  }
  function render(){
    var wrap=document.getElementById('wrap');
    if(!SET){ wrap.innerHTML='<div class="empty">이 반에 열린 닮음 활동이 없어요.</div>'; return; }
    sb.from('sim_attempts').select('student_id,name,points,cleared').eq('set_id',SET.id).eq('class_scope',BCLS)
      .then(function(r){
        var rows=r.data||[];
        var by={};
        rows.forEach(function(a){ var k=a.student_id; if(!by[k]) by[k]={name:a.name||k,pts:0,clr:0}; by[k].pts+=a.points||0; if(a.cleared)by[k].clr++; if(a.name)by[k].name=a.name; });
        var list=Object.keys(by).map(function(k){return by[k];}).sort(function(x,y){ return y.pts-x.pts || y.clr-x.clr; });
        var total=SET.station_count||0;
        var medal=['🥇','🥈','🥉'];
        var head='<div class="title">🔺 '+esc(SET.title||'닮음 보물찾기')+'</div><div class="sub">'+esc(SET.class_scope)+' · 스테이션 '+total+'개 · 참여 '+list.length+'명</div>';
        if(!list.length){ wrap.innerHTML=head+'<div class="empty">아직 푼 학생이 없어요. QR을 찾아 스캔하면 올라와요! 📷</div>'; return; }
        wrap.innerHTML=head+list.map(function(s,i){
          return '<div class="row'+(i===0?' top1':'')+'"><div class="rk">'+(medal[i]||(i+1))+'</div>'
            +'<div class="nm">'+esc(s.name)+'</div>'
            +'<div class="cl">✅ '+s.clr+'/'+total+'</div>'
            +'<div class="pt">'+s.pts+'점</div></div>';
        }).join('');
      });
  }
  function togglePresent(){ document.body.classList.toggle('present'); if(document.body.classList.contains('present')){ var h=document.createElement('div'); h.id='exitP'; h.style.cssText='position:fixed;top:8px;right:8px;z-index:900;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;'; h.textContent='✕ 제어 보기'; h.onclick=togglePresent; document.body.appendChild(h); } else { var e=document.getElementById('exitP'); if(e) e.remove(); } }
</script>
</body>
</html>
