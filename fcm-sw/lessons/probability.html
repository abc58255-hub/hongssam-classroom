<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>확률 체험 — 큰 수의 법칙</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./lessons-common.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:#0f172a;min-height:100%;padding:16px;
    background:linear-gradient(135deg,#5eead4 0%,#22d3ee 55%,#0ea5e9 100%);
    -webkit-tap-highlight-color:transparent;}
  .wrap{max-width:1320px;margin:0 auto;}

  header{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;color:#fff;}
  header .logo{width:46px;height:46px;background:rgba(255,255,255,.92);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.08);}
  header .logo svg{width:100%;height:100%;}
  header .tt{flex:1;min-width:0;}
  header h1{font-size:19px;font-weight:900;line-height:1.25;color:#fff;letter-spacing:-.3px;}
  header .sub{font-size:12px;opacity:.9;font-weight:700;margin-top:3px;}

  .grid{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px;align-items:stretch;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
  .panel{background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(14,165,233,.18), 0 2px 6px rgba(14,165,233,.08);padding:20px;display:flex;flex-direction:column;}

  /* 좌 — 던지기 영역 */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:260px;position:relative;}
  .stage::after{content:'';position:absolute;bottom:34px;width:130px;height:16px;background:radial-gradient(ellipse,rgba(14,165,233,.22) 0%,transparent 70%);filter:blur(2px);}
  .coin-wrap{position:relative;width:180px;height:180px;}
  .coin{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%, #ffffff 0%, #e2e8f0 60%, #cbd5e1 100%);
    box-shadow:inset 0 2px 8px rgba(255,255,255,.9),inset 0 -2px 10px rgba(0,0,0,.18),0 10px 24px rgba(15,23,42,.18);
    display:flex;align-items:center;justify-content:center;padding:22px;}
  .coin.flipping{animation:flip .6s ease-in-out;}
  @keyframes flip{0%{transform:rotateY(0) translateY(0);}40%{transform:rotateY(540deg) translateY(-34px);}100%{transform:rotateY(1080deg) translateY(0);}}
  .coin-back{background:radial-gradient(circle at 30% 25%, #dbeafe 0%, #93c5fd 60%, #60a5fa 100%);}
  .coin svg{width:100%;height:100%;}
  .dice{position:absolute;inset:0;border-radius:28px;background:#fff;border:3px solid #0f172a;
    box-shadow:0 10px 24px rgba(15,23,42,.2);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:22px;gap:6px;}
  .dice.rolling{animation:roll .5s ease-in-out;}
  @keyframes roll{0%{transform:rotate(0) scale(1);}50%{transform:rotate(360deg) scale(.9);}100%{transform:rotate(720deg) scale(1);}}
  .pip{background:#0f172a;border-radius:50%;}
  .pip.hide{visibility:hidden;}

  .throw-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:16px;}
  .tbtn{border:none;color:#fff;padding:14px 2px;border-radius:14px;font-size:13px;font-weight:900;cursor:pointer;line-height:1.2;transition:transform .12s, box-shadow .12s;box-shadow:0 4px 10px rgba(14,165,233,.22);}
  .tbtn:active{transform:translateY(1px);box-shadow:0 2px 5px rgba(14,165,233,.3);}
  .tbtn:disabled{opacity:.42;cursor:not-allowed;transform:none;}
  .tbtn .n{font-size:17px;font-weight:900;}
  .tbtn .l{font-size:10px;font-weight:700;opacity:.92;margin-top:1px;}
  .tb1{background:linear-gradient(135deg,#22d3ee,#06b6d4);} .tb5{background:linear-gradient(135deg,#60a5fa,#2563eb);} .tb10{background:linear-gradient(135deg,#34d399,#059669);} .tb20{background:linear-gradient(135deg,#a78bfa,#7c3aed);} .tb50{background:linear-gradient(135deg,#f472b6,#c026d3);}

  .log-line{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:#94a3b8;font-weight:800;letter-spacing:.3px;text-transform:uppercase;}
  .log-strip{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:#f8fafc;border-radius:12px;margin-top:6px;max-height:88px;overflow-y:auto;}
  .log-strip .r{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#e2e8f0;font-weight:800;color:#475569;font-size:11px;}
  .log-strip .r.hit{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;box-shadow:0 2px 5px rgba(245,158,11,.4);}

  /* 중 — 분수 패널 */
  .ratio-panel{justify-content:center;align-items:center;text-align:center;padding:30px 24px;}
  .ratio-title{font-size:12px;color:#64748b;font-weight:800;margin-bottom:28px;letter-spacing:.2px;line-height:1.5;}
  .frac{display:inline-block;}
  .frac .num,.frac .den{font-size:72px;font-weight:900;color:#0f172a;line-height:1;padding:8px 24px;letter-spacing:-2px;}
  .frac .bar{height:5px;background:linear-gradient(90deg,#06b6d4,#0ea5e9);border-radius:3px;}
  .frac .decimal{font-size:30px;color:#0891b2;font-weight:900;margin-top:24px;letter-spacing:-.5px;}
  .theo-chip{display:inline-block;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:800;margin-top:20px;}

  /* 우 — 그래프 패널 */
  .chart-wrap{flex:1;display:flex;flex-direction:column;}
  .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .chart-head .legend{font-size:11px;color:#64748b;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700;}
  .legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#06b6d4;margin-right:5px;vertical-align:middle;}
  .legend .dash{display:inline-block;width:20px;height:0;border-top:2.5px dashed #ef4444;margin-right:5px;vertical-align:middle;}
  .reset-btn{background:#fff1f2;color:#be123c;border:1.5px solid #fecdd3;padding:7px 14px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer;transition:.15s;}
  .reset-btn:hover{background:#fecdd3;}
  canvas{width:100%;height:290px;background:#fafafa;border-radius:16px;}

  .muted{color:#64748b;font-size:14px;text-align:center;padding:50px 14px;line-height:1.7;font-weight:700;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="78" rx="34" ry="26" fill="#1f2937"/>
        <circle cx="60" cy="46" r="26" fill="#111827"/>
        <path d="M82,46 L100,50 L82,56 Z" fill="#f59e0b"/>
        <circle cx="54" cy="44" r="8.5" fill="none" stroke="#f3f4f6" stroke-width="2"/>
        <circle cx="72" cy="44" r="8.5" fill="none" stroke="#f3f4f6" stroke-width="2"/>
        <circle cx="54" cy="44" r="6.5" fill="#f9fafb"/>
        <circle cx="72" cy="44" r="6.5" fill="#f9fafb"/>
        <circle cx="54" cy="44" r="2.6" fill="#111827"/>
        <circle cx="72" cy="44" r="2.6" fill="#111827"/>
      </svg>
    </div>
    <div class="tt">
      <h1 id="hdTitle">언제까지 ○○을 던지게 할거야</h1>
      <div class="sub">까마쌤 · 경우의 수와 확률 · <span id="evtName">—</span></div>
    </div>
  </header>

  <div id="main"><div class="panel"><div class="muted">불러오는 중…</div></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
  var USER=null, sb=null, SESSION=null;
  var trials=0, successes=0, history=[];
  var busy=false, uploadTimer=null;

  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1800); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function toolName(t){ return t==='dice'?'주사위':'동전'; }
  function evtLabel(s){
    if(!s) return '—';
    if(s.tool==='coin') return '앞면(까마귀)';
    return s.event_value + '의 눈';
  }
  function hdTitle(s){ return '언제까지 ' + (s.tool==='dice'?'주사위':'동전') + '을 던지게 할거야'; }

  LessonHub.init({ onReady: function(user){ USER=user; sb=LessonHub.client; findSession(); } });

  function findSession(){
    sb.from('prob_sessions').select('*').eq('class_scope', USER.className).eq('active', true)
      .order('created_at',{ascending:false}).limit(1)
      .then(function(r){
        var s=(r.data&&r.data[0])||null;
        if(!s){
          document.getElementById('main').innerHTML='<div class="panel"><div class="muted">아직 확률 체험이 열리지 않았어요.<br>선생님이 시작하면 바로 나타나요 🐦‍⬛</div></div>';
          subscribeSession(); return;
        }
        SESSION = s; trials=0; successes=0; history=[];
        render(); subscribeSession();
      });
  }

  function subscribeSession(){
    sb.channel('prob-sess-'+USER.className)
      .on('postgres_changes',{event:'*',schema:'public',table:'prob_sessions',filter:'class_scope=eq.'+USER.className},
        function(){ reloadSession(); }).subscribe();
  }
  function reloadSession(){
    sb.from('prob_sessions').select('*').eq('class_scope',USER.className).eq('active',true)
      .order('created_at',{ascending:false}).limit(1).then(function(r){
        var s=(r.data&&r.data[0])||null;
        if(!s){ SESSION=null; document.getElementById('main').innerHTML='<div class="panel"><div class="muted">확률 체험이 종료됐어요. 수고했어요 🐦‍⬛</div></div>'; return; }
        if(!SESSION || SESSION.id!==s.id || SESSION.tool!==s.tool || SESSION.event_value!==s.event_value){
          SESSION=s; trials=0; successes=0; history=[]; render();
        } else {
          SESSION=s; updateHeader();
        }
      });
  }

  function updateHeader(){
    document.getElementById('hdTitle').textContent = hdTitle(SESSION);
    document.getElementById('evtName').textContent = toolName(SESSION.tool) + ' · ' + evtLabel(SESSION);
  }

  function render(){
    updateHeader();
    var isCoin = SESSION.tool==='coin';
    var theoryStr = isCoin ? '½' : '⅙';
    var main = document.getElementById('main');
    main.innerHTML =
      '<div class="grid">'
      + '<div class="panel">'
        + '<div class="stage" id="stage">' + stageHtml(isCoin, null) + '</div>'
        + '<div class="throw-btns">'
          + '<button class="tbtn tb1" onclick="throwN(1)"><div class="n">1</div><div class="l">번</div></button>'
          + '<button class="tbtn tb5" onclick="throwN(5)"><div class="n">5</div><div class="l">번</div></button>'
          + '<button class="tbtn tb10" onclick="throwN(10)"><div class="n">10</div><div class="l">번</div></button>'
          + '<button class="tbtn tb20" onclick="throwN(20)"><div class="n">20</div><div class="l">번</div></button>'
          + '<button class="tbtn tb50" onclick="throwN(50)"><div class="n">50</div><div class="l">번</div></button>'
        + '</div>'
        + '<div class="log-line"><span>최근 결과</span><span id="totalBadge">총 0회</span></div>'
        + '<div class="log-strip" id="logStrip"></div>'
      + '</div>'
      + '<div class="panel ratio-panel">'
        + '<div class="ratio-title">' + (isCoin?'앞면':(SESSION.event_value+'의 눈')) + '이 나온 경우의 수<br>／ 던진 횟수</div>'
        + '<div class="frac"><div class="num" id="numN">0</div><div class="bar"></div><div class="den" id="denN">0</div></div>'
        + '<div class="decimal" id="decN">0.000</div>'
        + '<div class="theo-chip">이론 확률 ' + theoryStr + ' = ' + Number(SESSION.theory_p).toFixed(3) + '</div>'
      + '</div>'
      + '<div class="panel chart-wrap">'
        + '<div class="chart-head">'
          + '<div class="legend"><span><span class="dot"></span>실제 상대도수</span><span><span class="dash"></span>이론 ' + theoryStr + '</span></div>'
          + '<button class="reset-btn" onclick="resetLocal()">처음부터</button>'
        + '</div>'
        + '<canvas id="chart"></canvas>'
      + '</div>'
      + '</div>';
    drawChart();
    renderLog();
  }

  function stageHtml(isCoin, lastVal){
    if(isCoin){
      var isBack = lastVal === 0;
      return '<div class="coin-wrap"><div class="coin ' + (isBack?'coin-back':'') + '" id="actor">'
        + (isBack ? '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><text x="60" y="80" font-size="56" text-anchor="middle" font-weight="900" fill="#1e3a8a">뒷</text></svg>'
                 : '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">'
                   + '<circle cx="60" cy="46" r="24" fill="#111827"/>'
                   + '<ellipse cx="60" cy="78" rx="32" ry="22" fill="#1f2937"/>'
                   + '<path d="M80,46 L96,50 L80,54 Z" fill="#f59e0b"/>'
                   + '<circle cx="54" cy="44" r="7" fill="none" stroke="#f3f4f6" stroke-width="1.8"/>'
                   + '<circle cx="70" cy="44" r="7" fill="none" stroke="#f3f4f6" stroke-width="1.8"/>'
                   + '<circle cx="54" cy="44" r="5.2" fill="#f9fafb"/>'
                   + '<circle cx="70" cy="44" r="5.2" fill="#f9fafb"/>'
                   + '<circle cx="54" cy="44" r="2" fill="#111827"/>'
                   + '<circle cx="70" cy="44" r="2" fill="#111827"/>'
                   + '</svg>')
        + '</div></div>';
    }
    var v = (lastVal && lastVal>=1 && lastVal<=6) ? lastVal : 1;
    return '<div class="coin-wrap"><div class="dice" id="actor">' + pips(v) + '</div></div>';
  }

  function pips(v){
    var sets = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
    var on = sets[v] || [];
    var html='';
    for(var i=0;i<9;i++){ html += '<div class="pip ' + (on.indexOf(i)<0?'hide':'') + '"></div>'; }
    return html;
  }

  function throwN(n){
    if(busy || !SESSION) return;
    var isCoin = SESSION.tool==='coin';
    var evt = isCoin ? 1 : SESSION.event_value;
    var results=[]; var lastVal=null;
    for(var i=0;i<n;i++){
      var v = isCoin ? (Math.random()<0.5?1:0) : (1 + Math.floor(Math.random()*6));
      var hit = v===evt;
      results.push({v:v, hit:hit});
      trials++; if(hit) successes++;
      lastVal=v;
    }
    history = history.concat(results);
    if(history.length>1000) history = history.slice(-1000);
    disableBtns(true);
    var actor = document.getElementById('actor');
    if(actor && n<=5){
      actor.classList.add(isCoin?'flipping':'rolling');
      setTimeout(function(){
        updateStage(isCoin, lastVal);
        updateStats();
        disableBtns(false);
        scheduleUpload();
      }, 620);
    } else {
      updateStage(isCoin, lastVal);
      updateStats();
      setTimeout(function(){ disableBtns(false); }, 120);
      scheduleUpload();
    }
  }

  function updateStage(isCoin, lastVal){
    var stage = document.getElementById('stage');
    if(stage) stage.innerHTML = stageHtml(isCoin, lastVal);
  }

  function updateStats(){
    document.getElementById('numN').textContent = successes;
    document.getElementById('denN').textContent = trials;
    document.getElementById('decN').textContent = trials? (successes/trials).toFixed(3) : '0.000';
    document.getElementById('totalBadge').textContent = '총 ' + trials + '회';
    renderLog();
    drawChart();
  }

  function renderLog(){
    var strip = document.getElementById('logStrip'); if(!strip) return;
    var recent = history.slice(-40);
    strip.innerHTML = recent.map(function(r){
      var txt = SESSION.tool==='coin' ? (r.v===1?'앞':'뒷') : String(r.v);
      return '<span class="r ' + (r.hit?'hit':'') + '">' + txt + '</span>';
    }).join('');
    strip.scrollTop = strip.scrollHeight;
  }

  function disableBtns(on){
    busy = !!on;
    [].forEach.call(document.querySelectorAll('.tbtn'), function(b){ b.disabled = on; });
  }

  function resetLocal(){
    if(!SESSION) return;
    trials=0; successes=0; history=[];
    updateStats();
    scheduleUpload();
  }

  function scheduleUpload(){
    if(!SESSION) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(uploadNow, 900);
  }
  function uploadNow(){
    if(!SESSION || !USER || !USER.studentId) return;
    sb.from('prob_contributions').upsert({
      session_id: SESSION.id,
      student_id: USER.studentId,
      name: USER.name || '',
      trials: trials,
      successes: successes,
      updated_at: new Date().toISOString()
    }, { onConflict: 'session_id,student_id' }).then(function(r){
      if(r.error) console.warn('[prob upsert]', r.error.message);
    });
  }

  function drawChart(){
    var cv = document.getElementById('chart'); if(!cv || !SESSION) return;
    var dpr = window.devicePixelRatio || 1;
    var W = cv.clientWidth || 400, H = cv.clientHeight || 290;
    cv.width = W*dpr; cv.height = H*dpr;
    var ctx = cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);

    var padL = 42, padR = 16, padT = 14, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    ctx.font = '11px sans-serif'; ctx.fillStyle = '#94a3b8'; ctx.strokeStyle = '#eef2f7'; ctx.lineWidth = 1;
    for(var y=0;y<=4;y++){
      var yy = padT + plotH * (y/4);
      ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL+plotW, yy); ctx.stroke();
      ctx.fillText((1 - y/4).toFixed(2), 6, yy+4);
    }
    ctx.strokeStyle = '#cbd5e1'; ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT+plotH); ctx.lineTo(padL+plotW, padT+plotH); ctx.stroke();

    var maxX = Math.max(10, Math.pow(2, Math.ceil(Math.log2(Math.max(10, trials)))));
    if(trials > maxX) maxX = trials;

    ctx.fillStyle = '#94a3b8';
    for(var i=0;i<=5;i++){
      var xv = Math.round(maxX * i/5);
      var xx = padL + plotW * i/5;
      ctx.fillText(String(xv), xx - 6, padT+plotH+18);
    }

    var theoryY = padT + plotH * (1 - Number(SESSION.theory_p));
    ctx.strokeStyle = '#ef4444'; ctx.setLineDash([6,4]); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(padL, theoryY); ctx.lineTo(padL+plotW, theoryY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(SESSION.tool==='coin'?'½':'⅙', padL+6, theoryY-5);

    if(trials===0) return;

    ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 2.6;
    ctx.beginPath();
    var cum = 0;
    for(var k=0;k<history.length;k++){
      if(history[k].hit) cum++;
      var n = k+1;
      var r = cum/n;
      var px = padL + plotW * (n/maxX);
      var py = padT + plotH * (1 - r);
      if(k===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    var lastN = history.length;
    if(lastN>0){
      var lastR = successes/trials;
      var lx = padL + plotW * (lastN/maxX);
      var ly = padT + plotH * (1 - lastR);
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  window.addEventListener('resize', function(){ if(SESSION) drawChart(); });
</script>
</body>
</html>
