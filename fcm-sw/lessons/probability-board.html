<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확률 체험 — 칠판(교사 TV)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:#0f172a;min-height:100vh;
    background:linear-gradient(135deg,#5eead4 0%,#22d3ee 55%,#0ea5e9 100%);}

  /* 잠금 화면 */
  #lock{position:fixed;inset:0;background:linear-gradient(135deg,#5eead4 0%,#22d3ee 55%,#0ea5e9 100%);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
  #lock .box{background:#fff;padding:40px;border-radius:28px;width:360px;max-width:100%;text-align:center;box-shadow:0 20px 50px rgba(14,165,233,.3);}
  #lock .emoji{font-size:48px;margin-bottom:12px;}
  #lock h2{font-size:22px;margin-bottom:6px;color:#0f172a;font-weight:900;}
  #lock .desc{font-size:13px;color:#64748b;margin-bottom:22px;}
  #lock input{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:14px;background:#f8fafc;color:#0f172a;font-size:15px;margin-bottom:12px;}
  #lock input:focus{outline:none;border-color:#06b6d4;background:#fff;}
  #lock button{width:100%;padding:14px;background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(14,165,233,.3);}
  #lerr{color:#dc2626;font-size:13px;margin-top:10px;min-height:18px;font-weight:700;}

  /* 제어바 */
  .ctl{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid rgba(14,165,233,.15);position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(14,165,233,.08);}
  .ctl select,.ctl input{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;color:#0f172a;font-size:13px;font-weight:700;}
  .ctl label{font-size:12px;color:#64748b;font-weight:700;}
  .ctl button{padding:9px 14px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;background:#f1f5f9;color:#475569;transition:.15s;}
  .ctl button:hover{background:#e2e8f0;}
  .ctl button.primary{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;box-shadow:0 3px 8px rgba(14,165,233,.25);}
  .ctl button.primary:hover{box-shadow:0 5px 12px rgba(14,165,233,.35);}
  .ctl button.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;}
  .ctl button.yel{background:#fef3c7;color:#92400e;border:1px solid #fde68a;}
  .ctl .sp{flex:1;}
  .seg{display:inline-flex;background:#f1f5f9;border-radius:12px;padding:3px;}
  .seg button{background:transparent;color:#64748b;padding:6px 14px;font-weight:800;border-radius:9px;}
  .seg button.on{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;box-shadow:0 2px 6px rgba(14,165,233,.3);}
  .seg button.on:hover{background:linear-gradient(135deg,#22d3ee,#0891b2);}

  /* 본문 */
  .wrap{padding:3vh 3vw;color:#fff;}
  .top{display:flex;align-items:baseline;gap:20px;margin-bottom:2.5vh;flex-wrap:wrap;}
  .title{font-size:3vw;font-weight:900;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 10px rgba(0,0,0,.15);}
  .tag{background:rgba(255,255,255,.22);backdrop-filter:blur(10px);color:#fff;font-size:1.1vw;font-weight:800;padding:6px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);}

  .grid{display:grid;grid-template-columns:1.1fr 1.6fr .9fr;gap:1.6vw;align-items:stretch;}
  @media (max-width:1100px){ .grid{grid-template-columns:1fr;} }
  .panel{background:#fff;border-radius:24px;padding:2.4vh 2vw;display:flex;flex-direction:column;box-shadow:0 14px 32px rgba(15,23,42,.14), 0 3px 8px rgba(15,23,42,.06);color:#0f172a;}

  /* 중앙 — 큰 분수 */
  .ratio-panel{justify-content:center;align-items:center;text-align:center;}
  .ratio-title{font-size:1.1vw;color:#64748b;font-weight:800;margin-bottom:2.5vh;line-height:1.5;}
  .frac .num,.frac .den{font-size:7vw;font-weight:900;color:#0f172a;line-height:1;padding:.6vh 2vw;letter-spacing:-3px;}
  .frac .bar{height:7px;background:linear-gradient(90deg,#06b6d4,#0ea5e9);border-radius:4px;}
  .frac .decimal{font-size:3.2vw;color:#0891b2;font-weight:900;margin-top:2vh;letter-spacing:-1px;}
  .theo{display:inline-block;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;padding:7px 18px;border-radius:999px;font-size:1vw;font-weight:800;margin-top:2vh;}

  /* 좌 — 그래프 */
  .chart-box{flex:1;display:flex;flex-direction:column;}
  .chart-head{font-size:1vw;color:#64748b;margin-bottom:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-weight:700;}
  .chart-head .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#06b6d4;margin-right:6px;vertical-align:middle;}
  .chart-head .dash{display:inline-block;width:22px;height:0;border-top:3px dashed #ef4444;margin-right:6px;vertical-align:middle;}
  canvas{width:100%;height:46vh;background:#fafafa;border-radius:16px;}

  /* 우 — 학생 표 */
  .list-head{font-size:1vw;font-weight:900;color:#0891b2;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .list{flex:1;overflow-y:auto;max-height:52vh;}
  .srow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#f8fafc;margin-bottom:6px;font-size:.95vw;transition:.15s;}
  .srow.top1{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #f59e0b;}
  .srow .nm{color:#0f172a;font-weight:800;}
  .srow .tr{color:#2563eb;font-weight:800;}
  .srow .sc{color:#b45309;font-weight:900;}

  .empty{color:rgba(255,255,255,.95);font-size:1.4vw;text-align:center;padding:12vh 0;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.1);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:800;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .toast.show{opacity:1;}
  body.present .ctl{display:none !important;}
</style>
</head>
<body>
  <div id="lock"><div class="box"><div class="emoji">🐦‍⬛</div><h2>확률 체험 칠판</h2><div class="desc">교사 비밀번호를 입력하세요</div>
    <input type="password" id="lpw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doUnlock()">
    <button id="lbtn" onclick="doUnlock()">확인</button><div id="lerr"></div></div></div>

  <div class="ctl" id="ctl" style="display:none;">
    <select id="clsSel"></select>
    <label>도구</label>
    <span class="seg">
      <button id="toolCoin" class="on" onclick="setTool('coin')">동전</button>
      <button id="toolDice" onclick="setTool('dice')">주사위</button>
    </span>
    <span id="diceEvtWrap" style="display:none;align-items:center;gap:8px;">
      <label>사건(눈)</label>
      <select id="diceEvt"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
    </span>
    <button class="primary" onclick="openSession()">세션 열기</button>
    <span class="sp"></span>
    <button class="yel" onclick="applySettings()">사건 변경·적용</button>
    <button class="yel" onclick="resetContribs()">기록 리셋</button>
    <button onclick="togglePresent()">🖥️ 전시</button>
    <button class="warn" onclick="closeSession()">닫기</button>
  </div>

  <div class="wrap" id="wrap"><div class="empty">반·도구·사건을 고르고 "세션 열기"를 누르세요.</div></div>
  <div class="toast" id="toast"></div>

<script>
  var PORTAL='https://script.google.com/macros/s/AKfycbw8M03W7ECbqUzCPJkPb1YGrEo3SRORTDaxoTMLz5yoUw8pTLpIPAIH1qpfgJY80J9v/exec';
  var SB_URL='https://lqjrrqhrnxctyrqccmch.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxanJycWhybnhjdHlycWNjbWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MDcwNzUsImV4cCI6MjA5OTk4MzA3NX0.7j44nTdC4CGSFm-1PTECdWNEHUnBb4SvhrcLfY8M4_Q';
  var sb=supabase.createClient(SB_URL,SB_KEY);
  var TOK=localStorage.getItem('lesson_ptok')||localStorage.getItem('prob_ptok')||'';
  var SESSION=null, CTRIBS=[], TOOL='coin', pollTimer=null, sCh=null, cCh=null;
  var seriesX=[], seriesY=[];

  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1800); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function portalRPC(fn,args){ return fetch(PORTAL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(d){ if(d&&d.ok) return d.result; throw new Error((d&&d.error)||'서버 오류'); }); }

  function doUnlock(){
    var pw=document.getElementById('lpw').value, b=document.getElementById('lbtn');
    if(!pw) return; b.disabled=true; b.textContent='확인 중…';
    portalRPC('teacherLogin',[pw]).then(function(res){
      b.disabled=false; b.textContent='확인';
      if(res&&res.success&&res.token){ TOK=res.token; localStorage.setItem('prob_ptok',TOK); localStorage.setItem('lesson_ptok',TOK); document.getElementById('lock').style.display='none'; document.getElementById('ctl').style.display='flex'; initCtl(); }
      else document.getElementById('lerr').textContent=(res&&res.message)||'비밀번호 오류';
    }).catch(function(e){ b.disabled=false; b.textContent='확인'; document.getElementById('lerr').textContent='오류: '+e.message; });
  }
  if(TOK){ document.getElementById('lock').style.display='none'; document.getElementById('ctl').style.display='flex'; initCtl(); }

  function relock(msg){ TOK=''; localStorage.removeItem('prob_ptok'); localStorage.removeItem('lesson_ptok'); document.getElementById('ctl').style.display='none'; document.getElementById('lock').style.display='flex'; if(msg) document.getElementById('lerr').textContent=msg; }

  function setTool(t){
    TOOL = t;
    document.getElementById('toolCoin').classList.toggle('on', t==='coin');
    document.getElementById('toolDice').classList.toggle('on', t==='dice');
    document.getElementById('diceEvtWrap').style.display = t==='dice' ? 'inline-flex' : 'none';
  }

  function initCtl(){
    var sel=document.getElementById('clsSel');
    portalRPC('graphClasses',[TOK]).then(function(res){
      if(res&&res.success===false){ relock(res.message||'로그인이 만료됐어요. 다시 로그인해주세요.'); return; }
      var cls=(res&&res.classes)||[];
      if(!cls.length){ sel.innerHTML='<option value="">반 정보 없음</option>'; toast('등록된 학생이 없어요.'); return; }
      sel.innerHTML=cls.map(function(c){return '<option>'+esc(c)+'</option>';}).join('');
      loadActive(cls[0]);
    }).catch(function(e){ sel.innerHTML='<option value="">불러오기 실패</option>'; toast('반 불러오기 오류: '+e.message); });
    document.getElementById('clsSel').addEventListener('change',function(){ loadActive(this.value); });
  }

  function loadActive(cls){
    sb.from('prob_sessions').select('*').eq('class_scope',cls).eq('active',true).order('created_at',{ascending:false}).limit(1)
      .then(function(r){
        SESSION=(r.data&&r.data[0])||null; CTRIBS=[]; seriesX=[]; seriesY=[];
        if(SESSION){
          setTool(SESSION.tool);
          if(SESSION.tool==='dice') document.getElementById('diceEvt').value = String(SESSION.event_value);
          subscribe(); loadContribs(); startPoll();
        } else {
          stopPoll(); if(sCh){sb.removeChannel(sCh);sCh=null;} if(cCh){sb.removeChannel(cCh);cCh=null;}
          render();
        }
      });
  }

  function openSession(){
    var cls=document.getElementById('clsSel').value;
    var ev = TOOL==='dice' ? parseInt(document.getElementById('diceEvt').value)||1 : 1;
    portalRPC('probabilityOpen',[TOK,{class_scope:cls, tool:TOOL, event_value:ev}]).then(function(res){
      if(res&&res.success){ toast('세션을 열었어요'); loadActive(cls); }
      else toast('실패: '+((res&&res.message)||''));
    }).catch(function(e){ toast('오류: '+e.message); });
  }
  function applySettings(){
    if(!SESSION){ toast('먼저 세션을 여세요'); return; }
    var ev = TOOL==='dice' ? parseInt(document.getElementById('diceEvt').value)||1 : 1;
    if(!confirm('사건을 바꾸면 지금까지의 반 기록이 모두 지워집니다. 계속할까요?')) return;
    portalRPC('probabilitySettings',[TOK, SESSION.id, TOOL, ev, true]).then(function(res){
      if(res&&res.success){ toast('사건을 바꿨어요'); loadActive(document.getElementById('clsSel').value); }
      else toast('실패: '+((res&&res.message)||''));
    }).catch(function(e){ toast('오류: '+e.message); });
  }
  function resetContribs(){
    if(!SESSION){ toast('먼저 세션을 여세요'); return; }
    if(!confirm('이번 세션의 반 기록을 모두 지웁니다. 계속할까요?')) return;
    portalRPC('probabilityResetContribs',[TOK, SESSION.id]).then(function(res){
      if(res&&res.success){ toast('기록을 리셋했어요'); CTRIBS=[]; seriesX=[]; seriesY=[]; render(); }
      else toast('실패: '+((res&&res.message)||''));
    }).catch(function(e){ toast('오류: '+e.message); });
  }
  function closeSession(){
    if(!SESSION){ toast('세션이 없어요'); return; }
    if(!confirm('세션을 닫을까요?')) return;
    portalRPC('probabilityClose',[TOK, SESSION.id]).then(function(res){
      if(res&&res.success){ toast('세션을 닫았어요'); SESSION=null; render(); stopPoll(); }
      else toast('실패: '+((res&&res.message)||''));
    }).catch(function(e){ toast('오류: '+e.message); });
  }

  function subscribe(){
    if(sCh){sb.removeChannel(sCh);sCh=null;}
    if(cCh){sb.removeChannel(cCh);cCh=null;}
    sCh = sb.channel('prob-sess-tv-'+SESSION.class_scope)
      .on('postgres_changes',{event:'*',schema:'public',table:'prob_sessions',filter:'class_scope=eq.'+SESSION.class_scope},
        function(){ loadActive(SESSION.class_scope); }).subscribe();
    cCh = sb.channel('prob-c-'+SESSION.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'prob_contributions',filter:'session_id=eq.'+SESSION.id},
        function(){ loadContribs(); }).subscribe();
  }

  function startPoll(){ stopPoll(); pollTimer = setInterval(loadContribs, 5000); }
  function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

  function loadContribs(){
    if(!SESSION) return;
    sb.from('prob_contributions').select('student_id,name,trials,successes,updated_at').eq('session_id', SESSION.id).then(function(r){
      if(r.error) return;
      CTRIBS = r.data||[];
      var sum = CTRIBS.reduce(function(a,c){ return {t:a.t+(c.trials||0), s:a.s+(c.successes||0)}; }, {t:0,s:0});
      if(sum.t>0){
        var lastX = seriesX[seriesX.length-1] || 0;
        if(sum.t > lastX){
          // 정상 — 단조증가일 때만 push
          seriesX.push(sum.t); seriesY.push(sum.s/sum.t);
          if(seriesX.length>60){ seriesX.shift(); seriesY.shift(); }
        } else if(sum.t < lastX){
          // 학생이 reset을 눌렀거나 교사가 리셋 — 시리즈 초기화
          seriesX = [sum.t]; seriesY = [sum.s/sum.t];
        }
        // sum.t === lastX이면 변화 없음 → skip (중복 push 방지)
      } else {
        seriesX = []; seriesY = [];
      }
      render();
    });
  }

  function render(){
    if(!SESSION){
      document.getElementById('wrap').innerHTML='<div class="empty">반·도구·사건을 고르고 "세션 열기"를 누르세요.</div>';
      return;
    }
    var isCoin = SESSION.tool==='coin';
    var theoryStr = isCoin ? '½' : '⅙';
    var evLabel = isCoin ? '앞면(까마귀)' : (SESSION.event_value + '의 눈');
    var sum = CTRIBS.reduce(function(a,c){ return {t:a.t+(c.trials||0), s:a.s+(c.successes||0)}; }, {t:0,s:0});
    var pct = sum.t ? (sum.s/sum.t) : 0;

    var sorted = CTRIBS.slice().sort(function(a,b){ return (b.trials||0) - (a.trials||0); });
    var studentsHtml = sorted.map(function(c, i){
      var p = c.trials ? (c.successes/c.trials) : 0;
      return '<div class="srow ' + (i===0&&c.trials?'top1':'') + '"><span class="nm">' + esc(c.name||c.student_id) + '</span>'
        + '<span class="tr">' + c.trials + '회</span>'
        + '<span class="sc">' + p.toFixed(3) + '</span></div>';
    }).join('') || '<div style="color:#94a3b8;padding:24px 10px;text-align:center;font-weight:700;">학생이 아직 던지지 않았어요</div>';

    document.getElementById('wrap').innerHTML =
      '<div class="top"><div class="title">🐦‍⬛ 언제까지 ' + (isCoin?'동전':'주사위') + '을 던지게 할거야</div>'
      + '<span class="tag">' + esc(SESSION.class_scope) + ' · ' + esc(evLabel) + '</span></div>'
      + '<div class="grid">'
        + '<div class="panel chart-box">'
          + '<div class="chart-head"><span><span class="dot"></span>우리 반 합계 상대도수</span><span><span class="dash"></span>이론 ' + theoryStr + '</span></div>'
          + '<canvas id="tvChart"></canvas>'
        + '</div>'
        + '<div class="panel ratio-panel">'
          + '<div class="ratio-title">반 전체 — ' + esc(evLabel) + '이 나온 경우의 수<br>／ 던진 횟수</div>'
          + '<div class="frac"><div class="num">' + sum.s + '</div><div class="bar"></div><div class="den">' + sum.t + '</div></div>'
          + '<div class="decimal">' + pct.toFixed(3) + '</div>'
          + '<div class="theo">이론 확률 ' + theoryStr + ' = ' + Number(SESSION.theory_p).toFixed(3) + '</div>'
        + '</div>'
        + '<div class="panel">'
          + '<div class="list-head"><span>👥 참여 학생</span><span>' + CTRIBS.length + '명</span></div>'
          + '<div class="list">' + studentsHtml + '</div>'
        + '</div>'
      + '</div>';

    drawTvChart();
  }

  function drawTvChart(){
    var cv = document.getElementById('tvChart'); if(!cv || !SESSION) return;
    var dpr = window.devicePixelRatio || 1;
    var W = cv.clientWidth || 600, H = cv.clientHeight || 400;
    cv.width = W*dpr; cv.height = H*dpr;
    var ctx = cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);

    var padL = 60, padR = 20, padT = 16, padB = 32;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var theory = Number(SESSION.theory_p);
    var N = seriesX.length;
    var lastN = seriesX[N-1] || 0;

    // y 범위 자동 (이론값 중심, lastN 커질수록 좁아짐)
    var yMin, yMax;
    if(lastN < 30 || N === 0){ yMin = 0; yMax = 1; }
    else {
      var baseMargin = lastN<200?0.35 : lastN<1000?0.22 : lastN<5000?0.12 : lastN<20000?0.07 : 0.04;
      // 후반 60%의 min/max로 margin 보강
      var startK = Math.floor(N * 0.3);
      var dmin = theory, dmax = theory;
      for(var i=startK;i<N;i++){ if(seriesY[i]<dmin) dmin=seriesY[i]; if(seriesY[i]>dmax) dmax=seriesY[i]; }
      var devMax = Math.max(theory - dmin, dmax - theory, 0);
      var margin = Math.max(baseMargin, devMax + 0.018);
      yMin = Math.max(0, theory - margin);
      yMax = Math.min(1, theory + margin);
    }
    var yR = yMax - yMin;
    function Y(v){ return padT + plotH * (1 - (v - yMin) / yR); }

    // x 로그 스케일
    var xMaxN = Math.max(10, lastN);
    var lmax = Math.max(1, Math.log10(xMaxN));
    function X(nn){ return padL + plotW * (Math.log10(Math.max(1,nn))) / lmax; }

    // y 격자·라벨
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#94a3b8'; ctx.strokeStyle = '#eef2f7'; ctx.lineWidth = 1;
    for(var y=0;y<=4;y++){
      var yv = yMax - yR * y/4;
      var yy = padT + plotH * y/4;
      ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL+plotW, yy); ctx.stroke();
      ctx.fillText(yv.toFixed(2), 10, yy+5);
    }

    // x 눈금 (로그 10의 거듭제곱)
    ctx.fillStyle = '#94a3b8'; ctx.strokeStyle = '#f1f5f9';
    var pow = 1;
    while(pow <= xMaxN){
      var xx = X(pow);
      if(xx >= padL && xx <= padL+plotW+1){
        ctx.beginPath(); ctx.moveTo(xx, padT); ctx.lineTo(xx, padT+plotH); ctx.stroke();
        var lbl = pow>=1000 ? (pow/1000).toFixed(pow%1000?1:0)+'k' : String(pow);
        ctx.fillText(lbl, xx - (lbl.length*3.5), padT+plotH+22);
      }
      pow *= 10;
    }

    // 축선
    ctx.strokeStyle = '#cbd5e1'; ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT+plotH); ctx.lineTo(padL+plotW, padT+plotH); ctx.stroke();

    // 이론 기준선
    if(theory >= yMin && theory <= yMax){
      var ty = Y(theory);
      ctx.strokeStyle = '#ef4444'; ctx.setLineDash([9,5]); ctx.lineWidth = 2.3;
      ctx.beginPath(); ctx.moveTo(padL, ty); ctx.lineTo(padL+plotW, ty); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ef4444'; ctx.font = 'bold 15px sans-serif';
      ctx.fillText(SESSION.tool==='coin'?'½':'⅙', padL+8, ty-7);
    }

    if(N===0) return;

    ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 3;
    ctx.beginPath();
    for(var k=0;k<N;k++){
      var px = X(seriesX[k]);
      var py = Math.max(padT, Math.min(padT+plotH, Y(seriesY[k])));
      if(k===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    var lx = X(seriesX[N-1]);
    var ly = Math.max(padT, Math.min(padT+plotH, Y(seriesY[N-1])));
    ctx.fillStyle = '#06b6d4';
    ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  }

  function togglePresent(){
    document.body.classList.toggle('present');
    if(document.body.classList.contains('present')){
      var h=document.createElement('div');
      h.id='exitP';
      h.style.cssText='position:fixed;top:12px;right:12px;z-index:900;background:rgba(15,23,42,.72);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;';
      h.textContent='✕ 제어 보기'; h.onclick=togglePresent;
      document.body.appendChild(h);
    } else {
      var e=document.getElementById('exitP'); if(e) e.remove();
    }
    if(SESSION) drawTvChart();
  }

  window.addEventListener('resize', function(){ if(SESSION) drawTvChart(); });
</script>
