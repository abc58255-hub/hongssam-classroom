<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>그래프 탐구 — 교사</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./graph-plot.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }
  body { font-family:-apple-system,'Apple SD Gothic Neo',sans-serif; background:#fffdf7; color:#3b2f1e; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:12px; padding:12px 18px; background:#7a5230; color:#fff8ec; flex-shrink:0; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .top h1 { font-size:18px; font-weight:900; }
  .top .eq { font-size:22px; font-weight:900; color:#ffe6b3; }
  .top .sp { margin-left:auto; }
  .top button { background:#fff3dc; color:#7a5230; border:none; border-radius:9px; padding:8px 13px; font-size:13px; font-weight:800; cursor:pointer; margin-left:6px; }
  .top button.warn { background:#fecaca; color:#991b1b; }
  .top button.on { background:#fbbf24; color:#3b2f1e; }

  /* 설정 화면 */
  #setup { flex:1; overflow-y:auto; padding:24px; display:flex; justify-content:center; }
  .panel { width:100%; max-width:560px; }
  .card { background:#fff; border:1px solid #f0e6d2; border-radius:16px; padding:20px 22px; margin-bottom:16px; box-shadow:0 4px 14px rgba(122,82,48,.06); }
  .card h3 { font-size:14px; font-weight:900; color:#7a5230; margin-bottom:12px; }
  .presets { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .presets button { background:#fff3dc; color:#7a5230; border:1px solid #eaddc2; border-radius:20px; padding:7px 13px; font-size:13px; font-weight:800; cursor:pointer; }
  .abc { display:flex; align-items:center; gap:10px; justify-content:center; font-size:22px; font-weight:800; flex-wrap:wrap; }
  .abc input { width:76px; padding:12px; border:1.5px solid #eaddc2; border-radius:12px; font-size:22px; text-align:center; font-weight:900; background:#fffdf7; }
  .abc input:focus { outline:none; border-color:#d97706; }
  .hint { font-size:12px; color:#a68a63; margin-top:10px; text-align:center; }
  .prevbox { margin-top:14px; background:#fff8ec; border:1px dashed #eaddc2; border-radius:12px; padding:10px 12px; }
  .prevlab { font-size:11px; font-weight:800; color:#a68a63; margin-bottom:4px; }
  .disp { width:100%; padding:11px; border:1.5px solid #eaddc2; border-radius:10px; font-size:18px; font-weight:900; text-align:center; color:#7a5230; background:#fff; }
  .quicklab { font-size:11px; font-weight:800; color:#a68a63; margin:14px 0 6px; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .row label { font-size:14px; font-weight:700; }
  .seg { display:flex; gap:6px; }
  .seg button { background:#fff3dc; color:#7a5230; border:1px solid #eaddc2; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:800; cursor:pointer; }
  .seg button.on { background:#7a5230; color:#fff; border-color:#7a5230; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; cursor:pointer; }
  .chk input { width:18px; height:18px; }
  .start { width:100%; padding:16px; background:linear-gradient(135deg,#f59e0b,#d97706); color:white; border:none; border-radius:14px; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 8px 22px rgba(217,119,6,.35); }
  /* 진행 중 방 배너 */
  .abrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#fff7ed; border:1.5px solid #fdba74; border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .abinfo { flex:1; min-width:0; font-size:14px; font-weight:800; color:#9a3412; }
  .abbtns { display:flex; gap:6px; }
  .abbtns button { border:none; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; background:#d97706; color:#fff; }
  .abbtns button.warn { background:#fecaca; color:#991b1b; }
  .field { display:flex; align-items:center; gap:8px; }
  select { padding:9px 11px; border:1.5px solid #eaddc2; border-radius:10px; font-size:15px; font-weight:800; background:#fff; }

  /* 라이브 화면 */
  #live { flex:1; display:none; padding:16px; gap:16px; overflow:hidden; }
  #plotBox { flex:1; display:flex; align-items:center; justify-content:center; min-width:0; }
  #cvWrap { position:relative; width:100%; max-width:min(78vh, 760px); aspect-ratio:1/1; background:#fffdf7; border:1px solid #f0e6d2; border-radius:16px; box-shadow:0 6px 20px rgba(122,82,48,.1); overflow:hidden; }
  #cv { width:100%; height:100%; display:block; }
  .range { position:absolute; right:12px; top:12px; display:flex; gap:6px; }
  .range button { background:rgba(255,255,255,.92); color:#7a5230; border:1px solid #eaddc2; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:800; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  /* 리더보드 사이드 */
  #side { width:320px; flex-shrink:0; display:flex; flex-direction:column; background:#fff; border:1px solid #f0e6d2; border-radius:16px; padding:14px 16px; overflow:hidden; box-shadow:0 4px 14px rgba(122,82,48,.06); }
  .sideHead { display:flex; gap:14px; font-size:15px; font-weight:800; color:#7a5230; padding-bottom:10px; border-bottom:1px solid #f0e6d2; margin-bottom:6px; }
  #board { flex:1; overflow-y:auto; }
  .brow { display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid #f6efe0; font-size:14px; }
  .brank { width:26px; text-align:center; font-weight:900; color:#a68a63; font-size:15px; }
  .bname { flex:1; font-weight:800; color:#3b2f1e; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bok { color:#16a34a; font-weight:900; }
  .bno { color:#c4b5a0; font-weight:700; font-size:12px; }
  .bempty { text-align:center; color:#c4b5a0; padding:34px 0; font-size:13px; font-weight:700; }
  @media (max-width:720px){ #live{ flex-direction:column; } #side{ width:auto; max-height:38%; } }

  /* 잠금 */
  #lock { position:fixed; inset:0; background:radial-gradient(circle at 30% 20%,#8a6034,#3b2a17 70%); display:flex; align-items:center; justify-content:center; z-index:100; }
  .lc { background:#fff; padding:36px 30px; border-radius:22px; width:320px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,.4); }
  .lc .ico { font-size:44px; margin-bottom:8px; }
  .lc h2 { font-size:20px; margin-bottom:6px; font-weight:900; color:#7a5230; }
  .lc p { color:#a68a63; font-size:13px; margin-bottom:18px; }
  .lc input { width:100%; padding:13px; border:2px solid #eaddc2; border-radius:12px; font-size:15px; margin-bottom:12px; }
  .lc button { width:100%; padding:13px; background:#7a5230; color:white; border:none; border-radius:12px; font-size:15px; font-weight:900; cursor:pointer; }
  .lc .err { color:#dc2626; font-size:13px; margin-top:8px; min-height:18px; font-weight:700; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#3b2f1e; color:#fff; padding:12px 22px; border-radius:30px; font-size:14px; font-weight:800; z-index:200; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="top">
  <h1>📐 그래프 탐구</h1>
  <span class="eq" id="topEq"></span>
  <span class="sp"></span>
  <span id="liveBtns" style="display:none;">
    <button id="nameBtn" onclick="toggleNames()">🏷 이름</button>
    <button id="revealBtn" onclick="toggleReveal()">✨ 개형 공개</button>
    <button onclick="clearPoints()">🧹 점 지우기</button>
    <button class="warn" onclick="closeRoom()">■ 종료</button>
  </span>
</div>

<!-- 설정 -->
<div id="setup"><div class="panel">
  <div id="activeBanner"></div>
  <div class="card">
    <h3>1. 반 선택</h3>
    <div class="field">
      <select id="classSel" style="min-width:160px;"><option value="">불러오는 중…</option></select>
    </div>
    <div class="hint" style="text-align:left;" id="classHint"></div>
  </div>
  <div class="card">
    <h3>2. 직선 입력 (ax + by = c)</h3>
    <div class="abc">
      <input type="number" id="ca" value="1" oninput="onABC()"> x <span style="color:#a68a63;">+</span>
      <input type="number" id="cb" value="0" oninput="onABC()"> y <span style="color:#a68a63;">=</span>
      <input type="number" id="cc" value="2" oninput="onABC()">
    </div>
    <div class="hint">세로선은 b=0, 가로선은 a=0 · 계수는 분수 대신 정수로</div>
    <div class="prevbox">
      <div class="prevlab">학생에게 보일 식</div>
      <input class="disp" id="disp" value="x = 2">
    </div>
    <div class="quicklab">빠른 예시</div>
    <div class="presets" id="presets"></div>
  </div>
  <div class="card">
    <h3>3. 설정</h3>
    <div class="row"><label>학생당 점 개수</label>
      <div class="seg" id="mpSeg">
        <button data-v="1" onclick="setMp(1)">1</button>
        <button data-v="3" class="on" onclick="setMp(3)">3</button>
        <button data-v="5" onclick="setMp(5)">5</button>
        <button data-v="0" onclick="setMp(0)">무제한</button>
      </div>
      <input type="number" id="mpCustom" min="0" placeholder="직접" oninput="setMp(parseInt(this.value)||0, true)" style="width:70px;padding:7px;border:1.5px solid #eaddc2;border-radius:8px;font-size:14px;text-align:center;font-weight:800;">
    </div>
    <label class="chk"><input type="checkbox" id="showWrong" checked> 틀린 점도 표시 (회색)</label>
    <label class="chk" style="margin-top:8px;"><input type="checkbox" id="showNames"> 점에 학생 이름 표시</label>
    <label class="chk" style="margin-top:8px;"><input type="checkbox" id="intOnly"> 정수만 입력 허용</label>
    <label class="chk" style="margin-top:8px;"><input type="checkbox" id="hideEq"> 함수식 숨기기 (학생 화면에 식 미표시)</label>
  </div>
  <button class="start" onclick="startRoom()">🚀 방 시작하기</button>
</div></div>

<!-- 라이브 -->
<div id="live">
  <div id="plotBox">
    <div id="cvWrap">
      <canvas id="cv"></canvas>
      <div class="range">
        <button onclick="plot.zoomBy(1.25)">＋</button>
        <button onclick="plot.zoomBy(0.8)">－</button>
        <button onclick="plot.fit()">✥ 맞춤</button>
        <button onclick="plot.resetView()">↺ 기본</button>
      </div>
    </div>
  </div>
  <div id="side">
    <div class="sideHead">
      <span>👥 <b id="hCount">0</b>명</span>
      <span>📍 <b id="hPoints">0</b></span>
      <span style="color:#16a34a;">✅ <b id="hCorrect">0</b></span>
    </div>
    <div id="board"><div class="bempty">아직 제출이 없어요</div></div>
  </div>
</div>

<!-- 잠금 -->
<div id="lock">
  <div class="lc">
    <div class="ico">🔒</div>
    <h2>그래프 탐구</h2>
    <p>교사 비밀번호를 입력하세요.</p>
    <input type="password" id="lpw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doUnlock()">
    <button id="lbtn" onclick="doUnlock()">확인</button>
    <div class="err" id="lerr"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  var PORTAL='https://script.google.com/macros/s/AKfycbw8M03W7ECbqUzCPJkPb1YGrEo3SRORTDaxoTMLz5yoUw8pTLpIPAIH1qpfgJY80J9v/exec';
  var SB_URL='https://lqjrrqhrnxctyrqccmch.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxanJycWhybnhjdHlycWNjbWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MDcwNzUsImV4cCI6MjA5OTk4MzA3NX0.7j44nTdC4CGSFm-1PTECdWNEHUnBb4SvhrcLfY8M4_Q';
  var sb = supabase.createClient(SB_URL, SB_KEY);
  var TOK = localStorage.getItem('graph_ptok') || '';
  var ROOM = null;      // { id, a,b,c, display, revealed, show_wrong }
  var POINTS = [];      // [{x,y,correct,name}]
  var ch = null;

  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1600); }
  function portalRPC(fn, args){
    return fetch(PORTAL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
      .then(function(r){return r.json();}).then(function(d){ if(d&&d.ok) return d.result; throw new Error((d&&d.error)||'서버 오류'); });
  }

  // ── 인증 ──
  function doUnlock(){
    var pw=document.getElementById('lpw').value, b=document.getElementById('lbtn');
    if(!pw) return; b.disabled=true; b.textContent='확인 중…';
    portalRPC('teacherLogin',[pw]).then(function(res){
      b.disabled=false; b.textContent='확인';
      if(res&&res.success&&res.token){ TOK=res.token; localStorage.setItem('graph_ptok',TOK); document.getElementById('lock').style.display='none'; initSetup(); }
      else document.getElementById('lerr').textContent=(res&&res.message)||'비밀번호 오류';
    }).catch(function(e){ b.disabled=false; b.textContent='확인'; document.getElementById('lerr').textContent='오류: '+e.message; });
  }

  // ── 설정 화면 ──
  var PRESETS=[
    {t:'정비례 y=2x', a:2,b:-1,c:0, d:'y = 2x'},
    {t:'일차 y=2x+1', a:2,b:-1,c:-1, d:'y = 2x + 1'},
    {t:'x = 3', a:1,b:0,c:3, d:'x = 3'},
    {t:'y = -2', a:0,b:1,c:-2, d:'y = -2'},
    {t:'2x+3y=6', a:2,b:3,c:6, d:'2x + 3y = 6'},
    {t:'x+y=4', a:1,b:1,c:4, d:'x + y = 4'}
  ];
  function initSetup(){
    document.getElementById('presets').innerHTML=PRESETS.map(function(p,i){return '<button onclick="applyPreset('+i+')">'+p.t+'</button>';}).join('');
    onABC(); loadClasses(); loadActiveRooms();
  }
  // B. 진행 중(안 닫힌) 방 배너 — 이어서 열기 / 종료
  var activeRooms=[];
  function loadActiveRooms(){
    var box=document.getElementById('activeBanner'); if(!box) return;
    sb.from('graph_rooms').select('*').eq('active',true).order('created_at',{ascending:false}).then(function(r){
      activeRooms=r.data||[];
      if(!activeRooms.length){ box.innerHTML=''; return; }
      box.innerHTML=activeRooms.map(function(rm){
        return '<div class="abrow"><div class="abinfo">🔴 진행 중 · '+esc(rm.class_scope)+' · '+esc(rm.display)+'</div>'
          +'<div class="abbtns"><button onclick="resumeRoom('+rm.id+')">이어서 열기</button>'
          +'<button class="warn" onclick="closeRoomById('+rm.id+')">종료</button></div></div>';
      }).join('');
    });
  }
  function resumeRoom(id){
    var rm=activeRooms.filter(function(x){return x.id===id;})[0]; if(!rm) return;
    ROOM={ id:rm.id, a:Number(rm.a), b:Number(rm.b), c:Number(rm.c), display:rm.display, kind:rm.kind||'line', revealed:!!rm.revealed, show_wrong:rm.show_wrong!==false, show_names:!!rm.show_names };
    enterLive();
  }
  function closeRoomById(id){
    if(!confirm('이 방을 종료할까요?\n(학생 화면에서 사라져요)')) return;
    portalRPC('graphClose',[TOK,id]).then(function(){ toast('방을 종료했어요'); loadActiveRooms(); }).catch(function(e){ toast('오류: '+e.message); });
  }
  function loadClasses(){
    var sel=document.getElementById('classSel'), hint=document.getElementById('classHint');
    portalRPC('graphClasses',[TOK]).then(function(res){
      if(!res||!res.success||!res.classes||!res.classes.length){
        sel.innerHTML='<option value="">반 정보 없음</option>'; hint.textContent='등록된 학생이 없어요. 학생 명단을 먼저 등록해주세요.'; return;
      }
      sel.innerHTML=res.classes.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
      hint.textContent='학생 명단이 있는 반만 표시돼요.';
    }).catch(function(e){ sel.innerHTML='<option value="">불러오기 실패</option>'; hint.textContent='오류: '+e.message; });
  }
  function applyPreset(i){ var p=PRESETS[i]; document.getElementById('ca').value=p.a; document.getElementById('cb').value=p.b; document.getElementById('cc').value=p.c; document.getElementById('disp').value=p.d; }
  // 계수 → 표시식 자동 생성
  function _gcd(a,b){ a=Math.abs(a);b=Math.abs(b); while(b){var t=b;b=a%b;a=t;} return a||1; }
  function _frac(n,d){ if(d===0) return '0'; var g=_gcd(n,d); n/=g; d/=g; if(d<0){n=-n;d=-d;} return d===1?String(n):(n+'/'+d); }
  function autoDisplay(a,b,c){
    if(a===0&&b===0) return '';
    if(b===0) return 'x = ' + _frac(c,a);          // 세로선
    if(a===0) return 'y = ' + _frac(c,b);          // 가로선
    // y = mx + n  (m=-a/b, n=c/b)
    var m=_frac(-a,b), n=_frac(c,b);
    var mt = m==='1'?'x':(m==='-1'?'-x':m+'x');
    var nt = (n==='0')?'':(String(n).charAt(0)==='-'?(' - '+n.slice(1)):(' + '+n));
    return 'y = ' + mt + nt;
  }
  function onABC(){
    var a=parseInt(document.getElementById('ca').value)||0, b=parseInt(document.getElementById('cb').value)||0, c=parseInt(document.getElementById('cc').value)||0;
    document.getElementById('disp').value = autoDisplay(a,b,c);
  }
  var MP=3;
  function setMp(v, fromCustom){
    MP=Math.max(0, Math.min(99, parseInt(v)||0));   // 0=무제한, 최대 99
    document.querySelectorAll('#mpSeg button').forEach(function(x){x.classList.toggle('on', parseInt(x.dataset.v)===MP);});
    if(!fromCustom){ var c=document.getElementById('mpCustom'); if(c) c.value=''; }
  }

  var starting=false;
  function resetStartBtn(){ starting=false; var b=document.querySelector('.start'); if(b){ b.disabled=false; b.textContent='🚀 방 시작하기'; } }
  function startRoom(){
    if(starting) return;
    var cls=document.getElementById('classSel').value;
    if(!cls){ toast('반을 선택하세요'); return; }
    var room={
      class_scope: cls,
      a: parseInt(document.getElementById('ca').value)||0,
      b: parseInt(document.getElementById('cb').value)||0,
      c: parseInt(document.getElementById('cc').value)||0,
      display: document.getElementById('disp').value.trim(),
      hide_eq: document.getElementById('hideEq').checked,
      max_points: MP,
      show_wrong: document.getElementById('showWrong').checked,
      show_names: document.getElementById('showNames').checked,
      int_only: document.getElementById('intOnly').checked,
      kind: 'line'
    };
    if(room.a===0&&room.b===0){ toast('직선을 입력하세요 (a,b 둘 다 0 불가)'); return; }
    starting=true;
    var sb0=document.querySelector('.start'); if(sb0){ sb0.disabled=true; sb0.textContent='방 만드는 중…'; }
    function reset(){ starting=false; if(sb0){ sb0.disabled=false; sb0.textContent='🚀 방 시작하기'; } }
    portalRPC('graphCreate',[TOK, room]).then(function(res){
      if(!res||!res.success){ toast('방 생성 실패: '+((res&&res.message)||'')); reset(); return; }
      ROOM={ id:res.id, a:room.a, b:room.b, c:room.c, display:room.display, kind:'line', revealed:false, show_wrong:room.show_wrong, show_names:room.show_names };
      starting=false; enterLive();
    }).catch(function(e){ toast('오류: '+e.message); reset(); });
  }

  // ── 라이브 ──
  var plot=null;
  function enterLive(){
    document.getElementById('setup').style.display='none';
    document.getElementById('live').style.display='flex';
    document.getElementById('liveBtns').style.display='inline';
    document.getElementById('topEq').textContent = ROOM.display;
    document.getElementById('nameBtn').classList.toggle('on', !!ROOM.show_names);
    POINTS=[];
    if(!plot) plot=GraphPlot.attach(document.getElementById('cv'), {interactive:true});
    plot.setRoom(ROOM).setPoints(POINTS).resetView();
    // 기존 점 로드 + 실시간 구독
    sb.from('graph_points').select('*').eq('room_id', ROOM.id).order('created_at',{ascending:true}).then(function(r){
      (r.data||[]).forEach(addRow); updateHud(); renderBoard(); plot.render();
    });
    if(ch) sb.removeChannel(ch);
    ch = sb.channel('gp'+ROOM.id).on('postgres_changes',
      {event:'INSERT', schema:'public', table:'graph_points', filter:'room_id=eq.'+ROOM.id},
      function(p){ addRow(p.new); updateHud(); renderBoard(); plot.render(); }).subscribe();
  }
  function addRow(r){ POINTS.push({ x:r.x_num/r.x_den, y:r.y_num/r.y_den, correct:r.correct, name:r.name, sid:r.student_id, t:r.created_at?Date.parse(r.created_at):0 }); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function updateHud(){
    var names={}; POINTS.forEach(function(p){ names[p.sid||p.name]=1; });
    document.getElementById('hCount').textContent=Object.keys(names).length;
    document.getElementById('hPoints').textContent=POINTS.length;
    document.getElementById('hCorrect').textContent=POINTS.filter(function(p){return p.correct;}).length;
  }
  // 리더보드: 정답 많은 순 → (동점) 정답 완료가 빠른 순
  var MEDAL=['🥇','🥈','🥉'];
  function renderBoard(){
    var map={};
    POINTS.forEach(function(p){
      var k=p.sid||p.name; if(!map[k]) map[k]={name:p.name, correct:0, wrong:0, cLast:0};
      var m=map[k]; if(p.correct){ m.correct++; if(p.t>m.cLast) m.cLast=p.t; } else m.wrong++;
    });
    var arr=Object.keys(map).map(function(k){return map[k];});
    arr.sort(function(a,b){
      if(b.correct!==a.correct) return b.correct-a.correct;
      var ca=a.correct?a.cLast:Infinity, cb=b.correct?b.cLast:Infinity;
      return ca-cb;
    });
    document.getElementById('board').innerHTML = arr.length ? arr.map(function(m,i){
      return '<div class="brow"><span class="brank">'+(i<3?MEDAL[i]:(i+1))+'</span>'
        +'<span class="bname">'+esc(m.name)+'</span>'
        +'<span class="bok">✅'+m.correct+'</span>'
        +(m.wrong?'<span class="bno">❌'+m.wrong+'</span>':'')+'</div>';
    }).join('') : '<div class="bempty">아직 제출이 없어요</div>';
  }

  function toggleNames(){
    if(!ROOM||!plot) return;
    ROOM.show_names=!ROOM.show_names;
    document.getElementById('nameBtn').classList.toggle('on', ROOM.show_names);
    plot.render();
    portalRPC('graphUpdate',[TOK, ROOM.id, {show_names:ROOM.show_names}]).catch(function(){});
  }
  function toggleReveal(){
    if(!ROOM||!plot) return;
    ROOM.revealed=!ROOM.revealed;
    document.getElementById('revealBtn').classList.toggle('on', ROOM.revealed);
    if(ROOM.revealed) plot.animateReveal(); else plot.render();
    portalRPC('graphUpdate',[TOK, ROOM.id, {revealed:ROOM.revealed}]).catch(function(){});
  }
  function clearPoints(){
    if(!ROOM||!confirm('찍힌 점을 모두 지울까요?')) return;
    portalRPC('graphClear',[TOK, ROOM.id]).then(function(){ POINTS.length=0; updateHud(); renderBoard(); if(plot) plot.render(); toast('점을 지웠어요'); }).catch(function(e){ toast('오류: '+e.message); });
  }
  function closeRoom(){
    if(!ROOM||!confirm('이 방을 종료할까요?\n(학생 화면에서 사라져요)')) return;
    portalRPC('graphClose',[TOK, ROOM.id]).then(function(){
      if(ch){ sb.removeChannel(ch); ch=null; }
      ROOM=null; document.getElementById('live').style.display='none';
      document.getElementById('liveBtns').style.display='none'; document.getElementById('topEq').textContent='';
      document.getElementById('setup').style.display='flex'; loadActiveRooms(); resetStartBtn(); toast('방을 종료했어요');
    }).catch(function(e){ toast('오류: '+e.message); });
  }

  // 좌표평면 렌더링은 graph-plot.js(GraphPlot)가 전담

  // 시작: 토큰 있으면 세션 검증
  if(TOK){
    portalRPC('validateTeacherSession',[TOK]).then(function(res){
      if(res&&res.success){ document.getElementById('lock').style.display='none'; initSetup(); }
      else { TOK=''; localStorage.removeItem('graph_ptok'); }
    }).catch(function(){});
  }
</script>
</body>
</html>
