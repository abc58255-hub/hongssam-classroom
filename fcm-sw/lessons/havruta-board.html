<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하브루타 — 칠판</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;}
  /* 로그인 */
  #lock{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:999;}
  #lock .box{background:#1e293b;padding:34px;border-radius:20px;width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  #lock h2{font-size:20px;margin-bottom:16px;color:#c7d2fe;}
  #lock input{width:100%;padding:13px;border:1.5px solid #334155;border-radius:12px;background:#0f172a;color:#fff;font-size:15px;margin-bottom:12px;}
  #lock button{width:100%;padding:13px;background:#4f46e5;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;}
  #lerr{color:#f87171;font-size:13px;margin-top:10px;min-height:18px;}
  /* 제어바 */
  .ctl{background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #334155;position:sticky;top:0;z-index:50;}
  .ctl select,.ctl input{padding:8px 10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#fff;font-size:13px;}
  .ctl button{padding:8px 14px;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;background:#334155;color:#e2e8f0;}
  .ctl button.on{background:#4f46e5;color:#fff;}
  .ctl button.warn{background:#7f1d1d;color:#fecaca;}
  .ctl .sp{flex:1;}
  .stagebtn{padding:8px 16px;}
  .stagebtn.active{background:#22c55e;color:#06281a;}
  /* 본문 */
  .wrap{padding:2vw 2.5vw;}
  .title{font-size:2.4vw;font-weight:900;color:#fff;margin-bottom:.5vw;}
  .sub{font-size:1.2vw;color:#94a3b8;margin-bottom:1.5vw;}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
  .col{background:#1e293b;border-radius:12px;padding:9px;}
  .col h3{font-size:1vw;font-weight:900;color:#a5b4fc;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #334155;}
  .qc{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:5px 8px;margin-bottom:5px;position:relative;}
  .qc .w{font-size:.8vw;font-weight:800;color:#c4b5fd;background:#312e81;display:inline-block;padding:1px 6px;border-radius:6px;margin-bottom:2px;}
  .qc .t{font-size:.92vw;color:#f1f5f9;line-height:1.3;word-break:keep-all;display:block;padding-right:14px;}
  .qc .m{font-size:.72vw;color:#64748b;margin-top:1px;}
  .qc .del{position:absolute;top:3px;right:5px;background:none;border:none;color:#475569;font-size:13px;cursor:pointer;line-height:1;}
  .qc .votes{display:inline-block;background:#f59e0b;color:#06281a;font-weight:900;font-size:.85vw;padding:0 8px;border-radius:12px;}
  .qc .rankb{font-size:.9vw;font-weight:900;color:#fbbf24;}
  .qc .pick{background:#22c55e;color:#06281a;border:none;border-radius:8px;padding:2px 9px;font-size:.8vw;font-weight:800;cursor:pointer;}
  .rank1{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.3);}
  .qc.cand{border-color:#f59e0b;background:#2a2410;}
  .candbtn{margin-top:6px;background:none;border:1px solid #475569;color:#94a3b8;border-radius:8px;padding:3px 10px;font-size:.85vw;font-weight:700;cursor:pointer;}
  .candbtn.on{background:#f59e0b;border-color:#f59e0b;color:#241a04;}
  .cols.padlet .qc{box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .focus{background:linear-gradient(135deg,#064e3b,#065f46);border:3px solid #34d399;border-radius:24px;padding:5vh 4vw;text-align:center;margin-top:3vh;}
  .focus .lab{font-size:1.4vw;font-weight:800;color:#6ee7b7;margin-bottom:2vh;}
  .focus .q{font-size:3.4vw;font-weight:900;color:#fff;line-height:1.4;word-break:keep-all;}
  .focus .m{font-size:1.2vw;color:#a7f3d0;margin-top:2.5vh;}
  .empty{color:#475569;font-size:1.3vw;text-align:center;padding:8vh 0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:800;}
  .toast.show{opacity:1;}
  body.present .ctl{display:none !important;}
</style>
</head>
<body>
  <div id="lock"><div class="box"><h2>💬 하브루타 칠판</h2><p style="font-size:13px;color:#94a3b8;margin-bottom:14px;">교사 비밀번호를 입력하세요</p>
    <input type="password" id="lpw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doUnlock()">
    <button id="lbtn" onclick="doUnlock()">확인</button><div id="lerr"></div></div></div>

  <div class="ctl" id="ctl" style="display:none;">
    <select id="clsSel"></select>
    <input type="text" id="unitInp" placeholder="단원명 (예: 도형의 닮음과 피타고라스)" style="width:240px;">
    <textarea id="subInp" placeholder="소단원 (한 줄에 하나, 비우면 1~5)" rows="1" style="width:240px;resize:vertical;font-family:inherit;min-height:34px;"></textarea>
    <label style="font-size:12px;color:#94a3b8;">단어<input type="number" id="nwInp" value="2" min="1" max="5" style="width:48px;margin-left:4px;"></label>
    <label style="font-size:12px;color:#94a3b8;">질문<input type="number" id="nqInp" value="2" min="1" max="5" style="width:48px;margin-left:4px;"></label>
    <label style="font-size:12px;color:#94a3b8;">투표<input type="number" id="nvInp" value="2" min="1" max="9" style="width:48px;margin-left:4px;"></label>
    <button onclick="openSession()">세션 열기</button>
    <span class="sp"></span>
    <button class="stagebtn" id="st-submit" onclick="setStage('submit')">① 제출</button>
    <button class="stagebtn" id="st-vote" onclick="setStage('vote')">② 투표</button>
    <button class="stagebtn" id="st-discuss" onclick="setStage('discuss')">③ 토론</button>
    <button id="kwBtn" onclick="toggleKw()">☁️ 키워드</button>
    <button id="nmBtn" onclick="toggleNames()">👤 이름</button>
    <button onclick="showArchive()">📚 지난 세션</button>
    <button onclick="togglePresent()">🖥️ 전시</button>
    <button class="warn" onclick="closeSession()">닫기</button>
  </div>

  <div class="wrap" id="wrap"><div class="empty">반을 고르고 "세션 열기"를 누르세요.</div></div>
  <div class="toast" id="toast"></div>

<script>
  var PORTAL='https://script.google.com/macros/s/AKfycbw8M03W7ECbqUzCPJkPb1YGrEo3SRORTDaxoTMLz5yoUw8pTLpIPAIH1qpfgJY80J9v/exec';
  var SB_URL='https://lqjrrqhrnxctyrqccmch.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxanJycWhybnhjdHlycWNjbWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MDcwNzUsImV4cCI6MjA5OTk4MzA3NX0.7j44nTdC4CGSFm-1PTECdWNEHUnBb4SvhrcLfY8M4_Q';
  var sb=supabase.createClient(SB_URL,SB_KEY);
  var TOK=localStorage.getItem('hv_ptok')||'';
  var SESSION=null, QS=[], CIRC=['①','②','③','④','⑤','⑥','⑦','⑧'], qCh=null, sCh=null;

  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1800); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function portalRPC(fn,args){ return fetch(PORTAL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(d){ if(d&&d.ok) return d.result; throw new Error((d&&d.error)||'서버 오류'); }); }

  function doUnlock(){
    var pw=document.getElementById('lpw').value, b=document.getElementById('lbtn');
    if(!pw) return; b.disabled=true; b.textContent='확인 중…';
    portalRPC('teacherLogin',[pw]).then(function(res){
      b.disabled=false; b.textContent='확인';
      if(res&&res.success&&res.token){ TOK=res.token; localStorage.setItem('hv_ptok',TOK); document.getElementById('lock').style.display='none'; document.getElementById('ctl').style.display='flex'; initCtl(); }
      else document.getElementById('lerr').textContent=(res&&res.message)||'비밀번호 오류';
    }).catch(function(e){ b.disabled=false; b.textContent='확인'; document.getElementById('lerr').textContent='오류: '+e.message; });
  }
  if(TOK){ document.getElementById('lock').style.display='none'; document.getElementById('ctl').style.display='flex'; initCtl(); }

  function relock(msg){
    TOK=''; localStorage.removeItem('hv_ptok');
    document.getElementById('ctl').style.display='none';
    document.getElementById('lock').style.display='flex';
    if(msg) document.getElementById('lerr').textContent=msg;
  }
  function initCtl(){
    var sel=document.getElementById('clsSel');
    portalRPC('graphClasses',[TOK]).then(function(res){
      if(res&&res.success===false){ relock(res.message||'로그인이 만료됐어요. 다시 로그인해주세요.'); return; }
      var cls=(res&&res.classes)||[];
      if(!cls.length){ sel.innerHTML='<option value="">반 정보 없음</option>'; toast('등록된 학생이 없어요. 명단을 먼저 등록해주세요.'); return; }
      sel.innerHTML=cls.map(function(c){return '<option>'+esc(c)+'</option>';}).join('');
      loadActive(cls[0]);
    }).catch(function(e){ sel.innerHTML='<option value="">불러오기 실패</option>'; toast('반 불러오기 오류: '+e.message); });
    document.getElementById('clsSel').addEventListener('change',function(){ loadActive(this.value); });
    document.getElementById('unitInp').value='Ⅶ. 도형의 닮음과 피타고라스 정리';
    document.getElementById('subInp').value='닮은 도형\n삼각형의 닮음 조건\n평행선 사이의 거리의 비\n삼각형의 무게중심\n피타고라스 정리';
  }

  function loadActive(cls){
    sb.from('havruta_sessions').select('*').eq('class_scope',cls).eq('active',true).order('created_at',{ascending:false}).limit(1)
      .then(function(r){ SESSION=(r.data&&r.data[0])||null; if(SESSION){ subscribe(); loadQs(); } else { QS=[]; render(); } });
  }
  function openSession(){
    var cls=document.getElementById('clsSel').value;
    var unit=document.getElementById('unitInp').value.trim();
    var subs=document.getElementById('subInp').value.trim();
    var nw=parseInt(document.getElementById('nwInp').value)||2;
    var nq=parseInt(document.getElementById('nqInp').value)||2;
    var nv=parseInt(document.getElementById('nvInp').value)||2;
    portalRPC('havrutaOpen',[TOK,{class_scope:cls,unit:unit,sub_units:subs,n_words:nw,n_questions:nq,n_votes:nv}]).then(function(res){
      if(res&&res.success){ toast('세션을 열었어요'); loadActive(cls); }
      else toast('실패: '+((res&&res.message)||''));
    }).catch(function(e){ toast('오류: '+e.message); });
  }
  function setStage(st){ if(!SESSION){ toast('세션을 먼저 여세요'); return; }
    portalRPC('havrutaStage',[TOK,SESSION.id,st]).then(function(){ SESSION.stage=st; render(); }).catch(function(e){ toast('오류: '+e.message); }); }
  function closeSession(){ if(!SESSION) return;
    portalRPC('havrutaClose',[TOK,SESSION.id]).then(function(){ toast('세션을 닫았어요'); SESSION=null; QS=[]; render(); }).catch(function(e){ toast('오류: '+e.message); }); }
  function delQ(id){ portalRPC('havrutaDeleteQ',[TOK,id]).then(function(){ loadQs(); }).catch(function(e){ toast('오류: '+e.message); }); }
  function pickFocus(qid,su,on){ portalRPC('havrutaFocus',[TOK,SESSION.id,qid,su,on]).then(function(){ var q=QS.filter(function(z){return z.id===qid;})[0]; if(on){ QS.forEach(function(z){ if((z.sub_unit||1)===su) z.focus=false; }); } if(q) q.focus=on; render(); toast(on?'오늘의 질문 선정! ⭐':'선정 해제'); }).catch(function(e){ toast('오류: '+e.message); }); }
  function togglePresent(){ document.body.classList.toggle('present'); if(document.body.classList.contains('present')){ var h=document.createElement('div'); h.id='exitP'; h.style.cssText='position:fixed;top:8px;right:8px;z-index:900;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;'; h.textContent='✕ 제어 보기'; h.onclick=togglePresent; document.body.appendChild(h); } else { var e=document.getElementById('exitP'); if(e) e.remove(); } }

  function subscribe(){
    if(qCh){ sb.removeChannel(qCh); } if(sCh){ sb.removeChannel(sCh); }
    qCh=sb.channel('hvb-q-'+SESSION.id).on('postgres_changes',{event:'*',schema:'public',table:'havruta_questions',filter:'session_id=eq.'+SESSION.id},function(){ loadQs(); }).subscribe();
    sCh=sb.channel('hvb-s-'+SESSION.id).on('postgres_changes',{event:'*',schema:'public',table:'havruta_sessions',filter:'id=eq.'+SESSION.id},function(p){ if(p.new){ SESSION=p.new; render(); } }).subscribe();
  }
  function loadQs(){
    if(!SESSION){ QS=[]; render(); return; }
    sb.from('havruta_questions').select('*').eq('session_id',SESSION.id).order('created_at',{ascending:true})
      .then(function(r){ QS=r.data||[]; render(); });
  }

  function stageBtns(){
    ['submit','vote','discuss'].forEach(function(s){ var b=document.getElementById('st-'+s); if(b) b.classList.toggle('active', SESSION&&SESSION.stage===s); });
  }
  var KWVIEW=false, REVEAL=false;
  function toggleKw(){ KWVIEW=!KWVIEW; if(KWVIEW) REVEAL=false; var b=document.getElementById('kwBtn'); if(b) b.classList.toggle('on',KWVIEW); render(); }
  function reveal(){ REVEAL=true; render(); }
  function hideKw(){ REVEAL=false; render(); }
  function nameOf(x){ return (SESSION && SESSION.show_names===false) ? '익명' : esc(x.name||''); }
  function toggleNames(){ if(!SESSION){ toast('세션을 먼저 여세요'); return; } var on=!(SESSION.show_names===false); // 현재 true면 끄기
    portalRPC('havrutaNames',[TOK,SESSION.id,!on]).then(function(){ SESSION.show_names=!on; render(); }).catch(function(e){ toast('오류: '+e.message); }); }
  function render(){
    stageBtns();
    var kb=document.getElementById('kwBtn'); if(kb) kb.classList.toggle('on',KWVIEW);
    var nb=document.getElementById('nmBtn'); if(nb){ var showing=!(SESSION&&SESSION.show_names===false); nb.textContent=showing?'👤 이름':'🙈 익명'; nb.classList.toggle('on',!showing); }
    var wrap=document.getElementById('wrap');
    if(!SESSION){ wrap.innerHTML='<div class="empty">반을 고르고 "세션 열기"를 누르세요.</div>'; return; }
    var qCount=QS.filter(function(q){return String(q.question||'').trim();}).length;
    var kCount=QS.filter(function(q){return String(q.word||'').trim();}).length;
    var head='<div class="title">💬 '+(SESSION.unit?esc(SESSION.unit):'하브루타 질문')+'</div>'
      +'<div class="sub">'+esc(SESSION.class_scope)+' · '+(KWVIEW?'키워드 모음':({submit:'질문 제출 단계 — 교과서를 읽고 질문을 만들어요',vote:'투표 단계 — 소단원마다 2표씩',discuss:'토론 단계 — 소단원별 오늘의 질문'}[SESSION.stage]||''))+' · 질문 '+qCount+' · 키워드 '+kCount+'</div>';
    if(KWVIEW){ wrap.innerHTML=head+renderKeywords(); return; }
    if(SESSION.stage==='discuss'){ wrap.innerHTML=head+renderFocus(); return; }
    if(SESSION.stage==='vote'){ wrap.innerHTML=head+renderVote(); return; }
    wrap.innerHTML=head+renderSubmit();
  }
  // ☁️ 키워드 — 워드클라우드(왼쪽) + 빈도 순위(오른쪽)
  function renderKeywords(){
    var cnt={}, disp={};
    QS.forEach(function(q){ var w=String(q.word||'').trim(); if(!w) return; var k=w.toLowerCase(); cnt[k]=(cnt[k]||0)+1; if(!disp[k]) disp[k]=w; });
    var arr=Object.keys(cnt).map(function(k){ return {w:disp[k],n:cnt[k]}; }).sort(function(a,b){ return b.n-a.n; });
    if(!arr.length) return '<div class="empty">아직 입력된 키워드가 없어요.<br><span style="font-size:1vw;">학생이 "중요한 단어"를 적으면 모여요.</span></div>';
    var total=QS.filter(function(q){return String(q.word||'').trim();}).length;
    if(!REVEAL){
      return '<div class="empty" style="min-height:60vh;flex-direction:column;gap:3vh;">'
        +'<div style="font-size:2vw;font-weight:900;color:#a5b4fc;">🤫 키워드 '+arr.length+'종 · '+total+'개 모였어요</div>'
        +'<div style="font-size:1vw;color:#94a3b8;">버튼을 누르면 공개돼요</div>'
        +'<button onclick="reveal()" style="font-size:1.6vw;font-weight:900;background:linear-gradient(135deg,#4338ca,#6d28d9);color:#fff;border:none;border-radius:50px;padding:1.4vh 3vw;cursor:pointer;box-shadow:0 8px 24px rgba(67,56,202,.5);">🎉 짜잔! 키워드 공개하기</button>'
        +'</div>';
    }
    var max=arr[0].n;
    var cloud=arr.map(function(x){
      var ratio=x.n/max; var fs=(1.2+ratio*3.0).toFixed(2);
      var col=ratio>0.66?'#fff':ratio>0.33?'#c7d2fe':'#94a3b8';
      var bg=ratio>0.66?'#4338ca':ratio>0.33?'#312e81':'#1e293b';
      return '<span style="display:inline-flex;align-items:baseline;gap:.35vw;background:'+bg+';color:'+col+';padding:.4vw 1vw;border-radius:40px;margin:.45vw;font-weight:900;font-size:'+fs+'vw;line-height:1.1;">'+esc(x.w)+'<span style="font-size:.95vw;opacity:.7;">'+x.n+'</span></span>';
    }).join('');
    var medal=['🥇','🥈','🥉'];
    var rank=arr.slice(0,10).map(function(x,i){
      return '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#0f172a;border-radius:10px;margin-bottom:6px;">'
        +'<span style="font-size:1.1vw;width:1.6vw;text-align:center;">'+(medal[i]||(i+1))+'</span>'
        +'<span style="flex:1;font-size:1.1vw;font-weight:800;color:#e2e8f0;">'+esc(x.w)+'</span>'
        +'<span style="background:#4338ca;color:#fff;font-weight:900;font-size:1vw;padding:1px 9px;border-radius:12px;">'+x.n+'</span></div>';
    }).join('');
    return '<div style="display:flex;gap:2vw;align-items:flex-start;">'
      +'<div style="flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;padding:2vh 1vw;background:#1e293b;border-radius:16px;min-height:50vh;">'+cloud+'</div>'
      +'<div style="width:24vw;min-width:240px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><div style="font-size:1.2vw;font-weight:900;color:#a5b4fc;">🏆 가장 많이 나온 단어</div><button onclick="hideKw()" style="margin-left:auto;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:16px;padding:4px 12px;font-size:.85vw;cursor:pointer;">🙈 다시 가리기</button></div>'+rank+'</div>'
      +'</div>';
  }
  function subName(i){ var raw=(SESSION.sub_units||'').trim(); var arr=raw?raw.split(/\n|,/).map(function(s){return s.trim();}).filter(Boolean):['소단원 1','소단원 2','소단원 3','소단원 4','소단원 5']; return arr[i]||('소단원 '+(i+1)); }
  // 소단원 개수 (라벨 수, 최소 5)
  function subCount(){ var raw=(SESSION.sub_units||'').trim(); var n=raw?raw.split(/\n|,/).filter(function(s){return s.trim();}).length:5; return Math.max(5,n); }
  // 패들렛 스타일 질문 카드 — 이름 작게, (토론 단계) ⭐ 오늘의 질문 선정 버튼
  function qCard(x,opts){ opts=opts||{};
    var foc=!!x.focus;
    return '<div class="qc'+(opts.rank1?' rank1':'')+(foc?' cand':'')+'">'
      +'<button class="del" onclick="delQ('+x.id+')" title="삭제">✕</button>'
      +'<span class="t">'+esc(x.question)+'</span>'
      +'<div class="m">'+nameOf(x)+'</div>'
      +(opts.showVotes
         ? '<div style="margin-top:4px;display:flex;align-items:center;gap:6px;">'
           +(opts.rankN?'<span class="rankb">'+(['🥇','🥈','🥉'][opts.rankN-1]||opts.rankN+'위')+'</span>':'')
           +'<span class="votes">👍 '+(x.votes||0)+'</span>'
           +(opts.pick?'<button class="candbtn'+(foc?' on':'')+'" onclick="pickFocus('+x.id+','+(x.sub_unit||1)+','+(!foc)+')">'+(foc?'⭐ 선정됨':'☆ 오늘의 질문')+'</button>':'')
           +'</div>'
         : '')
      +'</div>';
  }
  // 소단원별 열 그리드 (제출·투표·토론 공용)
  function groupedCols(opts){ opts=opts||{};
    var n=subCount(), cols='';
    for(var i=0;i<n;i++){ (function(i){
      var list=QS.filter(function(q){ return (q.sub_unit||1)-1===i && String(q.question||'').trim(); });
      if(opts.sortVotes) list.sort(function(a,b){ return (b.votes||0)-(a.votes||0); });
      cols+='<div class="col"><h3>'+CIRC[i]+' '+esc(subName(i))+' <span style="color:#64748b;font-weight:600;">('+list.length+')</span></h3>'
        +(list.length?list.map(function(x,idx){ var o={}; for(var k in opts)o[k]=opts[k]; if(opts.sortVotes&&opts.showVotes&&(x.votes||0)>0){ o.rankN=idx+1; o.rank1=(idx===0); } return qCard(x,o); }).join(''):'<div style="color:#475569;font-size:.9vw;padding:6px;">아직 없어요</div>')+'</div>';
    })(i); }
    return '<div class="cols padlet">'+cols+'</div>';
  }
  function renderSubmit(){ return groupedCols({}); }
  function renderVote(){ return groupedCols({showVotes:true, sortVotes:true}); }
  function renderFocus(){
    var focs=QS.filter(function(q){ return q.focus && String(q.question||'').trim(); }).sort(function(a,b){ return (a.sub_unit||1)-(b.sub_unit||1); });
    var banner='';
    if(focs.length){
      banner='<div style="display:flex;flex-direction:column;gap:1.5vh;margin-bottom:2.5vh;">'+focs.map(function(x){ var i=(x.sub_unit||1)-1;
        return '<div class="focus" style="padding:2vh 2vw;"><div class="lab">🌟 '+CIRC[i]+' '+esc(subName(i))+'</div><div class="q" style="font-size:1.9vw;">'+esc(x.question)+'</div>'
          +(x.word?'<span class="w" style="font-size:1vw;margin-top:1vh;display:inline-block;">'+esc(x.word)+'</span>':'')
          +'<div class="m">'+nameOf(x)+' · 👍 '+(x.votes||0)+'</div></div>';
      }).join('')+'</div>';
    }
    return banner+'<div class="sub" style="margin:0 0 1vh;">👇 소단원마다 ⭐ 오늘의 질문을 하나씩 골라요 (득표순 정렬)</div>'+groupedCols({showVotes:true, pick:true, sortVotes:true});
  }

  // ── 지난 세션 보관함 (득표 순위·소단원별 질문·키워드 순위) ──
  var ARC_SESS=[];
  function arcLabels(s){ var raw=(s&&s.sub_units||'').trim(); var a=raw?raw.split(/\n|,/).map(function(x){return x.trim();}).filter(Boolean):[]; while(a.length<5)a.push('소단원 '+(a.length+1)); return a; }
  function showArchive(){
    var cls=document.getElementById('clsSel').value||'';
    var ov=document.getElementById('arcOv');
    if(!ov){ ov=document.createElement('div'); ov.id='arcOv';
      ov.style.cssText='position:fixed;inset:0;background:#0f172a;z-index:1000;overflow:auto;padding:24px;color:#e2e8f0;';
      document.body.appendChild(ov); }
    ov.innerHTML='<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;"><h2 style="margin:0;">📚 지난 세션 보관함</h2>'
      +'<span style="color:#94a3b8;">'+esc(cls)+'</span>'
      +'<button onclick="document.getElementById(\'arcOv\').remove()" style="margin-left:auto;background:#334155;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;">✕ 닫기</button></div>'
      +'<div id="arcBody" style="color:#94a3b8;">불러오는 중…</div>';
    sb.from('havruta_sessions').select('*').eq('class_scope',cls).eq('active',false).order('created_at',{ascending:false})
      .then(function(r){
        var sess=(r.data)||[]; ARC_SESS=sess;
        if(!sess.length){ document.getElementById('arcBody').innerHTML='<p>보관된 지난 세션이 없어요. (세션을 새로 열면 이전 세션이 여기에 쌓여요)</p>'; return; }
        var btns=sess.map(function(s){ var d=new Date(s.created_at); var lab=(d.getMonth()+1)+'/'+d.getDate()+' '+(s.unit||'하브루타');
          return '<button class="arcS" data-id="'+s.id+'" onclick="loadArcSession('+s.id+',this)" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:8px 14px;margin:0 8px 8px 0;cursor:pointer;">'+esc(lab)+'</button>'; }).join('');
        document.getElementById('arcBody').innerHTML='<div style="margin-bottom:16px;">'+btns+'</div><div id="arcDetail"></div>';
        loadArcSession(sess[0].id, document.querySelector('.arcS'));
      });
  }
  function loadArcSession(sid, btn){
    if(btn){ Array.prototype.forEach.call(document.querySelectorAll('.arcS'),function(b){ b.style.background='#1e293b'; b.style.borderColor='#334155'; }); btn.style.background='#2563eb'; btn.style.borderColor='#2563eb'; }
    var det=document.getElementById('arcDetail'); if(det) det.innerHTML='<span style="color:#94a3b8;">불러오는 중…</span>';
    var s=ARC_SESS.filter(function(z){return z.id===sid;})[0]||{};
    var labels=arcLabels(s);
    sb.from('havruta_questions').select('*').eq('session_id',sid)
      .then(function(r){
        var rows=(r.data)||[];
        var qs=rows.filter(function(x){return String(x.question||'').trim();});
        // 키워드 순위 (세션 전체)
        var words={}; rows.forEach(function(x){ var w=String(x.word||'').trim(); if(w) words[w]=(words[w]||0)+1; });
        var wArr=Object.keys(words).map(function(k){return {w:k,n:words[k]};}).sort(function(a,b){return b.n-a.n;});
        var medal=['🥇','🥈','🥉'];
        var kwHtml=wArr.length? wArr.slice(0,15).map(function(o,i){return '<span style="display:inline-flex;align-items:center;gap:5px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:4px 12px;margin:0 6px 6px 0;">'+(medal[i]||(i+1)+'위')+' '+esc(o.w)+' <b style="color:#60a5fa;">'+o.n+'</b></span>';}).join('') : '<span style="color:#64748b;">키워드 없음</span>';
        // 소단원별 질문 — 득표순 + 순위 + 오늘의 질문 표시
        var nSub=Math.max(labels.length, rows.reduce(function(m,x){return Math.max(m,x.sub_unit||1);},0));
        var secs='';
        for(var i=0;i<nSub;i++){ (function(i){
          var list=qs.filter(function(x){return (x.sub_unit||1)===i+1;}).sort(function(a,b){return (b.votes||0)-(a.votes||0);});
          if(!list.length) return;
          secs+='<div style="margin:10px 0 6px;font-size:15px;font-weight:800;color:#a5b4fc;">'+CIRC[i]+' '+esc(labels[i]||('소단원 '+(i+1)))+' <span style="color:#64748b;font-weight:600;font-size:13px;">('+list.length+')</span></div>';
          secs+=list.map(function(x,idx){
            var rank=(x.votes||0)>0?(medal[idx]||(idx+1)+'위'):'';
            return '<div style="background:#1e293b;border:1px solid '+((x.focus)?'#22c55e':'#334155')+';border-radius:10px;padding:9px 13px;margin-bottom:7px;">'
              +'<div style="display:flex;align-items:center;gap:8px;"><span style="background:#f59e0b;color:#06281a;font-weight:900;font-size:13px;padding:1px 9px;border-radius:12px;">👍 '+(x.votes||0)+'</span>'
              +(rank?'<span style="font-weight:900;color:#fbbf24;font-size:14px;">'+rank+'</span>':'')
              +(x.focus?'<span style="color:#86efac;font-size:12px;font-weight:800;">⭐ 오늘의 질문</span>':'')+'</div>'
              +'<div style="margin-top:5px;">'+esc(x.question)+'</div>'
              +'<div style="color:#64748b;font-size:12px;margin-top:3px;">'+esc(x.name||'')+(x.word?' · 🔑 '+esc(x.word):'')+'</div></div>';
          }).join('');
        })(i); }
        if(!secs) secs='<span style="color:#64748b;">질문 없음</span>';
        det.innerHTML='<h3 style="margin:8px 0;">🔑 키워드 순위 ('+wArr.length+'종)</h3><div style="margin-bottom:22px;">'+kwHtml+'</div>'
          +'<h3 style="margin:8px 0;">💬 소단원별 질문 · 득표순 ('+qs.length+')</h3><div>'+secs+'</div>';
      });
  }
</script>
</body>
</html>
