<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 포털</title>

<!-- iOS 홈 화면 아이콘은 반드시 PNG 파일 (data URI·SVG는 무시됨) -->
<link rel="apple-touch-icon" href="./icon-portal-180.png">
<link rel="icon" type="image/png" href="./icon-portal-192.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="교사포털">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
<script src="../config.js"></script>
<script>
  // ✅ GAS 백엔드 (교사포털 고정 배포 — 재배포해도 주소 동일)
  var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbw8M03W7ECbqUzCPJkPb1YGrEo3SRORTDaxoTMLz5yoUw8pTLpIPAIH1qpfgJY80J9v/exec';
  // ✅ 교사 푸시 토큰 저장 엔드포인트 (학생-수학 GAS의 ?action=saveTeacherFcmToken — teacher.html과 동일)
  var TOKEN_GAS_URL = 'https://script.google.com/macros/s/AKfycbyR1whn6f90-kJEAaJg_O34uP8v-KvyEqsRky58idjoxVDS5cWj80p2ScJp6V2dnz_0hA/exec';

  // ✅ google.script.run 호환 어댑터 — 교사포털 doPost RPC를 fetch로 호출
  //    FNS는 교사포털/Code.js의 RPC_WHITELIST와 반드시 일치해야 함
  (function () {
    var FNS = [
      'teacherLogin', 'teacherLogout', 'validateTeacherSession',
      'getPortalData', 'setAppUrl', 'getStudentList', 'resetStudentPassword',
      'getLessonGames', 'setLessonGame', 'lessonScores', 'lessonDeleteScore', 'lessonResetGame',
      'getLinks', 'saveLink', 'deleteLink'
    ];
    function makeRunner() {
      var ok = function () {}, fail = function (e) { console.error('[GAS RPC]', e); };
      var runner = {};
      runner.withSuccessHandler = function (fn) { if (fn) ok = fn; return runner; };
      runner.withFailureHandler = function (fn) { if (fn) fail = fn; return runner; };
      FNS.forEach(function (name) {
        runner[name] = function () {
          var args = Array.prototype.slice.call(arguments);
          fetch(GAS_EXEC_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ fn: name, args: args })
          }).then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          }).then(function (data) {
            if (data && data.ok) return data.result;
            throw new Error((data && data.error) || '서버 오류');
          }).then(function (result) { ok(result); }, function (e) { fail(e); });
        };
      });
      return runner;
    }
    var scriptObj = {};
    Object.defineProperty(scriptObj, 'run', { get: makeRunner });
    window.google = { script: scriptObj };
  })();

  // PWA 셸 서비스워커 (네트워크 우선 + HTTP 캐시 재검증)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      try { reg.update(); } catch (_) {}
    }).catch(function () {});
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .hidden { display: none !important; }

  /* 로그인 */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 20%, #1e3a8a, #0f172a 70%); }
  .login-card { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); width: 340px; text-align: center; }
  .login-card h1 { font-size: 24px; margin-bottom: 6px; }
  .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 13px 15px; border: 2px solid #334155; border-radius: 12px; font-size: 15px; margin-bottom: 14px; background: #0f172a; color: white; }
  .login-card input:focus { outline: none; border-color: #3b82f6; }
  .btn { background: #2563eb; color: white; border: none; padding: 13px 20px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
  .btn:hover { background: #1d4ed8; }

  /* 헤더 */
  header { padding: 28px 20px 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 22px; font-weight: 900; white-space: nowrap; }
  header .spacer { flex: 1; }
  .small { background: #1e293b; color: #94a3b8; border: none; padding: 9px 13px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .small:hover { background: #334155; color: white; }
  .hr-chip { background: #1e3a8a; color: #bfdbfe; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

  main { padding: 12px 20px 50px; max-width: 1100px; margin: 0 auto; }
  .group { margin-top: 28px; }
  .group h2 { font-size: 15px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }

  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 18px; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit; display: block; position: relative; }
  .card:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 12px 30px rgba(37,99,235,0.25); }
  .card .icon { font-size: 32px; margin-bottom: 10px; display: block; }
  .card h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .card p { font-size: 12px; color: #94a3b8; line-height: 1.4; }
  .card.off { cursor: default; opacity: 0.55; }
  .card.off:hover { transform: none; border-color: #334155; box-shadow: none; }
  .card .off-tag { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 800; color: #f87171; background: #450a0a; padding: 3px 9px; border-radius: 20px; }
  .card .set-link { display: inline-block; margin-top: 8px; font-size: 12px; color: #60a5fa; cursor: pointer; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2563eb; color: white; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 700; z-index: 100; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; color: #64748b; padding: 60px; }
  .modal-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .modal { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 440px; max-width: 92vw; max-height: 88vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; }
  .modal input { width: 100%; padding: 11px 13px; border: 2px solid #334155; border-radius: 10px; font-size: 14px; background: #0f172a; color: white; }
  .modal input:focus { outline: none; border-color: #3b82f6; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="login-card">
    <h1>🏫 교사 포털</h1>
    <p>교사 비밀번호로 로그인하세요</p>
    <input type="password" id="pw" placeholder="교사 비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- 포털 -->
<div id="app" class="hidden">
  <header>
    <h1 onclick="loadPortal()" style="cursor:pointer;" title="홈으로">🏫 교사 포털</h1>
    <span class="hr-chip hidden" id="hrChip"></span>
    <div class="spacer"></div>
    <button class="small" onclick="openLinkAdmin()">🔗 수업 링크</button>
    <button class="small" id="pushBtn" onclick="openPushSetup()">🔔 알림</button>
    <button class="small" onclick="openPwReset()">🔑 비번 초기화</button>
    <button class="small" onclick="loadPortal()">↻ 새로고침</button>
    <button class="small" onclick="doLogout()">로그아웃</button>
  </header>
  <main id="portalMain"><div class="loading">불러오는 중...</div></main>
</div>

<div id="modalArea"></div>
<div class="toast" id="toast"></div>

<script>
  var TOKEN = localStorage.getItem('portal_token') || '';

  function doLogin() {
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success && res.token) {
        TOKEN = res.token; localStorage.setItem('portal_token', TOKEN); showApp();
      } else { toast(res && res.message ? res.message : '비밀번호가 틀렸습니다'); }
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).teacherLogin(pw);
  }
  function doLogout() {
    google.script.run.teacherLogout(TOKEN);
    localStorage.removeItem('portal_token'); TOKEN = '';
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
  }
  function checkSession() {
    if (!TOKEN) return;
    google.script.run.withSuccessHandler(function(res){ if (res && res.success) showApp(); }).validateTeacherSession(TOKEN);
  }
  function showApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadPortal();
  }

  function loadPortal() {
    document.getElementById('portalMain').innerHTML = '<div class="loading">불러오는 중...</div>';
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { document.getElementById('portalMain').innerHTML = '<div class="loading">불러오기 실패</div>'; return; }
      var chip = document.getElementById('hrChip');
      if (res.homeroom) { chip.textContent = res.homeroom; chip.classList.remove('hidden'); }
      render(res.groups);
    }).withFailureHandler(function(e){ document.getElementById('portalMain').innerHTML = '<div class="loading">오류: '+e.message+'</div>'; }).getPortalData();
  }

  function render(groups) {
    var html = groups.map(function(g) {
      var cards = g.cards.map(function(c) {
        if (c.action === 'lessonAdmin') {
          return '<div class="card" onclick="openLessonAdmin()">' +
            '<span class="icon">'+c.icon+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.desc)+'</p></div>';
        }
        if (c.url) {
          return '<a class="card" href="'+esc(c.url)+'" target="_blank">' +
            '<span class="icon">'+c.icon+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.desc)+'</p></a>';
        }
        return '<div class="card off"><span class="off-tag">미연결</span>' +
          '<span class="icon">'+c.icon+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.desc)+'</p>' +
          '<span class="set-link" onclick="setUrl(\''+esc(c.keys[0])+'\',\''+esc(c.name)+'\')">URL 직접 등록</span></div>';
      }).join('');
      var gstyle = g.student ? ' style="border-top:2px dashed #334155; padding-top:20px; margin-top:36px;"' : '';
      var h2style = g.student ? ' style="color:#c4b5fd;"' : '';
      return '<div class="group"'+gstyle+'><h2'+h2style+'>'+(g.student?'👨‍🎓 ':'')+esc(g.title)+'</h2><div class="grid">'+cards+'</div></div>';
    }).join('');
    document.getElementById('portalMain').innerHTML = html;
  }

  function setUrl(key, name) {
    var url = prompt(name + ' 앱의 게시 URL(/exec)을 입력하세요:', '');
    if (!url) return;
    if (url.indexOf('/exec') < 0) { toast('/exec 로 끝나는 게시 주소를 입력하세요'); return; }
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success !== false) { toast('등록됨'); loadPortal(); } else toast('등록 실패');
    }).setAppUrl(key, url);
  }

  // ── 비밀번호 초기화 ──
  var STUDENTS_CACHE = [];
  function openPwReset() {
    document.getElementById('modalArea').innerHTML =
      '<div class="modal-bg" onclick="if(event.target===this)closePw()"><div class="modal">' +
        '<h2>🔑 학생 비밀번호 초기화</h2>' +
        '<p style="color:#94a3b8;font-size:13px;margin:6px 0 14px;">초기화하면 그 학생은 <b>다음 로그인 때 새 비밀번호를 직접</b> 정해요.</p>' +
        '<input type="text" id="pwSearch" placeholder="학번 또는 이름 검색" oninput="renderStudents()">' +
        '<div id="pwList" style="margin-top:12px; max-height:52vh; overflow-y:auto;">불러오는 중...</div>' +
        '<div style="text-align:right;margin-top:14px;"><button class="small" onclick="closePw()">닫기</button></div>' +
      '</div></div>';
    google.script.run.withSuccessHandler(function(res){
      STUDENTS_CACHE = (res && res.success) ? (res.students || []) : [];
      renderStudents();
    }).withFailureHandler(function(e){ document.getElementById('pwList').innerHTML = '오류: '+e.message; }).getStudentList();
  }
  function closePw(){ document.getElementById('modalArea').innerHTML = ''; }
  function renderStudents() {
    var q = (document.getElementById('pwSearch').value || '').trim();
    var list = STUDENTS_CACHE.filter(function(s){ return !q || (s.studentId && s.studentId.indexOf(q) >= 0) || (s.name && s.name.indexOf(q) >= 0); });
    if (!list.length) { document.getElementById('pwList').innerHTML = '<p style="color:#64748b;font-size:13px;padding:10px;">해당 학생이 없어요.</p>'; return; }
    document.getElementById('pwList').innerHTML = list.map(function(s){
      var badge = s.joined ? '<span style="color:#4ade80;font-size:11px;">● 가입됨</span>' : '<span style="color:#64748b;font-size:11px;">○ 미가입</span>';
      return '<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #1e293b;">' +
        '<span style="flex:1;font-size:14px;">'+esc(s.studentId)+' '+esc(s.name)+'&nbsp;&nbsp;'+badge+'</span>' +
        '<button class="small" onclick="resetPw(\''+esc(s.studentId)+'\',\''+esc(s.name)+'\')">초기화</button></div>';
    }).join('');
  }
  function resetPw(sid, name) {
    if (!confirm(sid + ' ' + name + ' 학생의 비밀번호를 초기화할까요?\n다음 로그인 때 새 비밀번호를 직접 정하게 됩니다.')) return;
    google.script.run.withSuccessHandler(function(res){
      toast(res && res.success ? (name + ' 초기화됨') : ('실패: ' + (res && res.message || '오류')));
      if (res && res.success) { var s = STUDENTS_CACHE.filter(function(x){ return x.studentId === sid; })[0]; if (s) s.joined = false; renderStudents(); }
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).resetStudentPassword(sid, '');
  }

  // ══════════ 🎮 수업활동 관리 (게임 노출 상태·등수 범위) ══════════
  var LG_CACHE = [];
  var LG_STATUS = [
    { v: 'hidden', label: '숨김',     on: 'background:#475569;color:white;' },
    { v: 'open',   label: '🔥 진행 중', on: 'background:#d97706;color:white;' },
    { v: 'free',   label: '🏁 자유 도전', on: 'background:#059669;color:white;' }
  ];

  function openLessonAdmin() {
    var main = document.getElementById('portalMain');
    main.innerHTML = '<div class="loading">불러오는 중...</div>';
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { main.innerHTML = '<div class="loading">오류: ' + esc(res && res.message || '') + '</div>'; return; }
      LG_CACHE = res.games || [];
      renderLessonView();
    }).withFailureHandler(function(e){ main.innerHTML = '<div class="loading">오류: ' + esc(e.message) + '</div>'; }).getLessonGames(TOKEN);
  }

  var LESSONS_BASE = 'https://abc58255-hub.github.io/hongssam-classroom/lessons/';
  function renderLessonView() {
    var main = document.getElementById('portalMain');
    var cards = LG_CACHE.map(function(g, i) {
      var statusBtns = LG_STATUS.map(function(s) {
        var on = g.status === s.v;
        return '<button onclick="lgSet(' + i + ',\'status\',\'' + s.v + '\')" style="flex:1;border:none;padding:8px 2px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;' + (on ? s.on : 'background:#0f172a;color:#64748b;') + '">' + s.label + '</button>';
      }).join('');
      var scopeBtns = [['class','반 등수'],['grade','학년 등수']].map(function(sc) {
        var on = g.scope === sc[0];
        return '<button onclick="lgSet(' + i + ',\'scope\',\'' + sc[0] + '\')" style="flex:1;border:none;padding:8px 2px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;' + (on ? 'background:#2563eb;color:white;' : 'background:#0f172a;color:#64748b;') + '">' + sc[1] + '</button>';
      }).join('');
      var stInfo = { hidden: ['#94a3b8','⚫ 숨김 상태'], open: ['#fbbf24','🔥 학생에게 진행 중'], free: ['#4ade80','🏁 자유 도전 공개 중'] }[g.status] || ['#94a3b8',''];
      var openLink = g.url ? '<a href="' + LESSONS_BASE + esc(g.url) + '" target="_blank" style="font-size:11px;color:#60a5fa;text-decoration:none;font-weight:700;">↗ 열어보기</a>' : '';
      return '<div class="card" style="cursor:default;">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><span class="icon" style="font-size:22px;margin-bottom:4px;">🎮</span>' + openLink + '</div>'
        + '<h3 style="font-size:15px;margin-bottom:2px;">' + esc(g.title || g.game) + '</h3>'
        + '<p style="font-size:11px;margin-bottom:5px;">' + esc(g.unit) + ' · ' + esc(g.game) + '</p>'
        + '<div style="font-size:11px;font-weight:800;color:' + stInfo[0] + ';margin-bottom:10px;">' + stInfo[1] + '</div>'
        + '<div style="font-size:10px;color:#64748b;font-weight:800;margin-bottom:4px;">노출 상태</div>'
        + '<div style="display:flex;gap:5px;margin-bottom:10px;">' + statusBtns + '</div>'
        + '<div style="font-size:10px;color:#64748b;font-weight:800;margin-bottom:4px;">등수판 범위</div>'
        + '<div style="display:flex;gap:5px;">' + scopeBtns + '</div>'
        + '<button onclick="openLessonScores(' + i + ')" style="width:100%;margin-top:10px;border:none;background:#0f172a;color:#94a3b8;padding:8px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;">📊 기록 관리</button>'
        + '</div>';
    }).join('');
    if (!cards) cards = '<div class="card off" style="cursor:default;"><span class="icon">🎮</span><h3>아직 활동이 없어요</h3><p>활동 페이지를 만들면 여기에 카드가 자동으로 추가됩니다.</p></div>';
    main.innerHTML = '<div class="group">'
      + '<h2 style="display:flex;align-items:center;gap:12px;text-transform:none;letter-spacing:0;">'
      + '<button class="small" onclick="loadPortal()">← 포털</button><span>🎮 수업활동 관리</span>'
      + '<button class="small" style="margin-left:auto;background:#7a5230;color:#fff;" onclick="window.open(\'https://abc58255-hub.github.io/hongssam-classroom/lessons/graph-teacher.html\',\'_blank\')">📐 직선 그래프 열기</button></h2>'
      + '<div class="grid">' + cards + '</div>'
      + '<p style="font-size:12px;color:#64748b;margin-top:14px;">⚫ 숨김 = 학생에게 안 보임 · 🔥 진행 중 = 수업 시간 활동 · 🏁 자유 도전 = 종료 후 기록경쟁 · 📐 직선 그래프는 위 버튼으로 열어 방을 시작해요</p>'
      + '</div>';
  }

  function lgSet(i, field, val) {
    var g = LG_CACHE[i];
    if (!g || g[field] === val) return;
    g[field] = val;
    renderLessonView(); // 낙관적 반영
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { toast('저장 실패: ' + (res && res.message || '')); openLessonAdmin(); return; }
      toast('✅ 적용됨');
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); openLessonAdmin(); })
      .setLessonGame(TOKEN, { unit: g.unit, game: g.game, title: g.title, url: g.url, scope: g.scope, status: g.status });
  }

  // ══════════ 🔗 수업 링크 보드 (학생 대시보드 상단 카드) ══════════
  var LK_CACHE = [];
  function openLinkAdmin() {
    var main = document.getElementById('portalMain');
    main.innerHTML = '<div class="loading">불러오는 중...</div>';
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { main.innerHTML = '<div class="loading">오류: ' + esc(res && res.message || '') + '</div>'; return; }
      LK_CACHE = res.links || [];
      renderLinkView();
    }).withFailureHandler(function(e){ main.innerHTML = '<div class="loading">오류: ' + esc(e.message) + '</div>'; }).getLinks(TOKEN);
  }

  function _scopeLabel(sc) { return (!sc || sc === 'all') ? '🏫 전체' : '👥 ' + sc; }

  function renderLinkView() {
    var main = document.getElementById('portalMain');
    var rows = LK_CACHE.map(function(l) {
      var onColor = l.active ? 'background:#059669;color:white;' : 'background:#0f172a;color:#64748b;';
      return '<div class="card" style="cursor:default;">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'
          + '<span class="icon" style="font-size:22px;">🔗</span>'
          + '<a href="' + esc(l.url) + '" target="_blank" style="font-size:11px;color:#60a5fa;text-decoration:none;font-weight:700;">↗ 열어보기</a>'
        + '</div>'
        + '<h3 style="font-size:15px;margin-bottom:2px;">' + esc(l.title) + '</h3>'
        + '<p style="font-size:11px;margin-bottom:5px;word-break:break-all;">' + esc(l.url) + '</p>'
        + '<div style="font-size:11px;font-weight:800;color:#a5b4fc;margin-bottom:10px;">' + _scopeLabel(l.class_scope) + '</div>'
        + '<div style="display:flex;gap:5px;">'
          + '<button onclick="lkToggle(' + l.id + ')" style="flex:1;border:none;padding:8px 2px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;' + onColor + '">' + (l.active ? '✅ 공개 중' : '⚫ 비공개') + '</button>'
          + '<button onclick="lkEdit(' + l.id + ')" style="border:none;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;background:#2563eb;color:white;">✏️</button>'
          + '<button onclick="lkDelete(' + l.id + ')" style="border:none;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;background:#7f1d1d;color:#fecaca;">🗑</button>'
        + '</div>'
        + '</div>';
    }).join('');
    if (!rows) rows = '<div class="card off" style="cursor:default;"><span class="icon">🔗</span><h3>아직 링크가 없어요</h3><p>+ 링크 추가로 학생에게 보여줄 자료를 올려보세요.</p></div>';
    main.innerHTML = '<div class="group">'
      + '<h2 style="display:flex;align-items:center;gap:12px;text-transform:none;letter-spacing:0;">'
      + '<button class="small" onclick="loadPortal()">← 포털</button><span>🔗 수업 링크 관리</span>'
      + '<button class="small" style="margin-left:auto;background:#2563eb;color:white;" onclick="lkOpenForm()">+ 링크 추가</button></h2>'
      + '<div class="grid">' + rows + '</div>'
      + '<p style="font-size:12px;color:#64748b;margin-top:14px;">✅ 공개 중인 링크만 학생 수학앱 상단에 카드로 떠요 · 유튜브·슬라이드·데스모스 등 어떤 주소든 가능</p>'
      + '</div>';
  }

  // 링크 추가/수정 폼 (id 없으면 신규)
  function lkOpenForm(l) {
    l = l || { title: '', url: '', class_scope: 'all', active: true };
    var isClass = l.class_scope && l.class_scope !== 'all';
    var g = '', c = '';
    if (isClass) { var m = String(l.class_scope).match(/^(\d)학년 (\d+)반$/); if (m) { g = m[1]; c = m[2]; } }
    var gradeOpts = [1,2,3].map(function(x){ return '<option value="'+x+'"'+(String(x)===g?' selected':'')+'>'+x+'학년</option>'; }).join('');
    var classOpts = [];
    for (var i=1;i<=10;i++) classOpts.push('<option value="'+i+'"'+(String(i)===c?' selected':'')+'>'+i+'반</option>');
    var main = document.getElementById('portalMain');
    main.innerHTML = '<div class="group"><h2 style="text-transform:none;letter-spacing:0;">'
      + '<button class="small" onclick="openLinkAdmin()">← 목록</button> ' + (l.id ? '✏️ 링크 수정' : '+ 새 링크') + '</h2>'
      + '<div class="card" style="cursor:default;max-width:520px;">'
      + '<input type="hidden" id="lkId" value="' + (l.id || '') + '">'
      + '<label style="font-size:12px;font-weight:800;color:#94a3b8;">제목</label>'
      + '<input id="lkTitle" value="' + esc(l.title) + '" placeholder="예: 오늘의 데스모스 활동" style="width:100%;box-sizing:border-box;margin:6px 0 14px;padding:11px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;">'
      + '<label style="font-size:12px;font-weight:800;color:#94a3b8;">링크 주소(URL)</label>'
      + '<input id="lkUrl" value="' + esc(l.url) + '" placeholder="https://..." style="width:100%;box-sizing:border-box;margin:6px 0 14px;padding:11px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;">'
      + '<label style="font-size:12px;font-weight:800;color:#94a3b8;">보여줄 대상</label>'
      + '<div style="display:flex;gap:8px;margin:6px 0 14px;align-items:center;flex-wrap:wrap;">'
        + '<select id="lkScopeType" onchange="document.getElementById(\'lkClassBox\').style.display=this.value===\'class\'?\'flex\':\'none\'" style="padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;">'
          + '<option value="all"' + (!isClass?' selected':'') + '>🏫 전체 공통</option>'
          + '<option value="class"' + (isClass?' selected':'') + '>👥 특정 반</option></select>'
        + '<div id="lkClassBox" style="display:' + (isClass?'flex':'none') + ';gap:6px;">'
          + '<select id="lkGrade" style="padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;">' + gradeOpts + '</select>'
          + '<select id="lkClass" style="padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;">' + classOpts.join('') + '</select>'
        + '</div>'
      + '</div>'
      + '<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:16px;"><input type="checkbox" id="lkActive"' + (l.active!==false?' checked':'') + ' style="width:18px;height:18px;"> 바로 공개 (체크 해제 시 비공개로 저장)</label>'
      + '<button onclick="lkSave()" style="width:100%;border:none;background:#2563eb;color:white;padding:13px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;">💾 저장</button>'
      + '</div></div>';
  }

  function lkSave() {
    var scopeType = document.getElementById('lkScopeType').value;
    var scope = 'all';
    if (scopeType === 'class') scope = document.getElementById('lkGrade').value + '학년 ' + document.getElementById('lkClass').value + '반';
    var link = {
      id: document.getElementById('lkId').value || undefined,
      title: document.getElementById('lkTitle').value.trim(),
      url: document.getElementById('lkUrl').value.trim(),
      class_scope: scope,
      active: document.getElementById('lkActive').checked
    };
    if (!link.title || !link.url) { toast('제목과 URL을 입력해주세요.'); return; }
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { toast('저장 실패: ' + (res && res.message || '')); return; }
      toast('✅ 저장됨'); openLinkAdmin();
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).saveLink(TOKEN, link);
  }

  function lkEdit(id) { var l = LK_CACHE.find(function(x){ return x.id === id; }); if (l) lkOpenForm(l); }
  function lkToggle(id) {
    var l = LK_CACHE.find(function(x){ return x.id === id; }); if (!l) return;
    l.active = !l.active; renderLinkView();
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) { toast('실패: ' + (res && res.message || '')); openLinkAdmin(); return; }
      toast(l.active ? '✅ 공개' : '⚫ 비공개');
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); openLinkAdmin(); })
      .saveLink(TOKEN, { id: l.id, title: l.title, url: l.url, class_scope: l.class_scope, active: l.active });
  }
  function lkDelete(id) {
    var l = LK_CACHE.find(function(x){ return x.id === id; }); if (!l) return;
    if (!confirm('「' + l.title + '」 링크를 삭제할까요?')) return;
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) { toast('삭제 실패: ' + (res && res.message || '')); return; }
      toast('🗑 삭제됨'); openLinkAdmin();
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).deleteLink(TOKEN, id);
  }

  // ── 📊 기록 관리 (기록 목록·삭제·전체 리셋) ──
  var LS_GAME = null;
  function openLessonScores(i) {
    LS_GAME = LG_CACHE[i];
    var main = document.getElementById('portalMain');
    main.innerHTML = '<div class="loading">기록 불러오는 중...</div>';
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { toast('오류: ' + (res && res.message || '')); renderLessonView(); return; }
      renderScoresView(res.scores || []);
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); renderLessonView(); })
      .lessonScores(TOKEN, LS_GAME.unit, LS_GAME.game);
  }
  function renderScoresView(scores) {
    var main = document.getElementById('portalMain');
    var rows = scores.map(function(r, idx) {
      var st = r.students || {};
      var d = String(r.created_at || '').substring(5, 10).replace('-', '/');
      return '<div style="display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #1e293b;font-size:13px;">'
        + '<span style="width:26px;text-align:center;font-weight:900;color:#64748b;">' + (idx + 1) + '</span>'
        + '<span style="flex:1;font-weight:700;">' + esc(st.name || r.student_id) + ' <span style="font-size:11px;color:#64748b;">' + esc(st.class_name || '') + ' · ' + d + '</span></span>'
        + '<span style="font-weight:900;color:#60a5fa;">' + r.score + '점</span>'
        + '<button class="small" style="padding:5px 9px;" onclick="lsDelete(' + r.id + ')">🗑</button>'
        + '</div>';
    }).join('') || '<p style="color:#64748b;font-size:13px;padding:14px;">기록이 없어요.</p>';
    main.innerHTML = '<div class="group">'
      + '<h2 style="display:flex;align-items:center;gap:12px;text-transform:none;letter-spacing:0;flex-wrap:wrap;">'
      + '<button class="small" onclick="openLessonAdmin()">← 관리</button>'
      + '<span>📊 ' + esc(LS_GAME.title || LS_GAME.game) + ' 기록 (' + scores.length + '건)</span>'
      + '<span style="flex:1"></span>'
      + '<button class="small" style="color:#f87171;" onclick="lsReset()">🧹 전체 리셋</button></h2>'
      + '<div style="background:#1e293b;border:1px solid #334155;border-radius:14px;padding:10px 14px;max-width:640px;">' + rows + '</div>'
      + '<p style="font-size:12px;color:#64748b;margin-top:12px;">이상한 기록(조작·장난)은 🗑 로 삭제하세요. 등수판은 최고점 기준이라 삭제하면 그 학생의 다음 기록이 반영돼요.</p>'
      + '</div>';
  }
  function lsDelete(id) {
    if (!confirm('이 기록을 삭제할까요?')) return;
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { toast('삭제 실패: ' + (res && res.message || '')); return; }
      toast('🗑 삭제됨');
      var idx = LG_CACHE.indexOf(LS_GAME);
      openLessonScores(idx >= 0 ? idx : 0);
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).lessonDeleteScore(TOKEN, id);
  }
  function lsReset() {
    if (!confirm('「' + (LS_GAME.title || LS_GAME.game) + '」의 모든 기록을 삭제할까요?\n등수판이 완전히 초기화됩니다. 되돌릴 수 없어요!')) return;
    google.script.run.withSuccessHandler(function(res) {
      if (!res || !res.success) { toast('리셋 실패: ' + (res && res.message || '')); return; }
      toast('🧹 ' + (res.deleted || 0) + '건 삭제 완료');
      openLessonAdmin();
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).lessonResetGame(TOKEN, LS_GAME.unit, LS_GAME.game);
  }


  // ══════════ 🔔 교사 푸시 알림 등록 (앱 내 통합 — teacher.html과 동일 흐름) ══════════
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  try { if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); } catch(_) {}

  function openPushSetup() {
    var done = localStorage.getItem('portal_push_done') === '1';
    var body;
    if (isIOS && !isStandalone) {
      // iOS는 홈 화면에 설치된 앱에서만 푸시 가능
      body = '<p style="color:#94a3b8;font-size:14px;line-height:1.7;margin:10px 0 4px;">'
        + ' 아이폰·아이패드는 <b style="color:#e2e8f0;">홈 화면에 추가한 앱에서만</b> 알림을 받을 수 있어요.<br><br>'
        + '1️⃣ Safari 하단 <b style="color:#e2e8f0;">공유 버튼(□↑)</b> 탭<br>'
        + '2️⃣ <b style="color:#e2e8f0;">"홈 화면에 추가"</b> 선택<br>'
        + '3️⃣ 홈 화면의 <b style="color:#e2e8f0;">교사포털 아이콘</b>으로 다시 열기<br>'
        + '4️⃣ 이 버튼을 다시 누르면 등록 완료!</p>';
    } else {
      body = (done ? '<p style="color:#4ade80;font-size:13px;margin:8px 0;">✅ 이 기기는 이미 등록돼 있어요. 다시 등록해도 괜찮아요.</p>' : '')
        + '<p style="color:#94a3b8;font-size:13px;margin:8px 0 12px;">학생 제출·재제출·답글 알림을 이 기기로 받아요.<br>확인을 위해 교사 비밀번호를 입력해주세요.</p>'
        + '<input type="password" id="pushPw" placeholder="교사 비밀번호">'
        + '<div id="pushStatus" style="font-size:13px;color:#94a3b8;margin-top:10px;min-height:18px;"></div>'
        + '<button class="btn" style="margin-top:12px;" onclick="registerTeacherPush()">🔔 알림 등록하기</button>';
    }
    document.getElementById('modalArea').innerHTML =
      '<div class="modal-bg" onclick="if(event.target===this)closePw()"><div class="modal">'
      + '<h2>🔔 알림 설정</h2>' + body
      + '<div style="text-align:right;margin-top:14px;"><button class="small" onclick="closePw()">닫기</button></div>'
      + '</div></div>';
  }

  function _pushStatus(msg, isErr) {
    var el = document.getElementById('pushStatus');
    if (el) { el.textContent = msg; el.style.color = isErr ? '#f87171' : '#94a3b8'; }
  }

  async function sha256(text) {
    var buf = new TextEncoder().encode(text);
    var hashBuf = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hashBuf)).map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
  }

  async function registerTeacherPush() {
    var password = document.getElementById('pushPw').value;
    if (!password) { _pushStatus('교사 비밀번호를 입력해주세요', true); return; }

    // ⚠️ 알림 권한은 사용자 제스처 유지를 위해 가장 먼저 요청
    _pushStatus('알림 권한 요청 중...');
    var permissionPromise;
    try { permissionPromise = Notification.requestPermission(); }
    catch(e) { permissionPromise = new Promise(function(res){ Notification.requestPermission(res); }); }

    var pwHash;
    try { pwHash = await sha256(password); }
    catch(e) { _pushStatus('암호화 오류: ' + e.message, true); return; }

    var permission = await permissionPromise;
    if (permission !== 'granted') { _pushStatus('❌ 알림이 거부됐어요. 기기 설정에서 알림을 허용해주세요.', true); return; }

    _pushStatus('알림 워커 등록 중...');
    var reg;
    try { reg = await navigator.serviceWorker.register('../firebase-messaging-sw.js'); }
    catch(e) { _pushStatus('서비스워커 오류: ' + e.message, true); return; }

    _pushStatus('토큰 발급 중...');
    var token;
    try {
      var messaging = firebase.messaging();
      token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      if (!token) throw new Error('토큰을 받지 못했습니다');
    } catch(e) { _pushStatus('토큰 오류: ' + e.message, true); return; }

    _pushStatus('서버에 저장 중...');
    try {
      var deviceId = localStorage.getItem('fcm_device_id');
      if (!deviceId) {
        deviceId = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('fcm_device_id', deviceId);
      }
      var url = TOKEN_GAS_URL
        + '?action=saveTeacherFcmToken'
        + '&token=' + encodeURIComponent(token)
        + '&pwHash=' + encodeURIComponent(pwHash)
        + '&deviceId=' + encodeURIComponent(deviceId);
      var res = await fetch(url);
      var result = await res.json();
      if (!result.success) { _pushStatus('❌ ' + (result.message || '저장 실패'), true); return; }
    } catch(e) { _pushStatus('저장 오류: ' + e.message, true); return; }

    localStorage.setItem('portal_push_done', '1');
    _pushStatus('');
    closePw();
    toast('🔔 알림 등록 완료! 학생 활동 알림이 이 기기로 와요');
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  checkSession();
</script>
