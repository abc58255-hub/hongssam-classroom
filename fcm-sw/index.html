<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="홍쌤 알림">
  <link rel="manifest" href="manifest.json">
  <title>홍쌤 교실 알림 등록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(160deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 28px; padding: 28px 22px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(76,29,149,0.35); }
    h1 { font-size: 22px; color: #1e3a8a; margin-bottom: 8px; }
    .sub { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }

    /* iOS 안내 — 새 디자인 */
    .hero { text-align: center; margin-bottom: 22px; }
    .hero-bell { font-size: 60px; display: inline-block; animation: ring 2.5s ease-in-out infinite; transform-origin: 50% 0; }
    @keyframes ring { 0%,70%,100%{transform:rotate(0);} 75%{transform:rotate(14deg);} 80%{transform:rotate(-12deg);} 85%{transform:rotate(9deg);} 90%{transform:rotate(-6deg);} 95%{transform:rotate(3deg);} }
    .hero h1 { font-size: 23px; background: linear-gradient(135deg,#6366f1,#ec4899); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin: 6px 0 8px; font-weight: 900; }
    .hero-sub { color: #64748b; font-size: 14px; line-height: 1.6; }
    .ios-step { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg,#f5f3ff,#faf5ff); border: 1.5px solid #ede9fe; border-radius: 18px; padding: 14px 16px; margin-bottom: 11px; }
    .ios-step-badge { flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(99,102,241,0.25); }
    .ios-step-body { flex: 1; min-width: 0; }
    .ios-step-num { font-size: 11px; font-weight: 800; color: #8b5cf6; letter-spacing: 0.5px; }
    .ios-step-text { font-size: 14px; color: #334155; line-height: 1.45; margin-top: 2px; }
    .ios-step-text b { color: #6d28d9; }
    .point-down { text-align: center; margin-top: 18px; }
    .point-arrow { font-size: 26px; color: #8b5cf6; animation: bounce 1.4s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0);opacity:0.6;} 50%{transform:translateY(8px);opacity:1;} }
    .point-text { font-size: 12px; color: #94a3b8; font-weight: 700; margin-top: 2px; }

    input { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 14px; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #8b5cf6; }
    button.primary { width: 100%; padding: 16px; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 18px rgba(99,102,241,0.35); }
    button.primary:active { transform: scale(0.98); }
    button.secondary { width: 100%; padding: 14px; background: #f5f3ff; color: #7c3aed; border: none; border-radius: 14px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 12px; font-size: 13px; color: #64748b; text-align: center; min-height: 20px; }
    #status.error { color: #dc2626; }
    #success { text-align: center; }
    #success .icon { font-size: 72px; margin-bottom: 16px; animation: pop 0.5s cubic-bezier(0.18,0.89,0.32,1.28); }
    @keyframes pop { 0%{transform:scale(0);} 100%{transform:scale(1);} }
    #success h2 { color: #16a34a; margin-bottom: 8px; }
    #success p { color: #64748b; font-size: 14px; line-height: 1.6; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="card">

  <!-- iOS 비PWA: 홈 화면 추가 안내 -->
  <div id="iosGuide" class="hidden">
    <div class="hero">
      <div class="hero-bell">🔔</div>
      <h1>홍쌤 교실 알림</h1>
      <p class="hero-sub">알림을 받으려면 홈 화면에 추가하면 돼요!<br>딱 한 번만 하면 끝 😊</p>
    </div>

    <div class="ios-step">
      <div class="ios-step-badge" style="background:linear-gradient(135deg,#3b82f6,#2563eb);">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 L12 14"/><path d="M8 7 L12 3 L16 7"/>
          <path d="M6 11 L5 11 Q4 11 4 12 L4 20 Q4 21 5 21 L19 21 Q20 21 20 20 L20 12 Q20 11 19 11 L18 11"/>
        </svg>
      </div>
      <div class="ios-step-body">
        <div class="ios-step-num">STEP 1</div>
        <div class="ios-step-text">화면 아래 <b>공유 버튼</b>을 눌러요</div>
      </div>
    </div>

    <div class="ios-step">
      <div class="ios-step-badge" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8 L12 16"/><path d="M8 12 L16 12"/>
        </svg>
      </div>
      <div class="ios-step-body">
        <div class="ios-step-num">STEP 2</div>
        <div class="ios-step-text"><b>"홈 화면에 추가"</b>를 선택해요</div>
      </div>
    </div>

    <div class="ios-step">
      <div class="ios-step-badge" style="background:linear-gradient(135deg,#ec4899,#db2777);">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11 L12 3 L21 11"/><path d="M5 10 L5 20 L19 20 L19 10"/><path d="M9 20 L9 14 L15 14 L15 20"/>
        </svg>
      </div>
      <div class="ios-step-body">
        <div class="ios-step-num">STEP 3</div>
        <div class="ios-step-text">홈 화면에 생긴 <b>앱 아이콘</b>으로 다시 열어요</div>
      </div>
    </div>

    <div class="point-down">
      <div class="point-arrow">⬇︎</div>
      <div class="point-text">공유 버튼은 화면 맨 아래에 있어요</div>
    </div>
  </div>

  <!-- 등록 폼 (Android or iOS 홈화면 모드) -->
  <div id="formSection" class="hidden">
    <h1>🔔 홍쌤 교실 알림</h1>
    <p class="sub">학번과 비밀번호를 입력하고 알림을 허용하면 선생님이 보내는 알림을 받을 수 있어요.</p>
    <input type="text" id="studentId" placeholder="학번 입력 (예: 21001)" maxlength="10" inputmode="numeric">
    <input type="password" id="password" placeholder="비밀번호 입력">
    <button class="primary" onclick="register()">알림 등록하기</button>
    <div id="status"></div>
  </div>

  <!-- 성공 화면 -->
  <div id="success" class="hidden">
    <div class="icon">✅</div>
    <h2>알림 등록 완료!</h2>
    <p>이제 홍쌤 교실에서 알림을 받을 수 있어요.</p>
    <button class="secondary" onclick="goToMathApp()">📚 수학 과제 제출기로 이동 ▶</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
<script src="./config.js"></script>
<script>
  var urlParams = new URLSearchParams(window.location.search);
  var GAS_URL = urlParams.get('gas') || '';
  var MATH_APP_URL = GAS_URL;
  var prefilledId = urlParams.get('sid') || '';

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  if (isIOS && !isStandalone) {
    document.getElementById('iosGuide').classList.remove('hidden');
  } else {
    document.getElementById('formSection').classList.remove('hidden');
    if (prefilledId) document.getElementById('studentId').value = prefilledId;
  }

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  var messaging = firebase.messaging();

  function setStatus(msg, isError) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function goToMathApp() {
    window.location.href = MATH_APP_URL;
  }

  // SHA-256 해시 (SubtleCrypto)
  async function sha256(text) {
    var buf = new TextEncoder().encode(text);
    var hashBuf = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hashBuf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  // JSONP 방식으로 GAS 호출 (응답 읽기 가능)
  function callGasJsonp(url) {
    return new Promise(function(resolve, reject) {
      var cbName = 'fcm_cb_' + Date.now();
      var script = document.createElement('script');
      var timer = setTimeout(function() {
        cleanup();
        reject(new Error('요청 시간 초과'));
      }, 15000);
      function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function(data) { cleanup(); resolve(data); };
      script.onerror = function() { cleanup(); reject(new Error('네트워크 오류')); };
      script.src = url + '&callback=' + cbName;
      document.head.appendChild(script);
    });
  }

  async function register() {
    var studentId = document.getElementById('studentId').value.trim();
    var password = document.getElementById('password').value;
    if (!studentId) { alert('학번을 입력해주세요'); return; }
    if (!password) { alert('비밀번호를 입력해주세요'); return; }

    // ⚠️ 알림 권한은 user gesture 유지를 위해 가장 먼저 동기적으로 요청
    // (Galaxy Chrome은 await 후 호출 시 "이 사이트에서는 권한을 요청할 수 없음" 에러 발생)
    setStatus('알림 권한 요청 중...');
    var permissionPromise;
    try {
      permissionPromise = Notification.requestPermission();
    } catch(e) {
      permissionPromise = new Promise(function(res) { Notification.requestPermission(res); });
    }

    setStatus('비밀번호 확인 중...');
    var pwHash;
    try {
      pwHash = await sha256(password);
    } catch(e) {
      setStatus('SHA-256 오류: ' + e.message, true);
      return;
    }

    var permission = await permissionPromise;
    if (permission !== 'granted') {
      setStatus('❌ 알림이 거부되었습니다. 설정에서 알림을 허용해주세요.', true);
      return;
    }

    setStatus('서비스워커 등록 중...');
    var reg;
    try {
      reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    } catch(e) {
      setStatus('서비스워커 오류: ' + e.message, true);
      return;
    }

    setStatus('토큰 발급 중...');
    var token;
    try {
      token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      if (!token) throw new Error('토큰을 받지 못했습니다');
    } catch(e) {
      setStatus('토큰 오류: ' + e.message, true);
      return;
    }

    setStatus('서버에 저장 중...');
    try {
      var url = GAS_URL
        + '?action=saveFcmToken'
        + '&studentId=' + encodeURIComponent(studentId)
        + '&token=' + encodeURIComponent(token)
        + '&pwHash=' + encodeURIComponent(pwHash);
      var result = await callGasJsonp(url);
      if (!result.success) {
        setStatus('❌ ' + (result.message || '저장 실패'), true);
        return;
      }
    } catch(e) {
      setStatus('저장 오류: ' + e.message, true);
      return;
    }

    localStorage.setItem('fcm_registered_ios_' + studentId, '1');
    document.getElementById('formSection').classList.add('hidden');
    document.getElementById('success').classList.remove('hidden');
  }
</script>
</body>
</html>
