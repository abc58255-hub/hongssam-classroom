<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="apple-touch-icon" href="./icon-ai-180.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 업무분석">
  <meta name="theme-color" content="#7c3aed">
  <script>
    var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbyr9AOmkCM9BE1yh_dL8Ed1yGwRAHIRE-6hebdLWFe6GBJytIPF7bLkVYV9e-wdQ8Id/exec';
    (function () {
      var FNS = ["addToTickTick", "analyzeTaskText", "exchangeTickTickCode", "getTickTickAuthUrl", "getTickTickProjects", "getTickTickStatus", "teacherLogin", "teacherLogout", "validateTeacherSession"];
      var TOKKEY = 'ai_token';
      function makeRunner() {
        var ok = function () {}, fail = function (e) { console.error('[RPC]', e); };
        var r = {};
        r.withSuccessHandler = function (fn) { if (fn) ok = fn; return r; };
        r.withFailureHandler = function (fn) { if (fn) fail = fn; return r; };
        FNS.forEach(function (name) {
          r[name] = function () {
            var args = Array.prototype.slice.call(arguments);
            var body = { fn: name, args: args };
            if (TOKKEY) { try { body.token = localStorage.getItem(TOKKEY) || ''; } catch (_) {} }
            fetch(GAS_EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
              .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
              .then(function (data) { if (data && data.ok) return data.result; throw new Error((data && data.error) || '서버 오류'); })
              .then(function (result) { ok(result); }, function (e) { fail(e); });
          };
        });
        return r;
      }
      var s = {}; Object.defineProperty(s, 'run', { get: makeRunner }); window.google = { script: s };
    })();
  </script>

<base target="_top">
<meta charset="UTF-8">
<title>AI 업무분석</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; background: #f1f5f9; color: #0f172a; }
  .hidden { display: none !important; }

  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #db2777, #9d174d); }
  .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); width: 340px; text-align: center; }
  .login-card h1 { font-size: 22px; margin-bottom: 6px; }
  .login-card p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 13px 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; margin-bottom: 14px; }
  .login-card input:focus { outline: none; border-color: #db2777; }

  .btn { background: #db2777; color: white; border: none; padding: 13px 20px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn:hover { background: #be185d; }
  .btn.sm { padding: 8px 14px; font-size: 13px; }
  .btn.gray { background: #64748b; } .btn.gray:hover { background: #475569; }
  .btn.green { background: #16a34a; } .btn.green:hover { background: #15803d; }
  .btn.block { width: 100%; }

  header { background: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 18px; }
  header .spacer { flex: 1; }
  .chip { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 20px; }
  .chip.on { background: #dcfce7; color: #16a34a; }
  .chip.off { background: #fee2e2; color: #dc2626; }
  main { padding: 24px; max-width: 900px; margin: 0 auto; }
  .panel { background: white; border-radius: 14px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin: 0 0 6px; }
  textarea, input[type=text], select { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: inherit; }
  textarea:focus, input:focus, select:focus { outline: none; border-color: #db2777; }
  textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  .dropzone { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 14px; text-align: center; color: #94a3b8; font-size: 13px; margin-top: 10px; cursor: pointer; }
  .dropzone.has { border-color: #db2777; color: #db2777; background: #fdf2f8; }
  .muted { color: #64748b; font-size: 13px; }

  .summary-box { background: #fdf2f8; border: 1px solid #fbcfe8; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
  .caution-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #92400e; }
  .task-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .task-card h3 { font-size: 16px; margin-bottom: 6px; }
  .task-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 16px; }
  .badge.date { background: #dbeafe; color: #1d4ed8; }
  .badge.p5 { background: #fee2e2; color: #dc2626; }
  .badge.p3 { background: #fef3c7; color: #b45309; }
  .badge.p1 { background: #f1f5f9; color: #64748b; }
  .badge.tag { background: #f3e8ff; color: #7c3aed; }
  .task-detail { font-size: 13px; color: #334155; white-space: pre-wrap; line-height: 1.6; margin: 6px 0; }
  .checklist { font-size: 13px; color: #475569; margin: 6px 0; }
  .checklist li { margin-left: 18px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 700; z-index: 100; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: white; border-radius: 16px; padding: 24px; width: 420px; max-width: 92vw; max-height: 88vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 14px; }
  .modal .row { margin-bottom: 14px; }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>🤖 AI 업무분석</h1>
    <p>교사 비밀번호로 로그인하세요</p>
    <input type="password" id="pw" placeholder="교사 비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn block" onclick="doLogin()">로그인</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🤖 AI 업무분석</h1>
    <span class="chip off" id="ttChip">TickTick 확인중</span>
    <div class="spacer"></div>
    <button class="btn sm gray" onclick="openSettings()">⚙️ 설정</button>
    <button class="btn sm gray" onclick="doLogout()">로그아웃</button>
  </header>

  <main>
    <div class="panel">
      <label>공문·메시지 붙여넣기 <span class="muted">(사진/캡처도 첨부 가능 — 아래 영역에 끌어다 놓거나 Ctrl+V)</span></label>
      <textarea id="taskInput" placeholder="공문·메시지를 붙여넣거나, 사진을 첨부하세요.&#10;사진만 첨부해도 AI가 일정을 자동 추출해요."></textarea>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">📎 사진/파일 첨부 (클릭 또는 드래그/붙여넣기)</div>
      <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf,.txt" onchange="handleFile(this.files[0])">
      <div style="margin-top:14px; display:flex; gap:10px;">
        <button class="btn" id="analyzeBtn" onclick="analyze()">🔍 AI 분석</button>
        <button class="btn sm gray" onclick="clearInput()">초기화</button>
      </div>
    </div>

    <div id="result"></div>
  </main>
</div>

<div id="modalArea"></div>
<div class="toast" id="toast"></div>

<script>
  var TOKEN = localStorage.getItem('ai_token') || '';
  var ATTACH = null;       // {name, mimeType, data}
  var LAST_RESULT = null;  // 분석 결과
  var TT_PROJECTS = [];
  var TT_CONNECTED = false;

  function doLogin() {
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success && res.token) { TOKEN = res.token; localStorage.setItem('ai_token', TOKEN); showApp(); }
      else toast(res && res.message ? res.message : '비밀번호가 틀렸습니다');
    }).withFailureHandler(function(e){ toast('오류: ' + e.message); }).teacherLogin(pw);
  }
  function doLogout() {
    google.script.run.teacherLogout(TOKEN);
    localStorage.removeItem('ai_token'); TOKEN = '';
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
  }
  function checkSession() {
    if (!TOKEN) return;
    google.script.run.withSuccessHandler(function(res){ if (res && res.success) showApp(); }).validateTeacherSession(TOKEN);
  }
  function showApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    refreshStatus();
  }

  function refreshStatus() {
    google.script.run.withSuccessHandler(function(res) {
      var chip = document.getElementById('ttChip');
      TT_CONNECTED = !!(res && res.connected);
      if (!res || !res.hasApiKey) { chip.className = 'chip off'; chip.textContent = '⚠️ AI키 없음'; return; }
      if (TT_CONNECTED) {
        chip.className = 'chip on'; chip.textContent = '✅ TickTick 연동됨';
        google.script.run.withSuccessHandler(function(r){ if (r && r.success) TT_PROJECTS = r.projects || []; }).getTickTickProjects();
      } else { chip.className = 'chip off'; chip.textContent = '🔌 TickTick 미연동'; }
    }).getTickTickStatus();
  }

  // ── 파일 첨부 ──
  function handleFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var b64 = String(e.target.result).split(',')[1];
      ATTACH = { name: file.name, mimeType: file.type, data: b64 };
      var dz = document.getElementById('dropzone');
      dz.classList.add('has'); dz.textContent = '📎 첨부됨: ' + file.name + ' (클릭하면 변경)';
    };
    reader.readAsDataURL(file);
  }
  function clearInput() {
    document.getElementById('taskInput').value = '';
    ATTACH = null;
    var dz = document.getElementById('dropzone');
    dz.classList.remove('has'); dz.textContent = '📎 사진/파일 첨부 (클릭 또는 드래그/붙여넣기)';
    document.getElementById('result').innerHTML = '';
  }

  // 드래그 & 붙여넣기
  var dz = null;
  window.addEventListener('DOMContentLoaded', function() {
    dz = document.getElementById('dropzone');
    ['dragover','dragenter'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('has'); }); });
    dz.addEventListener('drop', function(e){ e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    document.addEventListener('paste', function(e){
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') === 0) { handleFile(items[i].getAsFile()); e.preventDefault(); break; }
      }
    });
  });

  // ── 분석 ──
  function analyze() {
    var text = document.getElementById('taskInput').value.trim();
    if (!text && !ATTACH) { toast('내용을 입력하거나 사진을 첨부하세요'); return; }
    var btn = document.getElementById('analyzeBtn');
    btn.disabled = true; btn.textContent = '분석 중... (최대 30초)';
    document.getElementById('result').innerHTML = '<div class="panel"><p class="muted">🤖 AI가 분석하고 있어요...</p></div>';
    google.script.run.withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = '🔍 AI 분석';
      if (!res || !res.success) { document.getElementById('result').innerHTML = '<div class="panel"><p style="color:#dc2626;">분석 실패: ' + esc(res && res.message || '오류') + '</p></div>'; return; }
      LAST_RESULT = res.result;
      renderResult(res.result, res.model);
    }).withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = '🔍 AI 분석';
      document.getElementById('result').innerHTML = '<div class="panel"><p style="color:#dc2626;">오류: ' + esc(e.message) + '</p></div>';
    }).analyzeTaskText(text, ATTACH);
  }

  function renderResult(r, model) {
    var tasks = r.tasks || [];
    var h = '<div class="panel">';
    if (r.summary) h += '<div class="summary-box"><b>📌 요약</b>\n' + esc(r.summary) + '</div>';
    if (Array.isArray(r.cautions) && r.cautions.length) {
      h += '<div class="caution-box"><b>⚠️ 주의</b><br>' + r.cautions.map(function(c){ return '· ' + esc(c); }).join('<br>') + '</div>';
    }
    h += '<div style="display:flex;align-items:center;gap:10px;margin:8px 0 14px;"><b style="font-size:15px;">📋 할 일 ' + tasks.length + '개</b>';
    if (tasks.length) h += '<button class="btn sm green" onclick="addAll()">⊕ 전체 TickTick 추가</button>';
    h += '<span class="muted" style="margin-left:auto;">' + esc(model || '') + '</span></div>';

    tasks.forEach(function(t, idx) {
      var pri = parseInt(t.priority) || 1;
      var pcls = pri >= 5 ? 'p5' : (pri >= 3 ? 'p3' : 'p1');
      var pl = pri >= 5 ? '🔴 매우긴급' : (pri >= 3 ? '🟡 보통' : '⚪ 낮음');
      h += '<div class="task-card">';
      h += '<h3>' + esc(t.title || '제목 없음') + '</h3>';
      h += '<div class="task-meta">';
      if (t.deadline) h += '<span class="badge date">📅 ' + esc(t.deadline) + (t.time ? ' ' + esc(t.time) : '') + '</span>';
      h += '<span class="badge ' + pcls + '">' + pl + '</span>';
      if (t.project) h += '<span class="badge tag">' + esc(t.project) + '</span>';
      (t.tags || []).forEach(function(tg){ h += '<span class="badge tag">#' + esc(tg) + '</span>'; });
      h += '</div>';
      if (t.detail) h += '<div class="task-detail">' + esc(t.detail) + '</div>';
      if (Array.isArray(t.checklist) && t.checklist.length) {
        h += '<ul class="checklist">' + t.checklist.map(function(c){ return '<li>☐ ' + esc(c) + '</li>'; }).join('') + '</ul>';
      }
      h += '<button class="btn sm" id="ttbtn' + idx + '" onclick="addOne(' + idx + ')">⊕ TickTick 추가</button>';
      h += '</div>';
    });
    h += '</div>';
    document.getElementById('result').innerHTML = h;
  }

  // ── TickTick 추가 ──
  function _withProject(t) {
    if (TT_PROJECTS.length && !t.projectId) {
      // 프로젝트명이 분류와 일치하면 매칭
      var match = TT_PROJECTS.filter(function(p){ return p.name === t.project; })[0];
      if (match) t.projectId = match.id;
    }
    return t;
  }
  function addOne(idx) {
    if (!TT_CONNECTED) { toast('먼저 ⚙️ 설정에서 TickTick을 연동하세요'); return; }
    var t = _withProject(LAST_RESULT.tasks[idx]);
    var btn = document.getElementById('ttbtn' + idx);
    if (btn) { btn.disabled = true; btn.textContent = '추가 중...'; }
    google.script.run.withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.textContent = res && res.success ? '✅ 추가됨' : '⊕ TickTick 추가'; if (res && res.success) btn.className = 'btn sm green'; }
      toast(res && res.success ? '추가됨' : ('실패: ' + (res && res.message || '오류')));
    }).withFailureHandler(function(e){ if (btn) { btn.disabled = false; btn.textContent = '⊕ TickTick 추가'; } toast('오류: ' + e.message); }).addToTickTick(t);
  }
  function addAll() {
    if (!TT_CONNECTED) { toast('먼저 ⚙️ 설정에서 TickTick을 연동하세요'); return; }
    var tasks = (LAST_RESULT && LAST_RESULT.tasks) || [];
    if (!tasks.length) return;
    var i = 0, ok = 0;
    function next() {
      if (i >= tasks.length) { toast(ok + '/' + tasks.length + '개 추가 완료'); return; }
      google.script.run.withSuccessHandler(function(res){ if (res && res.success) ok++; i++; next(); })
        .withFailureHandler(function(){ i++; next(); })
        .addToTickTick(_withProject(tasks[i]));
    }
    toast('전체 추가 중...'); next();
  }

  // ── 설정 모달 (TickTick 연동 / 키 이전) ──
  function openSettings() {
    var h = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">' +
      '<h2>⚙️ 설정</h2>' +
      '<div class="row"><label>🔗 TickTick 연동</label>' +
      '<p class="muted" style="margin-bottom:8px;">① 인증 링크 열기 → 허용 → 주소창의 <b>code=</b> 값 복사 → ② 아래 붙여넣고 연결</p>' +
      '<button class="btn sm" onclick="openTtAuth()">① TickTick 인증 링크 열기</button>' +
      '<div style="margin-top:10px;display:flex;gap:8px;">' +
      '<input type="text" id="ttCode" placeholder="code= 값 붙여넣기" style="flex:1;">' +
      '<button class="btn sm green" onclick="connectTt()">② 연결</button></div></div>' +
      '<div style="text-align:right;margin-top:8px;"><button class="btn sm gray" onclick="closeModal()">닫기</button></div>' +
      '</div></div>';
    document.getElementById('modalArea').innerHTML = h;
  }
  function closeModal() { document.getElementById('modalArea').innerHTML = ''; }
  function openTtAuth() {
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success) window.open(res.authUrl, '_blank');
      else toast(res && res.message ? res.message : '인증 URL 생성 실패');
    }).getTickTickAuthUrl();
  }
  function connectTt() {
    var code = document.getElementById('ttCode').value.trim();
    var m = code.match(/code=([^&]+)/); if (m) code = m[1];
    if (!code) { toast('code 값을 입력하세요'); return; }
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success) { toast('TickTick 연동 완료'); closeModal(); refreshStatus(); }
      else toast('실패: ' + (res && res.message || '오류'));
    }).exchangeTickTickCode(code);
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2500); }

  checkSession();
</script>
