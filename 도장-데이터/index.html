<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍쌤 도장-데이터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
         background: #f1f5f9; color: #1e293b; padding: 16px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; color: #6d28d9; display: flex; align-items: center; gap: 8px; }
  h1 .sub { font-size: 12px; color: #94a3b8; font-weight: 400; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
  select, button { font-size: 13px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
                   background: #fff; color: #1e293b; cursor: pointer; outline: none; }
  button.primary { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  button.toggle.on { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
  .spacer { flex: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 14px;
          font-size: 13px; display: flex; gap: 6px; align-items: baseline; }
  .chip b { font-size: 18px; color: #6d28d9; }
  .chip.warn b { color: #dc2626; }

  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 10px; text-align: center; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
  th { background: #f8fafc; color: #475569; font-weight: 600; position: sticky; top: 0; z-index: 1; }
  td.name { text-align: left; font-weight: 600; cursor: pointer; color: #6d28d9; }
  td.info { text-align: left; color: #64748b; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: #faf5ff; }
  tr.stale td { background: #fef2f2; }
  tr.stale:hover td { background: #fee2e2; }
  .b-present { font-weight: 700; color: #7c3aed; }
  .b-praise { color: #0d9488; }
  .badge { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: 999px; font-size: 12px; }
  .rank { color: #475569; font-variant-numeric: tabular-nums; }
  .elapsed-ok { color: #16a34a; }
  .elapsed-warn { color: #d97706; font-weight: 600; }
  .elapsed-bad { color: #dc2626; font-weight: 700; }
  .warnico { color: #dc2626; font-weight: 700; }
  .empty { padding: 40px; text-align: center; color: #94a3b8; }
  .loading { padding: 40px; text-align: center; color: #94a3b8; }

  /* 교사용 그리드 */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; padding: 14px; }
  .tcell { border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; background:#fff; }
  .tcell:hover { background: #faf5ff; }
  .tcell.stale { border-color: #fca5a5; background: #fef2f2; }
  .tcell .tn { font-weight: 700; font-size: 15px; }
  .tcell .tstat { font-size: 12px; color: #7c3aed; margin-top: 4px; }
  .tcell .tlast { font-size: 11px; margin-top: 3px; }
  .set-row { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .set-row input[type=text]{ flex:1; padding:9px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; }
  .set-del { color:#ef4444; cursor:pointer; font-size:18px; padding:2px 8px; }
  .set-add { margin-top:8px; padding:9px 14px; border:1px dashed #c4b5fd; background:#faf5ff; color:#6d28d9; border-radius:8px; cursor:pointer; font-weight:700; }

  /* 모달 */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; }
  .modal-bg.show { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; max-height: 85vh;
           overflow: auto; padding: 20px; }
  .modal h2 { font-size: 17px; color: #6d28d9; margin-bottom: 4px; }
  .modal .mcount { font-size: 13px; color: #64748b; margin-bottom: 12px; }
  .mitem { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
  .mitem .mk { flex-shrink: 0; width: 44px; font-weight: 700; }
  .mk.발표 { color: #7c3aed; } .mk.칭찬 { color: #0d9488; }
  .mitem .md { flex: 1; }
  .mitem .mdate { color: #94a3b8; font-size: 11px; }
  .closebtn { float: right; cursor: pointer; color: #94a3b8; font-size: 22px; line-height: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏅 도장 데이터 <span class="sub">교사 전용 · 발표/칭찬 현황</span></h1>

  <div class="toolbar">
    <select id="classSel" onchange="load()"><option value="all">전체 반</option></select>
    <select id="periodSel" onchange="load()">
      <option value="all">전체 기간</option>
      <option value="30">최근 30일</option>
      <option value="7">최근 7일</option>
    </select>
    <button id="staleBtn" class="toggle" onclick="toggleStale()">⚠ 소외만</button>
    <button id="viewBtn" onclick="toggleView()">▦ 그리드 보기</button>
    <div class="spacer"></div>
    <button onclick="openWs()">📘 학습지 관리</button>
    <button onclick="openSettings()">⚙ 설정</button>
    <button onclick="openCarry()">📥 기존 이월 입력</button>
    <button class="primary" onclick="load()">↻ 새로고침</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="card">
    <div id="grid"><div class="loading">불러오는 중…</div></div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<div class="modal-bg" id="carryBg" onclick="if(event.target===this)closeCarry()">
  <div class="modal" id="carryBox" style="max-width:640px;"></div>
</div>

<div class="modal-bg" id="setBg" onclick="if(event.target===this)closeSettings()">
  <div class="modal" id="setBox" style="max-width:480px;"></div>
</div>

<div class="modal-bg" id="wsBg" onclick="if(event.target===this)closeWs()">
  <div class="modal" id="wsBox" style="max-width:520px;"></div>
</div>

<script>
  var STATE = { rows: [], staleOnly: false, staleDays: 14, view: 'table', categories: [], staleCat: '' };

  function toggleStale() {
    STATE.staleOnly = !STATE.staleOnly;
    document.getElementById('staleBtn').classList.toggle('on', STATE.staleOnly);
    render();
  }
  function toggleView() {
    STATE.view = STATE.view === 'table' ? 'grid' : 'table';
    document.getElementById('viewBtn').textContent = STATE.view === 'table' ? '▦ 그리드 보기' : '☰ 표 보기';
    render();
  }

  function loadClasses() {
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) return;
      var sel = document.getElementById('classSel');
      res.classes.forEach(function(c){
        var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
      });
    }).getClassList();
  }

  function load() {
    document.getElementById('grid').innerHTML = '<div class="loading">불러오는 중…</div>';
    var cls = document.getElementById('classSel').value;
    var period = document.getElementById('periodSel').value;
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) {
        document.getElementById('grid').innerHTML = '<div class="empty">불러오기 실패: ' + ((res&&res.message)||'') + '</div>';
        return;
      }
      STATE.rows = res.rows; STATE.staleDays = res.staleDays;
      STATE.categories = res.categories || [];
      STATE.staleCat = res.staleCat || '';
      renderChips(res.summary);
      render();
    }).getDojangData(cls, period, '');
  }

  function renderChips(s) {
    var html = chip('학생', s.students);
    (STATE.categories||[]).forEach(function(c){
      html += chip(c.emoji + ' ' + c.name, (s.perCat && s.perCat[c.name]) || 0);
    });
    html += chip('소외(' + STATE.staleDays + '일+)', s.staleCount, s.staleCount > 0);
    document.getElementById('chips').innerHTML = html;
  }
  function chip(label, val, warn) {
    return '<div class="chip' + (warn?' warn':'') + '">' + esc(label) + ' <b>' + val + '</b></div>';
  }

  function elapsedHtml(r) {
    var sc = STATE.staleCat;
    var cnt = (r.counts && r.counts[sc]) || 0;
    if (cnt === 0) return '<span class="elapsed-bad">미기록</span>';
    var l = r.last && r.last[sc];
    if (!l) return '-';
    var d = l.elapsed;
    var cls = d >= STATE.staleDays ? 'elapsed-bad' : (d >= 7 ? 'elapsed-warn' : 'elapsed-ok');
    return '<span class="' + cls + '">' + (d === 0 ? '오늘' : d + '일 전') + '</span>';
  }

  function render() {
    var rows = STATE.staleOnly ? STATE.rows.filter(function(r){ return r.stale; }) : STATE.rows;
    if (!rows.length) {
      document.getElementById('grid').innerHTML = '<div class="empty">표시할 데이터가 없어요.</div>';
      return;
    }
    if (STATE.view === 'grid') { renderGrid(rows); return; }
    var cats = STATE.categories || [];
    var sc = STATE.staleCat;
    var h = '<table><thead><tr><th>이름</th><th>반</th>';
    cats.forEach(function(c){ h += '<th>'+c.emoji+' '+esc(c.name)+'</th>'; });
    h += '<th>합계</th><th>최근('+esc(sc)+')</th><th>경과</th>';
    cats.forEach(function(c){ h += '<th>'+esc(c.name)+'<br>등수</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(function(r){
      h += '<tr class="' + (r.stale?'stale':'') + '">'
        + '<td class="name" onclick="openDetail(\'' + r.sid + '\')">' + (r.stale?'<span class="warnico">⚠ </span>':'') + esc(r.name) + '</td>'
        + '<td>' + esc(r.cls) + '</td>';
      cats.forEach(function(c){ h += '<td><b style="color:#6d28d9;">' + (r.counts[c.name]||0) + '</b></td>'; });
      var lastInfo = (r.last && r.last[sc]) ? (r.last[sc].date) : '-';
      h += '<td>' + r.total + '</td>'
        + '<td>' + lastInfo + '</td>'
        + '<td>' + elapsedHtml(r) + '</td>';
      cats.forEach(function(c){
        var cnt = r.counts[c.name]||0;
        h += '<td class="rank">' + (cnt>0 ? (r.rankAll[c.name]+'/'+r.rankClass[c.name]) : '-') + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    document.getElementById('grid').innerHTML = h
      + '<div style="font-size:11px;color:#94a3b8;padding:8px 12px;">등수 = 전체/반 (항목별)</div>';
  }

  function openDetail(sid) {
    document.getElementById('modalBg').classList.add('show');
    document.getElementById('modalBox').innerHTML = '<div class="loading">불러오는 중…</div>';
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) { closeModal(); return; }
      var row = STATE.rows.filter(function(x){ return x.sid === sid; })[0] || {};
      var cnts = (STATE.categories||[]).map(function(c){ return c.emoji + ' ' + c.name + ' ' + ((row.counts&&row.counts[c.name])||0); }).join('  ·  ');
      var h = '<span class="closebtn" onclick="closeModal()">×</span>'
        + '<h2>' + esc(res.name || row.name || sid) + '</h2>'
        + '<div class="mcount">' + cnts
        + (res.carry && (res.carry.present||res.carry.praise) ? '  <span style="color:#94a3b8">(이월 발표 '+res.carry.present+'·칭찬 '+res.carry.praise+' 포함)</span>' : '')
        + '</div>';
      if (!res.items.length) {
        h += '<div class="empty">기록된 도장 내역이 없어요. (이월만 있을 수 있음)</div>';
      } else {
        res.items.forEach(function(it){
          var info = [it.sheet, it.problem].filter(Boolean).join(' · ');
          h += '<div class="mitem"><div class="mk ' + it.kind + '">' + esc(it.kind) + '</div>'
            + '<div class="md">' + (esc(info) || esc(it.reason) || '-')
            + (info && it.reason ? ' <span style="color:#94a3b8">('+esc(it.reason)+')</span>' : '')
            + '<div class="mdate">' + it.date + (it.time?' '+it.time:'') + (it.period?' · '+esc(it.period)+'차시':'') + '</div>'
            + '</div></div>';
        });
      }
      document.getElementById('modalBox').innerHTML = h;
    }).getStudentDetail(sid);
  }
  function closeModal() { document.getElementById('modalBg').classList.remove('show'); }

  function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function renderGrid(rows) {
    var cats = STATE.categories || [];
    var h = '<div class="tgrid">';
    rows.forEach(function(r){
      var stat = cats.map(function(c){ return c.emoji + (r.counts[c.name]||0); }).join(' · ');
      h += '<div class="tcell '+(r.stale?'stale':'')+'" onclick="openDetail(\''+r.sid+'\')">'
        + '<div class="tn">'+(r.stale?'⚠ ':'')+esc(r.name)+'</div>'
        + '<div class="tstat">'+stat+'</div>'
        + '<div class="tlast">'+elapsedHtml(r)+'</div>'
        + '</div>';
    });
    h += '</div>';
    document.getElementById('grid').innerHTML = h;
  }

  // ===== 설정 (도장 종류 + 등수 공개) =====
  var SET = { categories: [], rankVisibility: 'show' };
  function openSettings() {
    document.getElementById('setBg').classList.add('show');
    document.getElementById('setBox').innerHTML = '<div class="loading">불러오는 중…</div>';
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) { document.getElementById('setBox').innerHTML = '<div class="empty">불러오기 실패</div>'; return; }
      SET.categories = (res.categories||[]).map(function(c){ return { name:c.name, emoji:c.emoji, type:c.type, presets:(c.presets||[]).slice() }; });
      SET.rankVisibility = res.rankVisibility || 'show';
      renderSettings();
    }).getDojangSettings();
  }
  function renderSettings() {
    var h = '<span class="closebtn" onclick="closeSettings()">×</span><h2>⚙ 도장 종류 설정</h2>'
      + '<div class="mcount">학습지형=학습지·문제 선택 / 사유형=사유 버튼만</div><div id="catList">';
    SET.categories.forEach(function(c, i){
      h += '<div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;">'
        + '<div class="set-row">'
        + '<input type="text" value="'+esc(c.emoji)+'" oninput="SET.categories['+i+'].emoji=this.value" style="width:48px;text-align:center;">'
        + '<input type="text" value="'+esc(c.name)+'" placeholder="항목 이름" oninput="SET.categories['+i+'].name=this.value">'
        + '<select onchange="SET.categories['+i+'].type=this.value;renderSettings();" style="padding:8px;border:1px solid #cbd5e1;border-radius:8px;">'
        + '<option value="reason"'+(c.type!=='sheet'?' selected':'')+'>사유형</option>'
        + '<option value="sheet"'+(c.type==='sheet'?' selected':'')+'>학습지형</option></select>'
        + '<span class="set-del" onclick="delCat('+i+')">×</span></div>';
      if (c.type !== 'sheet') {
        h += '<div style="font-size:11px;color:#94a3b8;margin:6px 0 4px;">사유 프리셋 (쉼표로 구분)</div>'
          + '<input type="text" value="'+esc((c.presets||[]).join(', '))+'" oninput="SET.categories['+i+'].presets=this.value.split(\',\').map(function(x){return x.trim();}).filter(Boolean)" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;">';
      }
      h += '</div>';
    });
    h += '</div><div class="set-add" onclick="addCat()">+ 도장 종류 추가</div>';
    h += '<div class="mcount" style="margin-top:18px;">🏅 학생에게 등수 공개</div>'
      + '<div class="set-row"><label><input type="radio" name="rv" '+(SET.rankVisibility!=='teacher'?'checked':'')+' onclick="SET.rankVisibility=\'show\'"> 학생 앱에 본인 등수 표시</label></div>'
      + '<div class="set-row"><label><input type="radio" name="rv" '+(SET.rankVisibility==='teacher'?'checked':'')+' onclick="SET.rankVisibility=\'teacher\'"> 등수 숨김 (선생님만)</label></div>';
    h += '<div class="toolbar" style="margin-top:18px;"><div class="spacer"></div><button class="primary" onclick="saveSettings()">저장</button></div>';
    document.getElementById('setBox').innerHTML = h;
  }
  function addCat(){ SET.categories.push({ name:'', emoji:'🏅', type:'reason', presets:[] }); renderSettings(); }
  function delCat(i){ if(SET.categories.length<=1){alert('최소 1개는 있어야 해요');return;} SET.categories.splice(i,1); renderSettings(); }
  function saveSettings(){
    google.script.run.withSuccessHandler(function(res){
      if (res && res.success) { closeSettings(); load(); }
      else alert('저장 실패: ' + ((res&&res.message)||''));
    }).saveDojangSettings(SET.categories, SET.rankVisibility);
  }
  function closeSettings(){ document.getElementById('setBg').classList.remove('show'); }

  // ===== 학습지·문제 관리 =====
  var WS = [];
  function openWs() {
    document.getElementById('wsBg').classList.add('show');
    document.getElementById('wsBox').innerHTML = '<div class="loading">불러오는 중…</div>';
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) { document.getElementById('wsBox').innerHTML='<div class="empty">불러오기 실패</div>'; return; }
      WS = res.worksheets.map(function(w){ return { name:w.name, orig:w.name, problems:(w.problems||[]).slice() }; });
      renderWs();
    }).getWorksheetsList();
  }
  function renderWs() {
    var h = '<span class="closebtn" onclick="closeWs()">×</span><h2>📘 학습지·문제 관리</h2>'
      + '<div class="mcount">학습지별로 발표 문제를 미리 등록해두면 입력 화면에 버튼으로 떠요.</div>';
    WS.forEach(function(w, i){
      h += '<div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;">'
        + '<div class="set-row"><input type="text" value="'+esc(w.name)+'" placeholder="학습지 이름" oninput="WS['+i+'].name=this.value">'
        + '<button onclick="saveWs('+i+')" style="padding:7px 12px;border:none;background:#7c3aed;color:#fff;border-radius:7px;cursor:pointer;font-weight:700;">저장</button>'
        + '<span class="set-del" onclick="delWs('+i+')">×</span></div>'
        + '<div style="font-size:11px;color:#94a3b8;margin:6px 0 4px;">문제 (쉼표로 구분)</div>'
        + '<input type="text" value="'+esc((w.problems||[]).join(', '))+'" oninput="WS['+i+'].problems=this.value.split(\',\').map(function(x){return x.trim();}).filter(Boolean)" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;">'
        + '</div>';
    });
    h += '<div class="set-add" onclick="addWs()">+ 학습지 추가</div>';
    document.getElementById('wsBox').innerHTML = h;
  }
  function addWs(){ WS.push({ name:'', orig:'', problems:[] }); renderWs(); }
  function saveWs(i){
    var w = WS[i];
    if (!w.name.trim()) { alert('학습지 이름을 입력하세요'); return; }
    google.script.run.withSuccessHandler(function(res){
      if (res && res.success) { w.orig = w.name; alert('저장됨'); }
      else alert('저장 실패');
    }).saveWorksheet(w.orig||w.name, w.name, w.problems);
  }
  function delWs(i){
    var w = WS[i];
    if (!confirm('학습지를 삭제할까요?')) return;
    if (!w.orig) { WS.splice(i,1); renderWs(); return; }
    google.script.run.withSuccessHandler(function(res){ WS.splice(i,1); renderWs(); }).deleteWorksheet(w.orig);
  }
  function closeWs(){ document.getElementById('wsBg').classList.remove('show'); }

  // ===== 기존 이월 입력 =====
  function openCarry() {
    document.getElementById('carryBg').classList.add('show');
    var box = document.getElementById('carryBox');
    box.innerHTML = '<div class="loading">불러오는 중…</div>';
    var cls = document.getElementById('classSel').value;
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.success) { box.innerHTML = '<div class="empty">불러오기 실패</div>'; return; }
      var h = '<span class="closebtn" onclick="closeCarry()">×</span>'
        + '<h2>📥 기존 도장 이월 입력</h2>'
        + '<div class="mcount">도장판·학습지 도장의 누적 개수를 학생별로 입력하세요. (반: ' + (cls==='all'?'전체':cls) + ')</div>'
        + '<div style="max-height:60vh;overflow:auto;">'
        + '<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr>'
        + '<th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">이름</th>'
        + '<th style="padding:8px;border-bottom:1px solid #eee;">👏 칭찬</th>'
        + '<th style="padding:8px;border-bottom:1px solid #eee;">🙋 발표</th>'
        + '<th style="padding:8px;border-bottom:1px solid #eee;"></th></tr></thead><tbody>';
      res.students.forEach(function(s){
        h += '<tr data-sid="'+s.sid+'" data-name="'+esc(s.name)+'">'
          + '<td style="padding:6px 8px;font-weight:600;">'+esc(s.name)+'</td>'
          + '<td style="padding:6px 8px;text-align:center;"><input type="number" min="0" value="'+s.praise+'" class="cy-p" style="width:60px;padding:6px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;"></td>'
          + '<td style="padding:6px 8px;text-align:center;"><input type="number" min="0" value="'+s.present+'" class="cy-r" style="width:60px;padding:6px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;"></td>'
          + '<td style="padding:6px 8px;text-align:center;"><button onclick="saveCarryRow(this)" style="padding:6px 12px;border:none;background:#7c3aed;color:#fff;border-radius:7px;cursor:pointer;font-weight:700;">저장</button></td>'
          + '</tr>';
      });
      h += '</tbody></table></div>';
      box.innerHTML = h;
    }).getCarryList(cls);
  }
  function closeCarry() { document.getElementById('carryBg').classList.remove('show'); load(); }
  function saveCarryRow(btn) {
    var tr = btn.closest('tr');
    var sid = tr.getAttribute('data-sid'), name = tr.getAttribute('data-name');
    var praise = tr.querySelector('.cy-p').value, present = tr.querySelector('.cy-r').value;
    btn.textContent = '…'; btn.disabled = true;
    google.script.run.withSuccessHandler(function(res){
      if (res && res.success) { btn.textContent = '✓ 저장됨'; btn.style.background = '#16a34a'; }
      else { btn.textContent = '실패'; btn.disabled = false; }
    }).saveCarry(sid, name, praise, present);
  }

  loadClasses();
  load();
</script>
</body>
</html>
